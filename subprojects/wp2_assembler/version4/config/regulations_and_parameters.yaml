# Solar Car Competition Regulations

# No-Build Zones (NBZ)
no_build_zones:
  outer_prism:
    height: 1650  # mm
    length: 5800  # mm
    width: 2300   # mm
    ground_clearance: 40 # mm - minimum clearance for chassis, has to be smaller than wheel clearance, so that SDF canbe placed between the cut outer bb and the cut wheel.
    wheel_clearance: 100 # mm - minimum clearance for wheels, has to be smaller than seat z-coordinate, so that the seat is not affected by the cut. For current assemblies z seat is set to 101 mm.
    ground: 0 # mm

  wheel_based_rules:
    front_overhang: 0.6       # percentage, with 1 = 100%
    rear_overhang: 0.6        # percentage, with 1 = 100%
    approach_angle: 10        # in degrees
    departure_angle: 10       # in degrees

  vision_box:
    radius: 4000             # mm
    pos_height: 700          # mm from eye level
    neg_height: 400          # mm from eye level
    pos_angle: 100           # degrees from x-axis around z-axis in positive direction (right-hand rule)
    neg_angle: 100           # degrees from x-axis around z-axis in negative direction (right-hand rule)
    inner_radius: 1          # mm distance from centerline to start of vision box
    eye_level_z: 700         # mm from origin of seat - so where the butt of the driver would be

tracker_box:
  dimension:
    length: 120              # mm
    width: 120               # mm
    height: 70               # mm
  cone:
    height: 3000              # mm
    apex_angle: 120           # degrees

seat:
  dimension:
    width: 450.0            # general width of the seat
    radius_top: 835.0       # radius used to build the backrest
    minus_angle: 27.0       # angle of the backrest backwards [°]
    plus_angle: 45.0        # angle of the backrest forwards [°]
    lr_l: 1000.0            # legroom length
    lr_h: 350.0             # legroom height
    width_hr: 280.0         # headroom width
    height_hr: 300.0        # headroom height
  combinations:             # Defines the grid of seat positions that will be generated.
    start: [-1300,-924,101] # Minimum (x, y, z) coordinate of the grid. (put the seat at least 1mm above the ground clearence)
    end: [2900,924,101]     # Maximum (x, y, z) coordinate of the grid.
    how_many: [3, 3, 1]     # Number of evenly spaced samples along each axis (x, y, z).

wheel:
  tire_width: 96            # mm Silvretta tyre width
  tire_diameter: 557        # mm Silvretta tyre radius
  combinations:             # Defines the grid of seat positions that will be generated.
    count: [3,4]            # Allowed numbers of wheels to test when generating assemblies.
    start: [-1300,-1000,0]  # Minimum (x, y, z) coordinate of the grid.
    end: [2900,1000,0]      # Maximum (x, y, z) coordinate of the grid.
    how_many: [3, 5, 1]     # Number of evenly spaced samples along each axis (x, y, z).
