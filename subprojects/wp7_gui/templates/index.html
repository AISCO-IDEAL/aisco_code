<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WP7 GUI</title>
  <style>
    :root {
      --bg: #23283e;
      --panel: #23283e;
      --accent: #c82121;
      --accent-2: #9f1616;
      --text: #102018;
      --muted: #496456;
      --border: #23283e; /* FIXED: Added missing semicolon */
      --shadow: 0 10px 20px rgba(16, 32, 24, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      padding: 16px;
    }

    .page {
      height: calc(100vh - 32px);
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 12px;
      max-width: 1600px;
      margin: 0 auto;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 12px;
      overflow: hidden;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 90px;
    }

    .logo-wrap img {
      max-height: 76px;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      display: block;
    }

    .controls {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 12px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      background: var(--accent);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: var(--accent-2); }

    .progress-wrap {
      width: 100%;
      display: grid;
      gap: 6px;
    }

    .progress-label {
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 600;
    }

    progress {
      width: 100%;
      height: 18px;
      accent-color: var(--accent);
    }

    progress::-webkit-progress-value {
      background: var(--accent);
    }

    progress::-moz-progress-bar {
      background: var(--accent);
    }

    #progressText {
      font-size: 0.9rem;
      color: var(--muted);
      min-width: 120px;
      text-align: right;
    }

    .visuals-grid {
      height: 100%;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .visual-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      background: #f8fcf9;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 8px;
      min-height: 0;
    }

    .visual-card-wide {
      grid-column: 1 / -1;
    }

    .visual-title {
      font-size: 0.95rem;
      color: var(--muted);
      font-weight: 700;
    }

    .image-slot {
      width: 100%;
      height: 100%;
      min-height: 240px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #f1f7f3;
      overflow: hidden;
      display: grid;
      place-items: center;
    }

    .image-slot img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: none;
    }

    .hint {
      font-size: 0.85rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .slider-row {
      display: grid;
      gap: 6px;
    }

    .slider-row label {
      font-size: 0.9rem;
      color: var(--muted);
    }

    .slider-row input[type="range"] {
      width: 100%;
    }

    .gif-actions {
      margin-top: auto;
    }

    @media (max-width: 900px) {
      .controls {
        grid-template-columns: 1fr;
      }

      #progressText {
        text-align: left;
      }

      .visuals-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="card logo-wrap" aria-label="Team logo">
      <img id="teamLogo" src="logo.png" alt="Team logo">
    </section>

    <section class="card controls">
      <button id="btnRunLocal">RUN</button>
      <div class="progress-wrap">
        <div class="progress-label">Optimization Progress</div>
        <progress id="epochProgress" value="0" max="100"></progress>
      </div>
      <div id="progressText">0.0%</div>
    </section>

    <section class="card" style="min-height: 0;">
      <div class="visuals-grid">
        <div class="visual-card">
          <div class="visual-title">Current Run Mesh Files</div>
          <div class="image-slot">
            <img id="meshStepImage" alt="mesh step preview">
          </div>
          <div class="hint" id="meshFileName">No mesh file found for current run yet.</div>
          <div class="slider-row">
            <input id="meshSlider" type="range" min="0" max="0" value="0" step="1" disabled>
          </div>
        </div>

        <div class="visual-card">
          <div class="visual-title">Mesh Assembly GIF (slowed)</div>
          <div class="image-slot">
            <img id="artifactImage" alt="mesh assembly gif preview">
          </div>
          <div class="hint" id="artifactStatus">No GIF loaded yet.</div>
          <div class="gif-actions">
            <button id="btnRestartGif" type="button">Restart GIF</button>
          </div>
        </div>

        <div class="visual-card visual-card-wide">
          <div class="visual-title">Solar Loss Rendering GIF</div>
          <div class="image-slot">
            <img id="solarArtifactImage" alt="solar loss gif preview">
          </div>
          <div class="hint" id="solarArtifactStatus">No solar_loss_rendering GIF loaded yet.</div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const teamLogo = document.getElementById("teamLogo");
    const btnRunLocal = document.getElementById("btnRunLocal");
    const epochProgress = document.getElementById("epochProgress");
    const progressText = document.getElementById("progressText");

    const artifactImage = document.getElementById("artifactImage");
    const artifactStatus = document.getElementById("artifactStatus");
    const btnRestartGif = document.getElementById("btnRestartGif");
    const solarArtifactImage = document.getElementById("solarArtifactImage");
    const solarArtifactStatus = document.getElementById("solarArtifactStatus");
    const meshStepImage = document.getElementById("meshStepImage");
    const meshFileName = document.getElementById("meshFileName");
    const meshSlider = document.getElementById("meshSlider");

    let meshEntries = [];
    let meshPreviewEntries = [];
    let gifEntry = null;
    let currentGifKey = null;
    let solarGifEntry = null;
    let currentSolarGifKey = null;
    let currentMeshKey = null; // FIXED: Added to prevent flickering

    async function startRunLocal() {
      btnRunLocal.disabled = true;
      btnRunLocal.textContent = "RUNNING...";
      try {
        const res = await fetch("/run-local", { method: "POST" });
        await res.json();
      } catch (_error) {
        console.error("Failed to start run:", _error); // FIXED: Added error logging
      } finally {
        await refreshProgress();
        await refreshArtifacts();
      }
    }

    function updateMeshSelection(index) {
      if (!meshEntries.length) {
        meshStepImage.style.display = "none";
        meshFileName.textContent = "No mesh file found for current run yet.";
        currentMeshKey = null;
        return;
      }

      const clampedIndex = Math.max(0, Math.min(index, meshEntries.length - 1));
      const meshFile = meshEntries[clampedIndex];
      meshFileName.textContent = meshFile.name;

      const preview = meshPreviewEntries.find((entry) => entry.epoch === meshFile.epoch);
      if (preview) {
        // FIXED: Only update src if the URL has actually changed to prevent flickering
        if (currentMeshKey !== preview.url) {
          // FIXED: Use correct separator for cache busting
          const separator = preview.url.includes('?') ? '&' : '?';
          meshStepImage.src = `${preview.url}${separator}t=${Date.now()}`;
          currentMeshKey = preview.url;
        }
        meshStepImage.style.display = "block";
      } else {
        meshStepImage.style.display = "none";
        currentMeshKey = null;
      }
    }

    function updateGifDisplay() {
      if (!gifEntry) {
        artifactImage.style.display = "none";
        artifactStatus.textContent = "No mesh_assembly_mode GIF found for current run.";
        currentGifKey = null;
        btnRestartGif.disabled = true;
        return;
      }

      if (currentGifKey !== gifEntry.key) {
        // FIXED: Use correct separator for cache busting
        const separator = gifEntry.playUrl.includes('?') ? '&' : '?';
        artifactImage.src = `${gifEntry.playUrl}${separator}t=${Date.now()}`;
        currentGifKey = gifEntry.key;
      }
      artifactImage.style.display = "block";
      artifactStatus.textContent = "";
      btnRestartGif.disabled = false;
    }

    function restartGif() {
      if (!gifEntry) {
        return;
      }
      // FIXED: Use correct separator for cache busting
      const separator = gifEntry.playUrl.includes('?') ? '&' : '?';
      artifactImage.src = `${gifEntry.playUrl}${separator}t=${Date.now()}`;
      artifactStatus.textContent = "";
    }

    function updateSolarGifDisplay() {
      if (!solarGifEntry) {
        solarArtifactImage.style.display = "none";
        solarArtifactStatus.textContent = "No solar_loss_rendering GIF found for current run.";
        currentSolarGifKey = null;
        return;
      }

      if (currentSolarGifKey !== solarGifEntry.key) {
        const separator = solarGifEntry.playUrl.includes('?') ? '&' : '?';
        solarArtifactImage.src = `${solarGifEntry.playUrl}${separator}t=${Date.now()}`;
        currentSolarGifKey = solarGifEntry.key;
      }
      solarArtifactImage.style.display = "block";
      solarArtifactStatus.textContent = "";
    }

    async function refreshArtifacts() {
      try {
        const res = await fetch(`/run-local/artifacts?t=${Date.now()}`, { cache: "no-store" });
        const data = await res.json();

        const gifList = data.mesh_assembly_gifs || [];
        if (gifList.length > 0) {
          const selectedGif = gifList[0];
          gifEntry = {
            key: selectedGif.rel_path || selectedGif.name,
            name: selectedGif.name,
            playUrl: selectedGif.slow_url || selectedGif.url,
            firstFrameUrl: selectedGif.first_frame_url || null
          };
          updateGifDisplay();
        } else {
          gifEntry = null;
          updateGifDisplay();
        }

        const solarGifList = data.solar_loss_gifs || [];
        if (solarGifList.length > 0) {
          const selectedSolarGif = solarGifList[0];
          solarGifEntry = {
            key: selectedSolarGif.rel_path || selectedSolarGif.name,
            name: selectedSolarGif.name,
            playUrl: selectedSolarGif.url
          };
          updateSolarGifDisplay();
        } else {
          solarGifEntry = null;
          updateSolarGifDisplay();
        }

        meshEntries = data.meshes || [];
        meshPreviewEntries = data.mesh_step_images || [];
        if (meshEntries.length > 0) {
          meshSlider.disabled = false;
          meshSlider.min = "0";
          meshSlider.max = String(meshEntries.length - 1);
          if (Number(meshSlider.value) > meshEntries.length - 1) {
            meshSlider.value = String(meshEntries.length - 1);
          }
          updateMeshSelection(Number(meshSlider.value));
        } else {
          meshSlider.disabled = true;
          meshSlider.min = "0";
          meshSlider.max = "0";
          meshSlider.value = "0";
          updateMeshSelection(0);
        }
      } catch (_error) {
        console.error("Failed to fetch artifacts:", _error); // FIXED: Added error logging
      }
    }

    async function refreshProgress() {
      try {
        const res = await fetch(`/run-local/progress?t=${Date.now()}`, { cache: "no-store" });
        const data = await res.json();

        const pct = Number(data.progress_percent || 0);
        epochProgress.value = pct;
        progressText.textContent = `${pct.toFixed(1)}%`;

        if (data.running) {
          btnRunLocal.disabled = true;
          btnRunLocal.textContent = "RUNNING...";
        } else {
          btnRunLocal.disabled = false;
          btnRunLocal.textContent = "RUN";
        }
      } catch (_error) {
        console.error("Failed to fetch progress:", _error); // FIXED: Added error logging
      }
    }

    teamLogo.onerror = () => {
      teamLogo.style.display = "none";
    };

    btnRunLocal.addEventListener("click", startRunLocal);
    btnRestartGif.addEventListener("click", restartGif);
    meshSlider.addEventListener("input", () => {
      updateMeshSelection(Number(meshSlider.value));
    });

    refreshProgress();
    refreshArtifacts();
    setInterval(refreshProgress, 1000);
    setInterval(refreshArtifacts, 3000);
  </script>
</body>

</html>
