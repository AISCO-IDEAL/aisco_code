# =============================================================================
# AISCOModel pretraining sweep — push past the "cigar / ellipsoid" attractor.
#
# Uses pretraining_single.py (replaces pretraining_v4.py) which fixes the
# *structural* causes of the ellipsoid collapse that no hyperparameter sweep
# on v4 could overcome:
#   * 50/50 uniform/jitter sampling with hardcoded σ = 5 % bbox  → replaced
#     with dual-band near-surface (σ as low as 0.5 % bbox) + outer-prism domain.
#   * MSE_surface + eikonal_weight * eikonal              → replaced with L1-all
#     on (surface ∪ domain) pts.  GT SDF magnitudes already encode |∇f| ≈ 1
#     in the far field, so no separate eikonal regulariser is needed.
#
# Coverage of the 5 hypothesised root causes:
#   1. Aggressive smoothing (eikonal + smooth activations)
#       -> eikonal removed entirely; activations profile swept (5 variants).
#   2. Tiny LR
#       -> swept: learning_rate log 5e-5 → 1e-3.
#   3. Mismatched input scale
#       -> swept: input_scale ∈ {200, 400, 700, 1000}.
#   4. Limited input re-injection
#       -> swept: concat_input_at (4 variants) + residual_at (4 variants).
#   5. Small batch / bad sampling
#       -> swept: batch_size, near_surface_tight_sigma, near_surface_fraction.
#
# Launch:
#   wandb sweep subprojects/wp4_aeroshell_optimizer/v2/configs/sweeps/aiscomodel_complexity_sweep.yaml
#   # then edit SWEEP_ID in slurm_scripts/launch_sweep.sh and `sbatch` it.
# =============================================================================

program: subprojects/wp4_aeroshell_optimizer/v2/src/main_files/pretraining_single.py
entity: aisco
project: AISCOModel_Pretraining_Single

method: bayes
metric:
  goal: minimize
  name: pretraining/total_loss

# Early-terminate clearly-bad runs (e.g. snake-blowup, NaN-collapse) so the
# Bayesian optimiser spends its budget on viable configs.
early_terminate:
  type: hyperband
  min_iter: 100
  eta: 3

parameters:
  # Pin the model class (smart_model_init reads this from the registered config).
  pretraining_single_config.model_name:
    value: "AISCOModel"

  # ---- Training-loop knobs (most leverage on shape complexity) -------------

  # Higher LRs let the network actually leave the spherical init basin.
  # 5e-5 (current) included as control.
  pretraining_single_config.training_loop.learning_rate:
    distribution: log_uniform_values
    min: 0.00005
    max: 0.001

  # Bigger surface batches give a denser geometry signal per step.
  pretraining_single_config.training_loop.batch_size:
    values: [2048, 4096, 8192]

  # Cosine schedule + L1-all converge faster than v4's Reduce-on-plateau + MSE,
  # so 300/500/700 is a more useful range than v4's 700/1200/1800.
  pretraining_single_config.training_loop.epochs:
    values: [300, 500, 700]

  # ---- Sampling — biggest leverage now that L1-all replaces eikonal --------
  # Tighter σ pins the surface harder; controlling fractions trades surface
  # detail vs far-field SDF coverage.
  pretraining_single_config.training_loop.near_surface_tight_sigma:
    values: [0.002, 0.005, 0.01, 0.02]

  pretraining_single_config.training_loop.near_surface_fraction:
    values: [0.20, 0.30, 0.50, 0.70]

  pretraining_single_config.training_loop.domain_fraction:
    values: [0.20, 0.30, 0.50]

  # ---- Coordinate scaling (frequency budget) -------------------------------

  # Lower input_scale → larger effective input magnitudes → MLP gets a wider
  # frequency budget and can carve sharper features. Keep ≥ ~150 mm or
  # gradients explode on the eikonal term.
  models/AISCOModel_v0.input_scale:
    values: [200.0, 400.0, 700.0, 1000.0]

  # Output scale is mostly numerical; keep it close to input_scale so the
  # SDF magnitudes match Silvretta's mm metric.
  models/AISCOModel_v0.output_scale:
    values: [500.0, 1000.0]

  # ---- Capacity ------------------------------------------------------------
  # NOTE: hidden_dims is a list of length 9; W&B sweeps don't handle nested
  # list mutations cleanly, so we expose a single width multiplier knob.
  # The default config (256/256/256/512/512/512/512/384/256) is the 1.0x
  # baseline. If you want to actually use this, wire `hidden_width_mult`
  # into AISCOModel_v0.yaml via a small loader change; otherwise leave the
  # block commented.
  # models/AISCOModel_v0.hidden_width_mult:
  #   values: [1.0, 1.25, 1.5]

  # ---- Activation profile (issue #1: smoothing collapse) ------------------
  # Each entry is a complete length-10 list (9 hidden + 1 output) — sweep-as-
  # categorical so we directly contrast smooth-only profiles against ones with
  # higher-frequency / piecewise-linear capacity.
  #
  # The smoothness pressure that produces the ellipsoid attractor comes from
  # the *combination* of (a) high eikonal_weight and (b) every layer being a
  # smooth activation. Lowering only (a) helps; mixing in higher-frequency
  # activations (snake) or piecewise-linear ones (leakyrelu) at mid-depth
  # gives the network a basis that *can* represent crease/concavity features.
  #
  # Profiles (rationale):
  #   A: all-silu baseline (control — currently best, but ellipsoidal).
  #   B: known-good mixed profile from your config notes.
  #   C: leakyrelu mid-stack — piecewise-linear capacity for sharp features.
  #   D: snake at mid-depth — periodic capacity for creases (kept AWAY from
  #      layer 1 and from layers right after concat per your past NaN notes).
  #   E: gelu/mish blend — smooth but with stronger non-linearity than silu.
  models/AISCOModel_v0.activations:
    values:
      - [silu, silu, silu, silu, silu, silu, silu, silu, silu, linear]
      - [linear, silu, gelu, leakyrelu, gelu, leakyrelu, silu, leakyrelu, silu, linear]
      - [silu, silu, leakyrelu, silu, leakyrelu, silu, leakyrelu, silu, silu, linear]
      - [silu, silu, gelu, snake, gelu, snake, gelu, silu, silu, linear]
      - [silu, gelu, mish, gelu, mish, gelu, mish, gelu, silu, linear]

  # ---- Input re-injection (issue #4) --------------------------------------
  # Each entry is a complete list of 1-indexed layers where the (scaled)
  # input features are re-concatenated. More re-injection points = stronger
  # positional signal in deeper layers = more ability to carve high-frequency
  # geometry. Residual_at is co-swept to keep the architecture self-consistent
  # (residuals at the same layers maintain gradient flow despite the wider
  # concat inputs).
  models/AISCOModel_v0.concat_input_at:
    values:
      - [3, 5, 8]                # current (control)
      - [2, 4, 6, 8]             # 4 re-injection points, evenly spaced
      - [1, 3, 5, 7, 9]          # aggressive: every-other layer
      - [3, 4, 5, 6, 7, 8]       # dense in the wide (512) middle stack

  models/AISCOModel_v0.residual_at:
    values:
      - [5, 8]                   # current (control)
      - [3, 5, 8]                # extra residual at the first concat point
      - [4, 6, 8]                # residuals on the 512-wide trunk
      - []                       # ablation: no residuals

  # ---- Snake activation alpha (only matters if profile D is selected) -----
  # Higher α = higher-frequency content. Keep small per your past NaN notes.
  models/AISCOModel_v0.snake_alpha_init:
    values: [0.2, 0.4, 0.8]
