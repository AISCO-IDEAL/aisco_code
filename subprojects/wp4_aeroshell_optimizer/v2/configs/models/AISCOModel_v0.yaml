# Loaded by smart_model_init -> passed as **model_config to AISCOModel(...).
# Every key here maps directly to an AISCOModel.__init__ argument.

# --- I/O ---
in_features: 3        # x, y, z
out_features: 1       # signed distance scalar

# --- Architecture (10 Linear layers total = len(hidden_dims) + 1) ---
# Spec:
#   layer 1: 3   -> 256
#   layer 2: 256 -> 256
#   layer 3: 256 -> 256       (concat input)
#   layer 4: 256 -> 512
#   layer 5: 512 -> 512       (concat input + residual)
#   layer 6: 512 -> 512
#   layer 7: 512 -> 512
#   layer 8: 512 -> 256       (concat input + residual)
#   layer 9: 256 -> 128
#   layer 10: 128 -> 1        (output)
# hidden_dims: [256, 256, 256, 512, 512, 512, 512, 256, 128] # old
hidden_dims: [256, 256, 256, 512, 512, 512, 512, 384, 256] # 13


# Activation applied AFTER each Linear (length = len(hidden_dims) + 1).
# Recognised: silu, gelu, relu, leakyrelu, elu, selu, mish, softplus, tanh,
#             snake, linear.
# (Sine/SIREN was removed: it proved unstable and produced wobbly SDFs.)
#
# Quick guide for SDFs (cars / boats):
#   silu, gelu, mish     -> smooth surfaces, good gradients (best general default)
#   elu, selu            -> smooth + non-zero mean; can sharpen mid-layer features
#   softplus             -> very smooth, excellent for Eikonal regularisation
#   leakyrelu, relu      -> piecewise-linear, edge-friendly but cardboard-like SDF
#   tanh                 -> bounded; useful at output for SDF clamping
#   snake                -> periodic capacity for creases. Sensitive: keep `snake_alpha_init`
#                          small (0.2-0.5) and place snake AWAY from layer 1 and AWAY
#                          from layers right after `concat_input_at` (your past
#                          NaNs came from snake at layer 1 + concat re-injection).

# previous test results:
# https://wandb.ai/aisco/AISCOModel_Pretraining/table
activations: [linear, silu, gelu, leakyrelu, gelu, leakyrelu, silu, leakyrelu, silu, linear] # pretraining on silvretta: just a very smooth and bullet-form ellipsoid; eikonal loss: decays to zero very fast; wandb: honest-morning-1
# activations: [silu, silu, silu, silu, silu, silu, silu, silu, silu, linear] # pretraining on silvretta: very smooth ellipsoid, but way closer to the sphere; eikonal loss: decaying slower and staying a little higher; wandb: likely-leaf-5
# activations: [silu, silu, gelu, gelu, gelu, gelu, gelu, silu, silu, linear] # pretraining on silvretta: empty mesh; eikonal loss: decay only until 0.8; wandb: comic-sponge-6
# activations: [silu, silu, gelu, gelu, gelu, gelu, gelu, silu, silu, tanh] # pretraining on silvretta: empty mesh; eikonal loss: decay only until 0.8; wandb: golden-snowflake-7
# activations: [silu, silu, mish, mish, mish, mish, mish, silu, silu, linear] # pretraining on silvretta: very smooth ellipsoid, but way closer to the sphere; eikonal loss: decaying slower until 0.05 ; wandb: vital-firefly-8
# activations: [silu, silu, silu, silu, silu, snake, silu, silu, silu, linear] # pretraining on silvretta: very smooth ellipsoid, but way closer to the sphere; eikonal loss: decaying slower until 0.05; wandb: deep-sponge-9



# basic MLP: pretraining on silvretta: empty mesh extracted wandb: true-oath-2; eikonal loss: decaying to 1 only; wandb: eager-resonance-3
# WIREV2: pretraining on silvretta: very wobbly, fails to capture silvretta, just some connected blobs eikonal loss: decaying a slower than AISCOModel, oscillating around 0.3; wandb: jolly-microwave-4
# ExampleModel: pretraining on silvretta: ; eikonal loss: ; wandb:


# 1-indexed layer numbers where the (scaled) input features are re-concatenated
# onto the layer's input.
# concat_input_at: [3, 5, 8] # old, struggle to move away from ellipsoid
concat_input_at: [3, 5, 8] # activations: [linear, silu, gelu, leakyrelu, gelu, leakyrelu, silu, leakyrelu, silu, linear] -> this combination produced an empty mesh

# 1-indexed layer numbers where the layer's input (after any concat) is added
# back to its post-activation output. A learnable projection is auto-created
# when input/output dims differ (e.g. layer 8: 515 -> 256).
# residual_at: [5, 8] # old, struggly to move away from ellipsoid
# residual_at: [] # activations: [linear, silu, gelu, leakyrelu, gelu, leakyrelu, silu, leakyrelu, silu, linear] -> this combination produced an empty mesh
residual_at: [5, 8] # activations: [linear, silu, gelu, leakyrelu, gelu, leakyrelu, silu, leakyrelu, silu, linear] -> this combination produced

# --- Coordinate scaling ---
input_scale: 1000.0   # divides input (mm -> ~unit-scale)
output_scale: 1000.0  # multiplies output (back to mm)

# --- Misc ---
bias: true

# Initial value for Snake's learnable per-channel alpha (only matters if any
# `snake` entry is in `activations`). Higher = higher-frequency capacity at
# init. For SDFs use 0.2-0.5; values >= 1.0 here have already produced NaNs
# in this codebase (see test results above).
snake_alpha_init: 0.2

# --- Memory control ---
# When the input batch dimension exceeds this value, forward() splits the
# input into chunks of this size and concatenates the outputs. This bounds
# peak activation memory for dense-grid evaluations (e.g. ConnectednessV1's
# voxel grid which previously triggered a 4 GiB CUDA OOM on layer 5/512).
# Set to 0 to disable chunking (matches old behaviour).
forward_chunk_size: 131072
