general_info:
  # config_debugging: "True"  # NOT USED — never read by any code in src/
  CSE: "False"  # Cruising Speed Estimation  # USED — total_loss.py: self.losses_config["general_info"]["CSE"] == "True"
  ALM: "True"  # Augmented Lagrangian Method  # USED — total_loss.py: self.losses_config["general_info"]["ALM"] == "True"
  alm_thresholds: [0.1, 0.1, 0.1]  # thresholds for constraint losses [bb, eikonal, smoothness]  # USED — total_loss.py: self.losses_config["general_info"]["alm_thresholds"]
  initial_lambda: 0.01  # initial value for lambda in ALM  # USED — total_loss.py: alm_info.get("initial_lambda", 0.01)
  initial_mu: 1.0  # initial value for mu in ALM  # USED — total_loss.py: alm_info.get("initial_mu", 1.0)
  initial_nu: 1.0  # initial value for nu in ALM (CSE penalty parameter)  # USED — total_loss.py: alm_info.get("initial_nu", 1.0)
  alpha: 0.99  # factor to increase mu in ALM if constraint not met  # USED — total_loss.py: alm_info.get("alpha", 0.99)
  gamma: 0.01  # parameter for ALM penalty update  # USED — total_loss.py: alm_info.get("gamma", 0.01)

losses: # [compute: bool, weight: float, path: str]  # USED — total_loss.py dynamically loads and instantiates all losses with compute=1
  # NOTE: that for each loss class, only one version should have compute=True
  aero:
    # frontal_area_v0: [0, 0.0, "subprojects/wp4_aeroshell_optimizer/v1/src/losses/aerodynamic_loss/frontal_area_v0.py"]  # NOT ACTIVE (compute=0)
    # crude_estimator_v0: [0, 0.0, "subprojects/wp4_aeroshell_optimizer/v1/src/losses/aerodynamic_loss/crude_estimator_v0.py"]  # NOT ACTIVE (compute=0)
    null_loss_aero_v1_: [1, 0.0, "subprojects/wp4_aeroshell_optimizer/v1/src/losses/aerodynamic_loss/null_loss_aero_v1.py"]  # ACTIVE — loaded by total_loss.py
    gaot_loss: [0, 0.0, "subprojects/wp4_aeroshell_optimizer/v1/src/losses/aerodynamic_loss/gaot_loss.py"]  # NOT ACTIVE (compute=0)
  bb:
    # bb_v1: [0,100, "subprojects/wp4_aeroshell_optimizer/v1/src/losses/bb_loss/bb_v1.py"]  # NOT ACTIVE (compute=0)
    # bb_v2: [0, 1000, "subprojects/wp4_aeroshell_optimizer/v1/src/losses/bb_loss/bb_v2.py"] # not working as of 2025 12 15  # NOT ACTIVE (compute=0)
    null_loss_bb_v1: [0, 0.0, "subprojects/wp4_aeroshell_optimizer/v1/src/losses/bb_loss/null_loss_bb_v1.py"]  # NOT ACTIVE (compute=0)
    bb_v3: [1, 100, "subprojects/wp4_aeroshell_optimizer/v1/src/losses/bb_loss/bb_v3.py"] # new version with random assembly_id for more variety  # ACTIVE — loaded by total_loss.py

  eikonal:
    eikonal_v0: [1, 10.0, "subprojects/wp4_aeroshell_optimizer/v1/src/losses/eikonal_loss/eikonal_v0.py"]  # ACTIVE — loaded by total_loss.py

  smoothness:
    smoothness_v0: [1, 0.0, "subprojects/wp4_aeroshell_optimizer/v1/src/losses/smoothness_loss/smoothness_v0.py"]  # ACTIVE — loaded by total_loss.py

  solar:
    solar_v0: [0, 1.0, "subprojects/wp4_aeroshell_optimizer/v1/src/losses/solar_loss/solar_v0.py"]
    solar_v0_brute_force: [0, 100.0, "subprojects/wp4_aeroshell_optimizer/v1/src/losses/solar_loss/solar_v0_brute_force.py"]
    solar_v1_brute_force: [0, 100.0, "subprojects/wp4_aeroshell_optimizer/v1/src/losses/solar_loss/solar_v1_brute_force.py"]
    solar_v2: [0, 100.0, "subprojects/wp4_aeroshell_optimizer/v1/src/losses/solar_loss/solar_v2.py"]
    solar_v3: [0, 50.0, "subprojects/wp4_aeroshell_optimizer/v1/src/losses/solar_loss/solar_v3.py"]
    solar_v3B: [0, 50.0, "subprojects/wp4_aeroshell_optimizer/v1/src/losses/solar_loss/solar_v3B.py"]
    solar_v4: [1, 50.0, "subprojects/wp4_aeroshell_optimizer/v1/src/losses/solar_loss/solar_v4.py"]
    solar_v5: [0, 50.0, "subprojects/wp4_aeroshell_optimizer/v1/src/losses/solar_loss/solar_v5.py"]
    solar_v6: [0, 50.0, "subprojects/wp4_aeroshell_optimizer/v1/src/losses/solar_loss/solar_v6.py"]
    null_loss_solar_v1: [0, 0.0, "subprojects/wp4_aeroshell_optimizer/v1/src/losses/solar_loss/null_loss_solar_v1.py"]

  total:
    total_loss: [1, 1.0, "subprojects/wp4_aeroshell_optimizer/v1/src/losses/total_loss.py"]  # SKIPPED — total_loss.py skips category "total" explicitly

get_points_params: # used in eikonal and smoothness loss  # USED — parent_loss.py: self.losses_config["get_points_params"]["num_points"] and ["bbox_size"]
  num_points: 1000  # USED — parent_loss.py
  bbox_size: 10.0  # USED — parent_loss.py

