# USED — loaded by WP3's SolarLossEstimator via SolarLossConfigV4.australia_cfg path
# All keys are consumed by WP3 code (subprojects/wp3_solar_estimator/)
general:
  path: "subprojects/wp3_solar_estimator/australia/route_preprocessed.csv"  
  timezone: "Australia/Darwin" #insert "Australia/Darwin" or "Australia/Adelaide" here,recommended to not touch 

route_generation: # in time_sweep mode
  race_distance: 3026 # in km, don't change unless you have new/better data  # USED — WP3
  intervals: 600 # in km ### Use? compared to 
  solar_samples: 6

sun_generation:
  racing_window: [9.0,17.0] # [float,float] times during which you can race, e.g. 13:30 would be 13.5  # USED — WP3
  start_date: "24/8/2025" # 2025 started on 24th of August (https://assets.worldsolarchallenge.org/app/uploads/2025/08/20102713/BWSC-2025-Official-Program-v4.pdf)  # USED — WP3
  



simulation: # If in race mode, this will determine where you 
  # Note that tweaking these 2 values to unreasonable values will cause a crash (to few points cause sampling issues) 
  average_speed: 19 #in m/s (used for validation metrics and RouteV2)  # USED — WP3
  num_points: 10  # USED — WP3
