# ============================================================================
# Wandb Sweep Config — Nullloss Validation Sweep
# ============================================================================
# This sweep tests that nulllosses work correctly and don't break ALM.
# Runs are short (5 epochs) to quickly validate functionality.
#
# Test scenarios covered:
#   1. Each nullloss individually (6 runs: aero, solar, bb, eikonal, smoothness, developability)
#   2. Two nulllosses simultaneously (1 run: bb + developability)
#
# To run this sweep with specific nullloss configurations, manually edit
# losses_v0_config.yaml before each run to toggle the appropriate nulllosses.
#
# Parameter naming: <config_filename_without_yaml>.<nested.path.to.value>
# ============================================================================

program: subprojects/wp4_aeroshell_optimizer/v2/src/main_files/main_v2.py
entity: aisco
project: nullloss_validation

method: grid

metric:
  name: total_loss
  goal: minimize

parameters:
  # Set epochs to 5 for quick validation
  training_v0_config.training_params.num_epochs:
    value: 5

  # Test different nullloss scenarios (manual config required)
  # NOTE: This is a placeholder - actual nullloss toggling must be done
  # by manually editing losses_v0_config.yaml between runs
  nullloss_scenario:
    values:
      - "baseline"          # No nulllosses active
      - "aero_null"         # null_loss_aero_v1 active
      - "solar_null"        # null_loss_solar_v1 active
      - "bb_null"           # null_loss_bb_v1 active
      - "eikonal_null"      # null_loss_eikonal_v0 active
      - "smoothness_null"   # null_loss_smoothness_v0 active
      - "developability_null"  # null_loss_developability_v0 active
      - "bb_and_dev_null"   # null_loss_bb_v1 AND null_loss_developability_v0 active

# ============================================================================
# MANUAL RUN INSTRUCTIONS
# ============================================================================
# Since wandb sweeps can't easily toggle loss compute flags in list format,
# you need to manually create 8 separate configs or runs:
#
# Run 1: Baseline (no nulllosses)
#   - All regular losses active (current config)
#
# Run 2: Aero nullloss
#   losses_v0_config.yaml:
#     aero:
#       null_loss_aero_v1: [1, 0.0, "...universal_null_losses.py"]
#       gaot_loss: [0, 1.0, "...gaot_loss.py"]
#
# Run 3: Solar nullloss
#   losses_v0_config.yaml:
#     solar:
#       null_loss_solar_v1: [1, 0.0, "...universal_null_losses.py"]
#       solar_v3B_2: [0, 1.0, "...solar_v3B_2.py"]
#
# Run 4: BB nullloss
#   losses_v0_config.yaml:
#     bb:
#       null_loss_bb_v1: [1, 0.0, "...universal_null_losses.py"]
#       bb_v4_4: [0, 10, "...bb_v4_4.py"]
#
# Run 5: Eikonal nullloss
#   losses_v0_config.yaml:
#     eikonal:
#       null_loss_eikonal_v0: [1, 0.0, "...universal_null_losses.py"]
#       eikonal_v0: [0, 100.0, "...eikonal_v0.py"]
#
# Run 6: Smoothness nullloss
#   losses_v0_config.yaml:
#     smoothness:
#       null_loss_smoothness_v0: [1, 0.0, "...universal_null_losses.py"]
#       smoothness_v0: [0, 0.0, "...smoothness_v0.py"]
#
# Run 7: Developability nullloss
#   losses_v0_config.yaml:
#     developability:
#       null_loss_developability_v0: [1, 0.0, "...universal_null_losses.py"]
#       developability_v0: [0, 1.0, "...developability_v0.py"]
#
# Run 8: BB + Developability nulllosses (two constraints nulled)
#   losses_v0_config.yaml:
#     bb:
#       null_loss_bb_v1: [1, 0.0, "...universal_null_losses.py"]
#       bb_v4_4: [0, 10, "...bb_v4_4.py"]
#     developability:
#       null_loss_developability_v0: [1, 0.0, "...universal_null_losses.py"]
#       developability_v0: [0, 1.0, "...developability_v0.py"]
