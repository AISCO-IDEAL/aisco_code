training_params:
  learning_rate: 0.0005  # basic_MLP_v1.py reads training_config["training_params"].get("learning_rate", 0.001)
  num_epochs: 20 # basic_MLP_v1.py: training_config["training_params"].get("num_epochs", 1000)
  mesh_save_interval: 10  # basic_MLP_v1.py: training_config["training_params"].get("mesh_save_interval", 50)
  marching_cubes_usage: "False"  # storage_utils.py: general_config["general_info"].get("marching_cubes_usage", "False") (if True, uses marching cubes with threads for mesh extraction, if False uses kaolin-based mesh extraction without threads, which is more stable but slower)
