general_info:
  username: "eschaerer"
  version: "v1"
  device: "cuda"
  model: "SDFNetwork"
  model_Expl: "an SDF Network with torch Neural Network"
  pre: "a sphere as initial shape, datatype: SDF"
  post: "a PLY file representing the optimized aeroshell shape"

active_configs:
  losses: "losses_v0_config.yaml"
  pretraining: "pretraining_v0_config.yaml"
  training: "training_v0_config.yaml"
  wandb: "wandb_v0_sweep.yaml"

wandb_general:
  use_wandb: True
  track_run: 1
  rendering_frequency: 5
  use_sweep: 0

Storage_paths:
  model_dir: "wp4_aeroshell_optimizer/data/test_models"
  mesh_dir: "wp4_aeroshell_optimizer/data/test_meshes"

