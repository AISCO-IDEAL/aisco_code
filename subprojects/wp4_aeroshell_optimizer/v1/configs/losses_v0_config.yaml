bb_config:  # USED — bb_v3.py: self.losses_config["bb_config"]
  pointgrid_params:  # USED — bb_v3.py: self.__config["pointgrid_params"] -> passed to SDFfromCadQuery
    dx: 250  # USED
    dy: 250  # USED
    dz: 250  # USED
    rand: 400  # USED
