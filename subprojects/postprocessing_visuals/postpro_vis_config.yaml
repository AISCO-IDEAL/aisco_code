# aeroshell_png.py — visual configuration
# All layer colours, per-camera views, and rendering settings live here.
# CLI flags (--checkpoint, --angle_deg, --radius, etc.) are the ONLY inputs
# that must be passed on the command line; everything visual is in this file.

# ---------------------------------------------------------------------------
# Layers — set enabled: false to skip a layer entirely (zero render cost).
# Colors: '#RRGGBB' hex or [R, G, B] list (0-255 integers).
# ---------------------------------------------------------------------------
layers:
  aeroshell:
    enabled: true
    color: "#33FFFF"          # AISCO cyan
    alpha: 0.82               # slightly transparent so inner parts show through

  inner_assembly:
    enabled: true
    color: "#F39C12"          # amber
    alpha: 1.0
    fallback_wp2: true        # load from WP2 cadquery when epoch PLY is absent
    assembly_id: 1            # WP2 assembly_map.yaml key
    full_wheels: true         # replace cut-off wheel geometry with full cylinders

  windshield:
    enabled: true             # bake vision-cone face mask onto aeroshell (wp3_vision_cone)
    color: "#4FC3F7"          # sky blue
    alpha: 0.65               # increased from 0.40 — more visible against solar shading
    assembly_id: 1            # WP2 assembly_map.yaml key (same NBZ as inner_assembly)

  outer_bbox:
    enabled: false            # disabled by default — enable to inspect bounding box
    color: "#FF504D"          # red-orange
    alpha: 0.12
    prism_scale: 1.0          # scale factor applied to WP2 prism bounds (1.0 = exact prism)

  solar_binary_mask:
    enabled: true
    color_on: "#FFD700"       # golden yellow  — face IS in the solar budget
    # color_off removed: off-faces now inherit aeroshell base color (no extra layer)
    alpha: 1.0                # always opaque on selected faces; non-selected show aeroshell

  solar_shading:
    enabled: true
    colormap: "Blues"         # matplotlib colormap name
    alpha: 0.90               # slight transparency
    vmin: 0.0                 # illumination quality range (cos angle)
    vmax: 1.0

# ---------------------------------------------------------------------------
# Camera views — one PNG is written per entry.
# azim_deg / elev_deg: same convention as latent_rollout_gif.py (OpenGL, Z-up)
# distance_mult: multiplier on the mesh diagonal used to set camera distance
# ---------------------------------------------------------------------------
cameras:
  - name: front_iso
    azim_deg: -55.0
    elev_deg: 22.0
    distance_mult: 1.6

  - name: rear_iso
    azim_deg: 125.0
    elev_deg: 18.0
    distance_mult: 1.6

  - name: side_left
    azim_deg: -90.0
    elev_deg: 5.0
    distance_mult: 1.7

  - name: top_down
    azim_deg: -90.0
    elev_deg: 82.0
    distance_mult: 1.5

  - name: bottom_up_straight
    azim_deg: 90.0
    elev_deg: 90.0
    distance_mult: 1.5

# ---------------------------------------------------------------------------
# Rendering
# ---------------------------------------------------------------------------
image_width: 1920
image_height: 1080
no_background: true 
background_color: "#23283E"   # AISCO dark navy


# ---------------------------------------------------------------------------
# Mesh extraction (used only in .pth compute mode)
# ---------------------------------------------------------------------------
compute:
  resolution: 64              # marching-cubes grid resolution per axis
  bbox_padding: 1.25          # expand each prism face by this many mm (Z floor never padded)
  prism_scale: 1.0            # scale WP2 outer-prism bounds before mesh extraction (1.0 = exact)

# ---------------------------------------------------------------------------
# Solar computation (used only in .pth compute mode)
# Sun direction xyz in world space (mm) — does not need to be normalised.
# area_budget_mm2: maximum selectable solar panel area in mm².
# ---------------------------------------------------------------------------
solar:
  sun_dir: [-1.0, 0.0, 1.0]
  area_budget_mm2: 4200000.0   # ~4.2 m²
  effective_irradiance_W_m2: 250.0
  sigmoid_sharpness: 10.0
  soft_mask_selection_threshold: 0.5

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------
output:
  output_dir: "/cluster/work/fuge/AISCO/wp9/aeroshell_png"
  filename_prefix: "aeroshell"   # saved as {prefix}_{name}_{view}.png
  save_glb: true                 # also export a .glb scene file (one per run, all layers)

# ---------------------------------------------------------------------------
# Legend overlay
# ---------------------------------------------------------------------------
legend:
  enabled: true             # draw layer legend on each PNG
  position: bottom_left     # bottom_left | bottom_right | top_left | top_right
  filename_prefix: "aeroshell"   # saved as {prefix}_{name}_{view}.png
