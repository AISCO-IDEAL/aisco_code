model_name: "ConcatWIREV5_ENFORCE" # only used for standalone pretraining. In main loop, model_name from general_config.yaml is used.
z_placement: "circle" # circle | random_disk
z_radius: 2.0 # circle radius for pretrained latent codes.

force_pretraining: false # if false, a cached (hashed) checkpoint is reused when available

training_loop:
  epochs: 600
  learning_rate: 0.0005
  batch_size_per_shape: 8192
  logging_interval: 25 # console + W&B logging interval in epochs

  surface_resample_cadence: 0   # 0 = static surface cache (DeepSDF-style, sample once)
                                # N = refresh near-surface cache every N epochs

  # near_surface_fraction + domain_fraction must sum to ≤ 1.0
  near_surface_fraction: 0.30     # fraction of batch for near-surface pts (split between bands)
  domain_fraction: 0.50           # fraction of batch for outer_prism uniform pts
  near_surface_tight_sigma: 0.005 # tight band σ = factor × bbox_extent_mm  (≈25mm at car scale)
  near_surface_wide_sigma: null   # wide band σ (set to enable dual-band DeepSDF-style sampling)
  interior_boost_fraction: 0.20   # fraction of domain pts forced inside the target mesh

  bbox_scale_factor: 1.0  # multiply outer_prism bounds by this for domain sampling

  # Circle validity probe: after training, sample N angles on the z-circle and
  # report fraction_valid_angles (SDF min < 0 ↔ zero crossing possible → valid mesh).
  # Set to 0 to disable. Logged to W&B as latent_pretraining/circle_valid_fraction.
  circle_probe_n_angles: 36  # 10° spacing

output:
  base_dir: "/cluster/work/fuge/AISCO/pretraining/latent_pretraining"

  sdf_cache_dir: "/cluster/work/fuge/AISCO/pretraining/latent_pretraining/01_sdf_cache"
  # Cache key includes ply_path stem, ply_scale, sigma params, n_surf → hash-tagged .pt files.

  sampling_vis: false   # used in main loop; use --vis-sampling flag for standalone pretraining
  make_gif: false       # used in main loop; use --make-gif flag for standalone pretraining
  visualisation_directory: "sampling_vis"

  vis_cadence: 10           # epoch interval for sampling visualizations
  vis_show_domain_pts: true # show domain pts (grey) in sampling vis
  vis_show_target_pts: "pts"  # "pts" = surface cache pts in green | "mesh" = target PLY mesh

  mesh_resolution: 128  # marching-cubes grid resolution for final per-slot mesh extraction

