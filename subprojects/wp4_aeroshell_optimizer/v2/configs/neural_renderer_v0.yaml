#This config includes everything regarding the visualiser and its wrapper you might need

# overall visualiser/neural renderer config for default renderer instance that is used
#  visual_wrapper.py: Visualiser(**(self.config.get("neural_renderer", {})))
neural_renderer:
  image_size: 1024  #  passed to Visualiser constructor
  background_color: [0.0,0.0,0.1]  #  passed to Visualiser constructor
  anti_aliasing: true  #  passed to Visualiser constructor
  camera_mode: "look_at"  #  passed to Visualiser constructor
  viewing_angle: 40  #  passed to Visualiser constructor
general:
  store_wandb: True #Whether to upload results to wandb at the end  #  visual_wrapper.py: self.config["general"].get("store_wandb", False)


# Mesh extraction settings for converting neural SDF to renderable mesh
#  total_loss.py: load_config(v="v1", cfg_name="neural_renderer_v0.yaml").get("mesh_extraction", {})
mesh_extraction:
  # Algorithm: "mc" (marching cubes via PyMCubes/sklearn) or "dmc" (dual marching cubes via DISO)
  algorithm: "mc"  #  total_loss.py: mesh_config.get("algorithm", "mc")
  # Grid resolution per axis (e.g., 256 = 256³ grid = ~16M points)
  # Higher = more detail but slower. Typical values:
  #   - 64: Quick preview (old default, ~262K points)
  #   - 128: Fast quality (~2M points)
  #   - 256: Good quality (~16M points)
  #   - 512: High quality (~134M points, use GPU with 16GB+ VRAM)
  resolution: 256 # Conservative default, adjust based on your GPU  #  total_loss.py: mesh_config.get("resolution", 128)
  # Bounding box [[xmin,xmax], [ymin,ymax], [zmin,zmax]]
  # Adjust to encompass your geometry with some margin
  bbox: [[-5000, 5000], [-5000, 5000], [-5000, 5000]]  #  total_loss.py: mesh_config.get("bbox", ...)
  # Isovalue for surface extraction (0.0 = zero level set, standard for SDFs)
  isovalue: 0.0  #  total_loss.py: self._mesh_extraction_config.get("isovalue", 0.0)
  # Batch size for SDF evaluation (points processed per GPU call)
  # Larger = faster but more GPU memory. Recommended values:
  #   - 2048: Conservative, works on 8GB GPU
  #   - 8192: Balanced for 16GB GPU (good for 512³)
  #   - 16384: Aggressive for 24GB+ GPU
  batch_size: 8192  #  total_loss.py: self._mesh_extraction_config.get("batch_size", 8192)
  # Device for SDF evaluation ("cuda", "cpu", or specific like "cuda:0")
  device: "cuda"  #  total_loss.py: mesh_config.get("device", dev)
  # Verbose output (prints extraction stats: vertex count, backend, etc.)
  # Set false during training to reduce console spam
  verbose: false  #  total_loss.py: mesh_config.get("verbose", False)

# Insert custom modes here that should be handled by the VisualisationManager
#  visual_wrapper.py: self.config.get("rendering_modes", {})
rendering_modes:
  enabled: true #Whether to use the visual wrapper at all, if false, no rendering is done, even if modes are enabled  #  visual_wrapper.py: modes_config["enabled"]

  mesh_assembly_mode_v2: # inner+outer bb + sdf visualisation, fast compute time
    enabled: true
    class_path: "custom_modes.mesh_assembly_mode_v2:MeshAssemblyModeV2"
    config:
      store_wandb: true
      render_mode: "rgb"
      camera_position_1: [-6000, -200, 0]
      camera_position_2: [-3000, 3000, 3000]
      look_at: [0, 0, 0]
      fps: 10
      render_interval: 1
      make_gif: true
      mesh_color: [0.2, 1.0, 1.0]
      mesh_alpha: 0.5
      assembly_color: [1.0, 0.55, 0.0]
      outer_color: [1.0, 0.35, 0.15]
      outer_alpha: 0.2
      outer_edge_color: [0.0, 0.0, 0.0]
      outer_edge_strength: 1.0
      tolerance: 2.0
      angular_tolerance: 0.4


  #use alex_mode as an example, just renders a GIF of the mesh
  alex_mode:  #  dynamically loaded by visual_wrapper.py
    #mandatory
    enabled: false  #  visual_wrapper.py: mode_config.get("enabled", False)
    class_path: "custom_modes.alex_mode:BasicAlexMode"  #  visual_wrapper.py: mode_config.get("class_path")
    # config that is passed as dictionary into your mode
    # Use for any settings that are relevant for you
    config:  #  visual_wrapper.py: mode_config.get("config", {})
      camera_position: [2000, 2000, 2000]  #  passed to mode constructor
      look_at: [0, 0, 0]  #  passed to mode constructor
      render_mode: "rgb"  #  passed to mode constructor
      fps: 20  #  passed to mode constructor

  # Just a picture of the current assembly
  assembly_mode:  #  dynamically loaded by visual_wrapper.py
    #mandatory
    enabled: false
    class_path: "custom_modes.assembly_mode:AssemblyMode"
    # config that is passed as dictionary into your mode
    # Use for any settings that are relevant for you
    config:  #  also reads bb_config.assembly_id from losses_v0_config.yaml inside assembly_mode.py
      camera_position: [3000, 3000, 3000]
      look_at: [0, 0, 0]
      render_mode: "rgb"
      color: [1.0 ,0.55 ,0.0]

  # Gif of which solar cells would be selected with the dot-product approach, given a budget and soalr angle in solar_loss_config.yaml
  solar_selection_mode:  #  dynamically loaded by visual_wrapper.py
    #Mandatory
    enabled: false
    class_path: "custom_modes.solar_selection:SolarSelectionMode"
    #config for solar selection
    config:  #  also reads SolarLossConfigV3 from solar_loss_config.yaml (area_budget_mm2, sun_dir) inside solar_selection.py
      camera_position: [-3500, 3500, 3500]
      look_at: [0, 0, 0]
      render_mode: "rgb"
      make_gif: true #if false saves seperate image every interval iterations
      render_interval: 1 #Rendering interval for gif/image. 1 means every iteration is rendered
      fps: 10
      solar_color: [0.2,0.2,0.8]
      rest_color: [1.0,0.5,0.0]

  # Gif of the solar power of each face using the dot-product approach, green is good, red is bad
  solar_power_mode:  #  dynamically loaded by visual_wrapper.py
    #Mandatory
    enabled: False
    class_path: "custom_modes.solar_power:SolarPower"
    #config for solar selection
    config:  #  also reads SolarLossConfigV3 from solar_loss_config.yaml (sun_dir) inside solar_power.py
      camera_position: [-3500, 3500, 3500]
      look_at: [0, 0, 0]
      render_mode: "rgb"
      make_gif: true #if false saves seperate image every interval iterations
      render_interval: 1 #Rendering interval for gif/image. 1 means every iteration is rendered
      fps: 10


