<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Run Logs</title>
    <style>
        :root {
            --bg: #1d2233;
            --panel: #262e45;
            --accent: #c82121;
            --muted: #c2ccd4;
            --terminal: #0f131d;
            --terminal-text: #d8f5d8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(160deg, #2c3554 0%, #1d2233 45%, #161b29 100%);
            color: #f3f7fb;
        }

        .layout {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 16px;
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 14px;
        }

        .panel {
            background: var(--panel);
            border-radius: 14px;
            padding: 14px;
            box-shadow: 0 14px 26px rgba(0, 0, 0, 0.24);
        }

        .title {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .meta {
            margin-top: 6px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .progress-row {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
        }

        progress {
            width: 100%;
            height: 18px;
            accent-color: var(--accent);
        }

        #progressText {
            min-width: 120px;
            text-align: right;
            font-weight: 700;
        }

        .terminal {
            width: 100%;
            height: 100%;
            min-height: 0;
            background: var(--terminal);
            color: var(--terminal-text);
            border: 1px solid #243047;
            border-radius: 12px;
            padding: 12px;
            font-size: 0.88rem;
            line-height: 1.4;
            font-family: Consolas, "Liberation Mono", Menlo, monospace;
            white-space: pre-wrap;
            overflow: auto;
        }
    </style>
</head>

<body>
    <main class="layout">
        <section class="panel">
            <h1 class="title">Run Monitoring</h1>
            <div class="meta">Live progress and logs for the active local optimization run.</div>
            <div class="progress-row">
                <progress id="epochProgress" value="0" max="100"></progress>
                <div id="progressText">0.0%</div>
            </div>
        </section>

        <section class="panel">
            <div id="logs" class="terminal">Waiting for logs...</div>
        </section>
    </main>

    <script>
        const logsElement = document.getElementById("logs");
        const epochProgress = document.getElementById("epochProgress");
        const progressText = document.getElementById("progressText");

        async function refreshProgress() {
            try {
                const response = await fetch(`/run-local/progress?t=${Date.now()}`, { cache: "no-store" });
                const payload = await response.json();
                const progress = Number(payload.progress_percent || 0);
                epochProgress.value = progress;
                progressText.textContent = `${progress.toFixed(1)}%`;
            } catch (_error) {
                progressText.textContent = "N/A";
            }
        }

        async function refreshLogs() {
            try {
                const response = await fetch(`/run-local/logs?t=${Date.now()}`, { cache: "no-store" });
                const payload = await response.json();
                const logsText = payload.logs || "No logs yet.";
                logsElement.textContent = logsText;
                logsElement.scrollTop = logsElement.scrollHeight;
            } catch (_error) {
                logsElement.textContent = "Failed to load logs.";
            }
        }

        refreshProgress();
        refreshLogs();
        setInterval(refreshProgress, 1500);
        setInterval(refreshLogs, 2000);
    </script>
</body>

</html>
