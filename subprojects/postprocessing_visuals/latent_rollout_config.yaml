# latent_rollout_config.yaml
# All settings for latent_rollout_gif_pyvista2.py
# CLI flags (--key value) override any value set here.
# Usage: python subprojects/postprocessing_visuals/latent_rollout_gif_pyvista2.py --config subprojects/postprocessing_visuals/latent_rollout_config.yaml

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
checkpoint: null
out: null
output_dir: /cluster/work/fuge/AISCO/wp9/pyvista_gif

# ---------------------------------------------------------------------------
# Animation / traversal
# ---------------------------------------------------------------------------
n_frames: 240
resolution: 96
radius: null
fps: 24
device: auto
width: 2560
height: 2160
panel_width: 1280
azim: -60.0
elev: 25.0
mode: circle

# ---------------------------------------------------------------------------
# Colors / rendering
# ---------------------------------------------------------------------------
mesh_color: "#E9ECEF" # Aeroshell base color
mesh_alpha: 1.0
render_bg: "#ffffff"
show_assembly: true
assembly_color: "#3C4148"
show_solar_selection: true
show_windshield: true
full_wheels: true
cutoff_wheel: false
windshield_assembly_id: 1
solar_selection_color: "#F0D33E"
windshield_color: "#86A9BD"
windshield_alpha: 0.32
solar_sun_dir: [-1.0, 0.0, 1.0]
solar_area_budget_mm2: 4200000.0
# Clean-edge preset (no post-smoothing)
mask_refine_subdivisions: 4
solar_mask_refine_subdivisions: 0
show_anchors: false
epoch_gif: false
epoch_coords: [0.0, 0.0]

# ---------------------------------------------------------------------------
# Spiral mode  (only active when mode: spiral)
# ---------------------------------------------------------------------------
spiral_turns: 3.0
spiral_radius_start: 0.0
spiral_radius_end: null

# ---------------------------------------------------------------------------
# Line mode  (only active when mode: line)
# ---------------------------------------------------------------------------
line_start: [0.0, -2.0]
line_end: [0.0, 2.0]
line_bounces: 1

# ---------------------------------------------------------------------------
# Cross mode  (only active when mode: cross)
# ---------------------------------------------------------------------------
cross_radius: null

# ---------------------------------------------------------------------------
# Mesh extraction
# ---------------------------------------------------------------------------
bbox_padding: 1.25
outer_prism_scale: 1.6

# ---------------------------------------------------------------------------
# Latent-space side panel colors
# ---------------------------------------------------------------------------
panel_bg: "#23283E"
panel_axis: "#4B5573"
panel_circle: "#6E7DA5"
panel_anchor: "#DC5A5A"
panel_anchor_label: "#F0A0A0"
panel_progress: "#50C8FF"
panel_cursor: "#50C8FF"
panel_cursor_outline: "#FFFFFF"
panel_axis_label: "#B4BEDC"
panel_coord_text: "#82C3FF"
panel_frame_text: "#8C91AA"
panel_title: "#C8CDE6"
