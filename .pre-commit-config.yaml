#kdiehl
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-docstring-first

  # Ruff für Linting und Formatierung
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.6  # Aktuelle Version prüfen: https://github.com/astral-sh/ruff-pre-commit/releases
    hooks:
      - id: ruff
        args: [--fix]  # Automatische Korrekturen aktivieren

  # MyPy für Typenprüfung
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.6.1  # Aktuelle Version prüfen: https://github.com/pre-commit/mirrors-mypy/releases
    hooks:
      - id: mypy
        # Optional: MyPy-Konfiguration aus pyproject.toml nutzen
        additional_dependencies: [types-requests]  # Falls du spezifische Typen brauchst
