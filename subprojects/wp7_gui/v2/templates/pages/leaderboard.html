<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard</title>
    <style>
        :root {
            --bg: #1f2436;
            --panel: #2a3047;
            --card: #f7faf8;
            --text: #121722;
            --muted: #5e6b75;
            --border: #d8e1db;
            --accent: #c82121;
            --gold: #d9a404;
            --silver: #9aa4ad;
            --bronze: #b06d3c;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: auto;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: #f2f5f8;
            background: radial-gradient(circle at top left, #2b3554 0%, #1f2436 45%, #171c2e 100%);
        }

        .layout {
            width: 100%;
            min-height: 100vh;
            padding: 16px;
            display: grid;
            grid-template-rows: auto auto auto;
            align-content: start;
            gap: 14px;
        }

        .panel {
            background: var(--panel);
            border-radius: 14px;
            padding: 14px;
            box-shadow: 0 14px 26px rgba(0, 0, 0, 0.22);
        }

        .title {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .subtitle {
            margin: 6px 0 0;
            color: #c7d3db;
            font-size: 0.9rem;
            line-height: 1.35;
        }

        .table-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.65);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            color: var(--text);
        }

        thead tr {
            background: linear-gradient(180deg, #edf3f8 0%, #dfe9f2 100%);
        }

        th,
        td {
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 0.92rem;
        }

        th {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #3d4a53;
            white-space: nowrap;
        }

        tbody tr:nth-child(even) {
            background: #f9fcfa;
        }

        tbody tr {
            height: 52px;
        }

        tbody tr:hover {
            background: #f2f7f4;
        }

        .place {
            width: 64px;
            font-weight: 800;
        }

        .place-content {
            display: inline-flex;
            align-items: center;
            min-height: 24px;
        }

        .badge {
            display: inline-block;
            min-width: 22px;
            text-align: center;
            padding: 2px 7px;
            border-radius: 999px;
            color: #fff;
            font-size: 0.75rem;
            font-weight: 700;
            margin-left: 7px;
            vertical-align: middle;
        }

        .badge-placeholder {
            visibility: hidden;
        }

        .gold {
            background: var(--gold);
        }

        .silver {
            background: var(--silver);
        }

        .bronze {
            background: var(--bronze);
        }

        .metric {
            font-variant-numeric: tabular-nums;
            text-align: right;
        }

        .metric-head {
            text-align: right;
        }

        .cse {
            color: var(--accent);
            font-weight: 800;
        }

        .unit {
            font-size: 0.72rem;
            letter-spacing: 0.03em;
            color: #657785;
            text-transform: none;
            font-weight: 700;
        }

        .podium-1 {
            background: #fff9e7;
            border-left: 4px solid var(--gold);
        }

        .podium-2 {
            background: #f5f8fb;
            border-left: 4px solid var(--silver);
        }

        .podium-3 {
            background: #fff3ec;
            border-left: 4px solid var(--bronze);
        }

        .race-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 18px 18px;
            color: var(--text);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.65);
        }

        .race-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 6px;
        }

        .race-title {
            margin: 0;
            font-size: 0.95rem;
            letter-spacing: 0.02em;
        }

        .race-note {
            margin: 0;
            font-size: 0.76rem;
            color: var(--muted);
        }

        .start-button {
            border: 1px solid #9e0f0f;
            background: linear-gradient(180deg, #cf2d2d 0%, #a51b1b 100%);
            color: #fff;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            padding: 7px 12px;
            cursor: pointer;
        }

        .start-button:disabled {
            cursor: not-allowed;
            opacity: 0.65;
        }

        .race-point {
            margin: 6px 0;
            text-align: center;
            font-size: 0.77rem;
            color: #4a5963;
            font-weight: 700;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        .race-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(104px, 1fr));
            gap: 10px;
            align-items: start;
            margin: 8px 0;
        }

        .lane {
            background: #f7fbff;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 8px 12px;
            text-align: center;
        }

        .lane-label {
            margin: 0;
            font-size: 0.78rem;
            color: #3b4a55;
            font-weight: 700;
        }

        .lane-car {
            margin: 3px 0 8px;
            font-size: 0.73rem;
            color: #64737e;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track {
            width: 68px;
            height: 248px;
            margin: 0 auto;
            position: relative;
        }

        .track-svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .track-path {
            fill: none;
            stroke: #7f8f9c;
            stroke-width: 5;
            stroke-linecap: round;
            opacity: 0.95;
        }

        .runner-dot {
            position: absolute;
            width: 14px;
            height: 14px;
            left: 34px;
            top: 14px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 3px rgba(200, 33, 33, 0.18);
        }

        .lane-run-1 .runner-dot {
            background: #d44f2d;
            box-shadow: 0 0 0 3px rgba(212, 79, 45, 0.18);
        }

        .lane-run-2 .runner-dot {
            background: #2574d9;
            box-shadow: 0 0 0 3px rgba(37, 116, 217, 0.18);
        }

        .lane-run-3 .runner-dot {
            background: #188e63;
            box-shadow: 0 0 0 3px rgba(24, 142, 99, 0.18);
        }

        .lane-run-4 .runner-dot {
            background: #9a37c4;
            box-shadow: 0 0 0 3px rgba(154, 55, 196, 0.18);
        }

        .lane-run-5 .runner-dot {
            background: #c56c1a;
            box-shadow: 0 0 0 3px rgba(197, 108, 26, 0.18);
        }

        @media (max-width: 980px) {

            th,
            td {
                padding: 10px;
                font-size: 0.85rem;
            }

            .title {
                font-size: 1rem;
            }

            .subtitle {
                font-size: 0.84rem;
            }

            .race-grid {
                grid-template-columns: repeat(5, minmax(78px, 1fr));
                gap: 6px;
            }

            .track {
                width: 54px;
                height: 188px;
            }

            .runner-dot {
                left: 27px;
            }

            .lane-label {
                font-size: 0.72rem;
            }

            .lane-car {
                font-size: 0.68rem;
            }
        }
    </style>
</head>

<body>
    <main class="layout">
        <section class="panel">
            <h1 class="title">Top 5 Leaderboard</h1>
            <p class="subtitle">Sample entries with random values, sorted by CSE (highest first).</p>
        </section>

        <section class="table-card">
            <table aria-label="Top 5 leaderboard sorted by CSE">
                <thead>
                    <tr>
                        <th>Place</th>
                        <th>Run #</th>
                        <th>Name</th>
                        <th class="metric-head">CSE <span class="unit">[km/h]</span></th>
                        <th class="metric-head">DRAG COEFFICIENT <span class="unit">[-]</span></th>
                        <th class="metric-head">SOLAR OUTPUT <span class="unit">[W]</span></th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody"></tbody>
            </table>
        </section>

        <section class="race-card">
            <div class="race-header">
                <h2 class="race-title">Race Simulation</h2>
                <button id="startRaceButton" class="start-button" type="button">Start Race</button>
            </div>
            <p class="race-note">The race time is proportional to track length divided by CSE.</p>
            <p class="race-point">Darwin (Start)</p>
            <div id="raceGrid" class="race-grid" aria-label="Five curved run tracks"></div>
            <p class="race-point">Adelaide (Finish)</p>
        </section>
    </main>

    <script>
        const sampleEntries = [
            { name: "Aero Falcon", cse: 96.4, drag: 0.141, solarOutput: 1387 },
            { name: "Sun Vortex", cse: 88.9, drag: 0.173, solarOutput: 1215 },
            { name: "Helio Drift", cse: 82.5, drag: 0.25, solarOutput: 1178 },
            { name: "Carbon Ray", cse: 75.9, drag: 0.49, solarOutput: 1356 },
            { name: "Nova Glide", cse: 62.1, drag: 0.35, solarOutput: 834 }
        ];

        // Deliberately mixed run numbers; Run 1 appears on the leftmost lane.
        const runNumberByCar = {
            "Aero Falcon": 4,
            "Sun Vortex": 2,
            "Helio Drift": 5,
            "Carbon Ray": 1,
            "Nova Glide": 3
        };

        const raceState = {
            lanes: [],
            running: false
        };

        function placeBadge(index) {
            if (index === 0) {
                return '<span class="badge gold">1</span>';
            }
            if (index === 1) {
                return '<span class="badge silver">2</span>';
            }
            if (index === 2) {
                return '<span class="badge bronze">3</span>';
            }
            return '<span class="badge badge-placeholder">0</span>';
        }

        function renderLeaderboard() {
            const sorted = [...sampleEntries].sort((a, b) => b.cse - a.cse).slice(0, 5);
            const body = document.getElementById("leaderboardBody");
            body.innerHTML = "";

            sorted.forEach((entry, index) => {
                const runNumber = runNumberByCar[entry.name];
                const row = document.createElement("tr");
                if (index === 0) {
                    row.classList.add("podium-1");
                } else if (index === 1) {
                    row.classList.add("podium-2");
                } else if (index === 2) {
                    row.classList.add("podium-3");
                }

                row.innerHTML = `
                    <td class="place"><span class="place-content">${index + 1}. ${placeBadge(index)}</span></td>
                    <td><strong>${runNumber}</strong></td>
                    <td>${entry.name}</td>
                    <td class="metric cse">${entry.cse.toFixed(1)}</td>
                    <td class="metric">${entry.drag.toFixed(3)}</td>
                    <td class="metric">${entry.solarOutput.toFixed(0)}</td>
                `;
                body.appendChild(row);
            });

            return sorted.map((entry) => ({
                ...entry,
                runNumber: runNumberByCar[entry.name]
            }));
        }

        function currentTrackGeometry() {
            if (window.matchMedia("(max-width: 980px)").matches) {
                return {
                    viewWidth: 54,
                    viewHeight: 188,
                    top: 10,
                    bottom: 178,
                    centerX: 27,
                    amplitude: 7
                };
            }

            return {
                viewWidth: 68,
                viewHeight: 248,
                top: 14,
                bottom: 234,
                centerX: 34,
                amplitude: 10
            };
        }

        function curvedPath(geometry) {
            const midY = (geometry.top + geometry.bottom) / 2;
            const controlX = geometry.centerX - (geometry.amplitude * 1.8);
            return `M ${geometry.centerX} ${geometry.top} Q ${controlX} ${midY} ${geometry.centerX} ${geometry.bottom}`;
        }

        function positionDot(laneData, progress) {
            const p = Math.max(0, Math.min(progress, 1));

            // Match the quadratic SVG path exactly: M centerX,top Q controlX,midY centerX,bottom
            const startX = laneData.geometry.centerX;
            const startY = laneData.geometry.top;
            const endX = laneData.geometry.centerX;
            const endY = laneData.geometry.bottom;
            const controlX = laneData.geometry.centerX - (laneData.geometry.amplitude * 1.8);
            const controlY = (laneData.geometry.top + laneData.geometry.bottom) / 2;

            const oneMinusP = 1 - p;
            const x = (oneMinusP * oneMinusP * startX) + (2 * oneMinusP * p * controlX) + (p * p * endX);
            const y = (oneMinusP * oneMinusP * startY) + (2 * oneMinusP * p * controlY) + (p * p * endY);

            laneData.dot.style.left = `${x}px`;
            laneData.dot.style.top = `${y}px`;
        }

        function renderRace(entriesWithRunNumbers) {
            const raceGrid = document.getElementById("raceGrid");
            raceGrid.innerHTML = "";
            raceState.lanes = [];

            const geometry = currentTrackGeometry();
            const orderedLanes = [...entriesWithRunNumbers].sort((a, b) => a.runNumber - b.runNumber);

            orderedLanes.forEach((entry) => {
                const lane = document.createElement("article");
                lane.className = `lane lane-run-${entry.runNumber}`;
                lane.innerHTML = `
                    <p class="lane-label">Run ${entry.runNumber}</p>
                    <p class="lane-car">${entry.name}</p>
                    <div class="track">
                        <svg class="track-svg" viewBox="0 0 ${geometry.viewWidth} ${geometry.viewHeight}" aria-hidden="true" focusable="false">
                            <path class="track-path" d="${curvedPath(geometry)}"></path>
                        </svg>
                        <span class="runner-dot" aria-hidden="true"></span>
                    </div>
                `;
                raceGrid.appendChild(lane);

                const dot = lane.querySelector(".runner-dot");
                const lineLength = geometry.bottom - geometry.top;
                const durationMs = (lineLength / entry.cse) * 2400;

                const laneData = {
                    dot,
                    geometry,
                    lineLength,
                    durationMs: Math.max(durationMs, 600),
                    rafId: 0,
                    startTs: 0
                };

                positionDot(laneData, 0);
                raceState.lanes.push(laneData);
            });
        }

        function animateLane(laneData) {
            return new Promise((resolve) => {
                const step = (timestamp) => {
                    if (laneData.startTs === 0) {
                        laneData.startTs = timestamp;
                    }

                    const elapsed = timestamp - laneData.startTs;
                    const progress = Math.min(elapsed / laneData.durationMs, 1);
                    positionDot(laneData, progress);

                    if (progress < 1) {
                        laneData.rafId = window.requestAnimationFrame(step);
                    } else {
                        laneData.rafId = 0;
                        resolve();
                    }
                };

                laneData.rafId = window.requestAnimationFrame(step);
            });
        }

        async function startRace() {
            if (raceState.running) {
                return;
            }

            const startButton = document.getElementById("startRaceButton");
            raceState.running = true;
            startButton.disabled = true;
            startButton.textContent = "Racing...";

            raceState.lanes.forEach((laneData) => {
                if (laneData.rafId) {
                    window.cancelAnimationFrame(laneData.rafId);
                }
                laneData.rafId = 0;
                laneData.startTs = 0;
                positionDot(laneData, 0);
            });

            await Promise.all(raceState.lanes.map((laneData) => animateLane(laneData)));

            raceState.running = false;
            startButton.disabled = false;
            startButton.textContent = "Start Race";
        }

        function renderAll() {
            const entriesWithRunNumbers = renderLeaderboard();
            renderRace(entriesWithRunNumbers);
        }

        document.getElementById("startRaceButton").addEventListener("click", startRace);
        window.addEventListener("resize", renderAll);

        renderAll();
    </script>
</body>

</html>
