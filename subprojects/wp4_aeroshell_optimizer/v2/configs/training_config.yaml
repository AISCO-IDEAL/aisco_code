# ===========================================================================
# Training hyper-parameters (from training_v0_config.yaml)
# ===========================================================================
training_params:
  learning_rate: 0.000008  # 0.00001 for WIREV5, 0.000008 for ConcatWireV5, 0.0001 for basic MLP, 0.0005 for AISCOModel_v0
  optimizer: "adam_fast"  # key from optimizers.json — adam | adamw | sgd_momentum | lbfgs
  num_epochs: 8000 # basic_MLP_v1.py: training_config["training_params"].get("num_epochs", 1000)
  mesh_save_interval: 20  # basic_MLP_v1.py: training_config["training_params"].get("mesh_save_interval", 50)
  marching_cubes_usage: "True"  # storage_utils.py: general_config["general_info"].get("marching_cubes_usage", "False") (if True, uses marching cubes with threads for mesh extraction, if False uses kaolin-based mesh extraction without threads, which is more stable but slower)
  gradient_conflict_cadence: 0  # Gradient conflict tracking cadence (0 = disabled, N = every N epochs). Stores per-component gradient vectors and cosine similarities to disk.
  gradient_conflict_output_dir: ""  # Output directory for gradient conflict data. If empty, defaults to <storage_dir>/<model_hash>/<wandb_run>/gradient_conflict/

  # ---------------------------------------------------------------------------
  # Multi-shape population constraint aggregation across z's.
  # Controls how the per-z constraint scalars are combined for both (a) the
  # value handed to ALM's multiplier update, and (b) the gradient that lands on θ.
  # ---------------------------------------------------------------------------
  # method:
  #   mean    — normal behaviour. Per-z backward divides each z's loss by N and
  #             accumulates to save memory; ALM multiplier update sees mean(c_per_z). Hot
  #             violators get diluted by satisfied z's; conflicting per-z grads cancel.
  #   l2_norm — ALM sees sqrt(sum(c_per_z^2)); per-z backward gradient is weighted
  #             by c_z/‖c‖, so the worst-violating z dominates θ.grad. This is the same method used
  #             by the constraints, which use the L2 norm to single out the worst offenders
  #
  # l2_backward_strategy (only consulted when method=l2_norm):
  #   single_pass — keep all N per-z compute graphs alive, build aggregated loss,
  #                  one backward. ~N× memory cost. Simpler; exact entire gradient in one pass.
  #   two_pass    — pass 1 no_grad to precompute detached aggregation weights;
  #                  pass 2 backward per z with detached weights. 1× memory, ~2×
  #                  forwards. Same final θ.grad as single_pass.
  multi_shape_aggregation:
    method: "l2_norm"  # mean | l2_norm
    l2_backward_strategy: "single_pass"  # single_pass | two_pass (both only used when method=l2_norm)

mode:
  training_mode: "diagnostic"  # "performance" or "diagnostic"
  print_timing: true  # print backward timing per epoch (useful when benchmarking performance vs diagnostic mode)

# ===========================================================================
# Gradient clipping (plan 003 — M2: AutoClip)
# Controls how gradient norms are clipped before each optimizer step.
# ---------------------------------------------------------------------------
# mode:
#   "static"   — fixed clip at static_clip_norm (legacy behaviour, backward-compatible)
#   "autoclip" — adaptive 80th-percentile of recent gradient norm history (GINN-style)
#   "none"     — no gradient clipping
#
# static_clip_norm: fallback clip value during AutoClip warm-up (first auto_clip_min_len epochs)
#   and the sole clip value when mode="static". Should match the previous gradient_clip_norm value.
# auto_clip_percentile: fraction of history to use as threshold (0.8 = 80th percentile)
# auto_clip_hist_len:   number of gradient norm observations to keep in rolling buffer
# auto_clip_min_len:    warm-up epochs before switching from static fallback to adaptive threshold
# ===========================================================================
gradient_clipping:
  mode: "autoclip"           # "static" | "autoclip" | "none"
  static_clip_norm: 100      # warm-up fallback (first 50 epochs) and static mode value
  auto_clip_percentile: 0.8
  auto_clip_hist_len: 50
  auto_clip_min_len: 50

#used in optimise() path?
gradient_clip_norm: 100
# ===========================================================================
# GINN / Diversity parameters (merged from GINN.yaml)
# ===========================================================================

# pretrain_population_size: true  → optimisation loop uses N = Z_pretrained.shape[0] (full checkpoint)
# pretrain_population_size: false → optimisation loop uses N = `population_size`; initial Z is the
#                                    first `population_size` rows of Z_pretrained (simple slice).
#                                    Errors if `population_size` > checkpoint size.
pretrain_population_size: false
population_size: 20

# DEAD CONFIG — NOT WIRED. The original intent was to generate fresh Z codes when
# pretrain_population_size=false (circle: evenly spaced on the pretraining radius;
# wider_circle: random disk of radius r_init_scale * r_pretraining). The wire-up
# was deferred — current behaviour is the simple slice described above.
z_init_mode: circle           # NOT READ
r_init_scale: 1.0             # NOT READ

# ===========================================================================
# Diversity loss sampling config
# ===========================================================================
# Points are used for cheap WIRE-only forward passes (no CFD/raytracing).
# With 20 GB VRAM this can be set high; 2048 is a conservative default.
bbox_scale_factor: 1.4  # multiply outer_prism bounds by this; 1.0 = full outer_prism
diversity_num_points: 4096
diversity_norm_order: 2          # p for L^p field distance
# Aggregation across the population:
#   min/mean/sum — local: each shape scored against its neighbours individually.
#   leinster     — global all-pairs Leinster diversity (GINN train/losses.py). Pressures the
#                  population to spread evenly across the shape manifold → structured latent space.
diversity_neighbor_agg_fn: "leinster"
# leinster_temp is a FIXED field distance (mm, SDF units): the scale at which two shapes
# count as notably different. Must be absolute, not relative — a relative temperature is
# scale-invariant and cannot drive the population to actually diversify, only rearrange it.
#   too small → saturates (diversity pegs at population size N, gradient dies)
#   too large → nothing registers as diverse (diversity stuck near 1)
# ~100 ≈ the pairwise field-distance scale of a diversified population (from past runs);
# calibrate from the D curve: D shooting to N = too small, D stuck near 1 = too large.
diversity_leinster_temp: 1800     # only used when agg_fn=leinster
diversity_leinster_q: 2          # diversity order q; q=2 = inverse-Simpson effective shape count

# ===========================================================================
# Latent population behaviour
# ===========================================================================
force_z0_to_origin: false         # true keeps first latent vector fixed at origin | use false to align with latent pretraining

# ===========================================================================
# Latent resampling behaviour
# ===========================================================================

# z_resample_mode: on_circle → restore each Z slot to its exact pretrained position on the circle
# z_resample_mode: in_circle → resample each Z slot to a random point inside the pretrained circle disk
#                               (uniform area density: r = r_max * sqrt(U), random angle)
# z_resample_mode: random   → resample Z positions from isotropic Gaussian (no pretrained reference needed)
#
# Mode A: z_resample_cadence=0                    → never resample (fixed population)
# Mode B: z_resample_cadence>0, z_resample_start_epoch=0  → resample from epoch 0
# Mode C: z_resample_cadence>0, z_resample_start_epoch>0  → hold pretrained Z for
#          z_resample_start_epoch epochs, then resample every z_resample_cadence epochs
z_resample_cadence: 1            # 0 disables resampling, N>0 resamples every N epochs | use 0 to align with latent pretraining spots
z_resample_start_epoch: 0        # 0 = Mode B (resample from epoch 1); N>0 = Mode C warm-up
z_resample_stop_epoch: -1        # -1 = never stop resampling; N>0 = freeze Z from epoch N onward (Phase 2 transition)
z_resample_mode: in_circle        # on_circle | in_circle | random; mode used when z_resample_cadence > 0




# ===========================================================================
# Post-training mesh saving for population validation.
# ===========================================================================
# When true, one PLY mesh per latent slot is saved to the run's mesh directory after training.
save_population_meshes: true
