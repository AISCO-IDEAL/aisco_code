model_name: "ConcatWIREV2"
z_placement: "unit_circle"
z_radius: 1.0
force_pretraining: true # iff false, a hashed pretraining will be used if applicable

# One entry per latent slot.  Slot 0 maps to z₀ = origin.
# shape_type: "sphere" | "cube" | "ply"
# All keys must be present (set unused keys to null).
#
# PLY-specific keys:
#   ply_scale: multiplies raw vertex coordinates → mm.
#     100.0   if PLY is stored in decimetres (AISCO pretraining convention)
#     1.0     if PLY is already in mm
#   surface_noise_sigma_factor: σ = factor × bbox_extent_mm.
#     0.005   ≈ DeepSDF tight band (σ ≈ 25mm at car scale)
#     0.05    wider band (σ ≈ 250mm at car scale, default)
latent_population:
  # you can add as many shapes as you want
  - name: "sphere_slot_0" #arbitray name
    shape_type: "sphere"
    radius: 500.0         # iff shape_type == "sphere"
    side_length: null     # iff shape_type == "cube"
    ply_path: null        # iff shape_type == "ply"

  - name: "simple_bullet_blunt"
    shape_type: "ply"
    radius: null
    side_length: null
    ply_path: "/cluster/work/fuge/AISCO/pretraining_shapes/simple_bullet_blunt.ply"
    ply_scale: 100.0                   # PLY stored in decimetres → convert to mm
    surface_noise_sigma_factor: 0.005   # σ = 5% of bbox diagonal

  - name: "simple_bullet_pointy"
    shape_type: "ply"
    radius: null
    side_length: null
    ply_path: "/cluster/work/fuge/AISCO/pretraining_shapes/simple_bullet_pointy.ply"
    ply_scale: 100.0
    surface_noise_sigma_factor: 0.005

  - name: "simple_catamaran"
    shape_type: "ply"
    radius: null
    side_length: null
    ply_path: "/cluster/work/fuge/AISCO/pretraining_shapes/simple_catamaran.ply"
    ply_scale: 100.0
    surface_noise_sigma_factor: 0.005

  - name: "simple_cuboid"
    shape_type: "ply"
    radius: null
    side_length: null
    ply_path: "/cluster/work/fuge/AISCO/pretraining_shapes/simple_cuboid.ply"
    ply_scale: 100.0
    surface_noise_sigma_factor: 0.005

  - name: "simple_trimaran"
    shape_type: "ply"
    radius: null
    side_length: null
    ply_path: "/cluster/work/fuge/AISCO/pretraining_shapes/simple_trimaran.ply"
    ply_scale: 100.0
    surface_noise_sigma_factor: 0.005

  - name: "simple_solarcar"
    shape_type: "ply"
    radius: null
    side_length: null
    ply_path: "/cluster/work/fuge/AISCO/pretraining_shapes/simple_solarcar.ply"
    ply_scale: 100.0
    surface_noise_sigma_factor: 0.005

training_loop:
  epochs: 13
  learning_rate: 0.0005
  batch_size_per_shape: 4096 #8192
  print_interval: 25
  eikonal_weight: 0.1
  surface_resample_cadence: 0   # 0 = static (DeepSDF-style, default)
                                # N = refresh near-surface cache every N epochs

output:
  # Must live in a directory NOT scanned by fetch_pretrained_model
  # (which scans the standard pretrained_path directory).
  checkpoint_path: "/cluster/work/fuge/AISCO/latent_pretraining/pretrained_latent.pth"
  mesh_resolution: 64
  vis_cadence: 300 # at what interval to visualize the sampling
  vis_eikonal_pts: true   # visualize sampled points for eikonal loss (default: true)
  vis_mesh_display_mode: "vertices"   # "vertices" renders the raw ply vertex cloud.
