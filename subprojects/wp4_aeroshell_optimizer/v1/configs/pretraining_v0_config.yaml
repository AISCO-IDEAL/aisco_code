#Here put the config for model pretraining
general_info:
  config_debugging: "True"

pretraining_shape: "sphere" # "sphere" or "cube"

pretraining:
  use_pretrained: True # True or False possible
  force_pretraining: False
  pretraining_model_path: "subprojects/wp4_aeroshell_optimizer/data/test_models/xyz" # must be .pth file compatible with model_vxy, doesn't do anything atm
  username: ${USER} # for windows users: %USERNAME%

model: "WIRE" #Class name of model
model_filename: "WIRE" #Name of file where model is defined

training_loop:
  epochs: 5000
  learning_rate: 0.0005
  random_batch_size: 2048
  print_interval: 25
