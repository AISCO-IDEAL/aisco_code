# aeroshell_png.py — visual configuration
# All layer colours, per-camera views, and rendering settings live here.
# CLI flags (--checkpoint, --angle_deg, --radius, etc.) are the ONLY inputs
# that must be passed on the command line; everything visual is in this file.

# ---------------------------------------------------------------------------
# Layers — set enabled: false to skip a layer entirely (zero render cost).
# Colors: '#RRGGBB' hex or [R, G, B] list (0-255 integers).
# ---------------------------------------------------------------------------
layers:
  aeroshell:
    enabled: true
    color: "#33FFFF"          # AISCO cyan
    alpha: 0.82               # slightly transparent so inner parts show through

  inner_assembly:
    enabled: true
    color: "#F39C12"          # amber
    alpha: 1.0

  outer_bbox:
    enabled: false            # disabled by default — enable to inspect bounding box
    color: "#FF504D"          # red-orange
    alpha: 0.12

  solar_binary_mask:
    enabled: true
    color_on: "#FFD700"       # golden yellow  — face IS in the solar budget
    color_off: "#2A2F45"      # very dark blue — face is NOT selected (near bg)
    alpha: 1.0                # always opaque; drawn as flat-shaded face overlay

  solar_shading:
    enabled: true
    colormap: "Blues"         # matplotlib colormap name
    alpha: 0.90               # slight transparency
    vmin: 0.0                 # illumination quality range (cos angle)
    vmax: 1.0

# ---------------------------------------------------------------------------
# Camera views — one PNG is written per entry.
# azim_deg / elev_deg: same convention as latent_rollout_gif.py (OpenGL, Z-up)
# distance_mult: multiplier on the mesh diagonal used to set camera distance
# ---------------------------------------------------------------------------
cameras:
  - name: front_iso
    azim_deg: -55.0
    elev_deg: 22.0
    distance_mult: 1.6

  - name: rear_iso
    azim_deg: 125.0
    elev_deg: 18.0
    distance_mult: 1.6

  - name: side_left
    azim_deg: -90.0
    elev_deg: 5.0
    distance_mult: 1.7

  - name: top_down
    azim_deg: -90.0
    elev_deg: 82.0
    distance_mult: 1.5

# ---------------------------------------------------------------------------
# Rendering
# ---------------------------------------------------------------------------
image_width: 1920
image_height: 1080
background_color: "#23283E"   # AISCO dark navy

# ---------------------------------------------------------------------------
# Mesh extraction (used only in .pth compute mode)
# ---------------------------------------------------------------------------
compute:
  resolution: 64              # marching-cubes grid resolution per axis
  bbox_padding: 1.25          # expand each prism face by this many mm

# ---------------------------------------------------------------------------
# Solar computation (used only in .pth compute mode)
# Sun direction xyz in world space (mm) — does not need to be normalised.
# area_budget_mm2: maximum selectable solar panel area in mm².
# ---------------------------------------------------------------------------
solar:
  sun_dir: [0.0, -0.5, 1.0]
  area_budget_mm2: 4200000.0   # ~4.2 m²
  effective_irradiance_W_m2: 250.0
  sigmoid_sharpness: 10.0
  soft_mask_selection_threshold: 0.5

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------
output:
  output_dir: "/cluster/work/fuge/AISCO/wp9/aeroshell_png"
  filename_prefix: "aeroshell"   # saved as {prefix}_{name}_{view}.png
