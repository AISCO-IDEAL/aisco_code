# ============ KEY FEATURES ============
#
# ✓ No git conflicts: Each person has their own file
# ✓ Shared visualiser: One GPU renderer, all modes use it
# ✓ Independent storage: Each mode manages self.frame_storage
# ✓ Easy parallelization: Modes run sequentially now, but frame storage
#   is independent so async/parallel is possible later
# ✓ Error isolation: One mode failing doesn't stop others
# ✓ Config-driven: Enable/disable modes without code changes
#
# ============ DEBUGGING ============
#
# If a mode fails during optimization:
# - Error is printed to console with traceback
# - Other modes continue
# - Mode-specific errors won't break training
#
# If a mode fails during finalize:
# - Error is printed to console with traceback
# - Other modes still save their results
# - Check output_dir/<mode_name>/ for partial results
