# Postprocessing Configuration for Latent Space Interpolator
# Generates 2D grid visualizations showing how SDF mesh evolves through latent space

interpolator:
  # Grid resolution: creates grid_resolution x grid_resolution mesh samples
  # Higher = more detailed interpolation but slower (10 = 100 samples total)
  grid_resolution: 5

  # Latent space range: bounds for z[0] and z[1] sweeping
  # Typical range: -2.0 to 2.0 (adjust based on your model's latent distribution)
  latent_range: [-2.0, 2.0]

  # Marching cubes extraction resolution
  # Higher = better mesh quality but slower (128 = 128³ SDF evaluation grid)
  mesh_resolution: 64

  # Extraction bbox is derived from the WP2 outer prism (get_outer_prism_bounds_mm)
  # and scaled by bbox_scale_factor (default 1.0).  No manual bbox bounds needed.
  bbox_scale_factor: 1.2

  # SDF level-set value (typically 0.0 for implicit surface)
  isovalue: 0.0

  # Camera view angle for rendering
  # Options: "iso", "front", "back", "left", "right", "top", "bottom"
  # Alternately, use explicit coordinates to prevent auto-zooming on small meshes.
  # Format: [ [cam_X, cam_Y, cam_Z], [focal_X, focal_Y, focal_Z], [up_X, up_Y, up_Z] ]
  camera_view: [[5000, 5000, 5000], [0, 0, 0], [0, 0, 1]]

  # Mesh color in rendered images
  # PyVista colors: "lightgrey", "steelblue", "coral", "mediumseagreen", etc.
  mesh_color: "lightgrey"

  # Rendered image dimensions (width, height) in pixels
  # Larger = higher quality but slower to render
  window_size: [800, 600]

  # Directory for saving intermediate/final images
  # If null, uses default output directory from allround_save_data (needs fixing, still not working correctly though!)
  save_dir: null

  # Whether to upload final grid to WandB
  upload_to_wandb: True

  # Render interpolation grids periodically during the training loop
  render_during_training: true
  render_frequency: 25

  # Print detailed point extraction progress during rendering
  verbose: false

  # Rendering backend:
  # - "pyvista" (default): existing behavior
  # - "mesh_assembly_mode_v4": uses existing assembly renderer pipeline
  render_backend: "mesh_assembly_mode_v4"

  # Optional config forwarded to MeshAssemblyModeV4 when using
  # render_backend: "mesh_assembly_mode_v4"
  mesh_assembly_mode_config:
    # Required by RenderingMode base class
    camera_position: [5000, 5000, 5000]
    look_at: [0, 0, 0]
    render_mode: "rgb"

    # MeshAssemblyModeV2 options
    render_interval: 1
    make_gif: false
    mesh_alpha: 0.5
    outer_alpha: 0.2

  # Optional Visualiser overrides for mesh_assembly_mode_v4 backend.
  # If omitted, interpolator uses sensible defaults and current device.
  mesh_visualiser: {}

  # Sampling mode: "grid" sweeps z[0]/z[1] on a 2-D grid; "circle" samples N evenly-spaced
  # points on a circle of radius z_radius in the z[0]/z[1] plane (horizontal strip output).
  sample_mode: "circle"

  # Circle mode — must match z_radius in pretraining_latent_config.yaml
  z_radius: 2.0
  n_circle_samples: 7

  # Write PLY files for each sample to save_dir/plys/ (always true in standalone mode)
  save_plys: true
