# Pretraining configuration for the dynamic model loading entry point (pretraining_v4.py).
# used for the WIRE Fitting benchmark, works for .optimise() models
# Valid model_name values are defined in v2/configs/models.json.
model_name: "WIREV5"  # Key passed to smart_model_init — change to any registered model name.

pretraining_shape: "ply"  # "sphere", "cube", or "ply"
pretraining_ply_path: "/cluster/work/fuge/AISCO/concentrate_curvature/DevelopabilityOfTriangleMeshes/assets/original_silvretta.ply"
pretraining_ply_scale: 1.0  # Scale ply vertices to mm (bunny.ply is unit-scale → x1000, silvretta is in mm though so it needs a factor x1.0)
random_seed: 42

pretraining:
  use_pretrained: True
  force_pretraining: False
  pretraining_model_path: ""
  local_pretraining_model_path: ""
  username: ${USER}

training_loop:
  epochs: 600
  learning_rate: 0.00005
  random_batch_size: 2048
  print_interval: 50
  eikonal_weight: 0.1

output:
  checkpoint_path: "/cluster/work/fuge/AISCO/WIRE_fitting_alex/normalisation_tests/"
  mesh_resolution: 300   # marching-cubes grid resolution for post-training PLY extraction
  mesh_box_mm: 1000     # half-extent of the marching-cubes bounding box in mm

wandb:
  use_wandb: true
  project_name: "WIRE-Fitting"
  entity_name: "aisco"
