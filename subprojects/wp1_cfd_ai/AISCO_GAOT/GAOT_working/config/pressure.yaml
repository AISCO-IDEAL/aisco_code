setup:
    wandb_run_name: "run__RUN_ID_"
    seed: 42
    device: "cuda:0"
    dtype: "torch.float32"
    trainer_name: "static3d"
    train: true
    test: true
    ckpt: false
    use_variance_test: false
    distributed: false

    # --- wandb settings for quick smoke run ---
    wandb: true
    wandb_project: "WP1_drag"
    wandb_entity: aisco
    #wandb_run_name: "run__RUN_ID_"
    wandb_group: drivaernet
    wandb_mode: online
    wandb_tags: ["drivaernet", "pressure", "normals", "gaot"]
    wandb_watch_model: true

    # --- artifact & checkpoint settings ---
    test_during_training: false
    # resume_from_artifact: "model-gino-nasacrm-pressure:best"  # 从artifact加载预训练模型

model:
    name: "gaot_3d"
    use_conditional_norm: false
    args:
        latent_tokens: [64,64,32]
        magno:
            use_gno: true
            gno_coord_dim: 3
            neighbor_strategy: "bidirectional"
            projection_channels: 256
            in_gno_channel_mlp_hidden_layers: [64,64,64]
            out_gno_channel_mlp_hidden_layers: [64,64]
            lifting_channels: 32
            gno_radius: 0.033
            gno_use_torch_cluster: true
            attention_type: "cosine"
            use_geoembed: [true, false]
            embedding_method: "statistical"
            encoder_feature_attr: ["pos","c"]
            mlp_type: "linear"
            precompute_edges: false
            asynchronous_graph_building: true
        transformer:
            patch_size: 2
            hidden_size: 256
            use_attn_norm: true
            use_ffn_norm: true
            norm_eps: 1e-06
            num_layers: 10
            positional_embedding: "rope"
            use_long_range_skip: true
            attn_config:
                hidden_size: 256
                num_heads: 8
                num_kv_heads: 8
                use_conditional_norm: false
                cond_norm_hidden_size: 4
            ffn_config:
                hidden_size: 1024
                use_conditional_norm: false
                cond_norm_hidden_size: 4

dataset:
    name: "drivaernet_drag"
    metaname: "incompressible_fluids/drivaernet_pressure"
    base_path: "/cluster/work/fuge/AISCO/wp1_cfd_ai/processed_drivaer"
    processed_folder: ""
    force_recompute_stats: false
    train_size: 200
    val_size: 30
    test_size: 30
    batch_size: 1
    num_workers: 4
    shuffle: true
    metric_suite: "general"
    update_pt_files_with_edges: false

optimizer:
    name: "adamw"
    args:
        lr: 8e-4
        weight_decay: 1e-05
        epoch: 50
        loss_scale: 1.0
        eval_every_eps: 1
        scheduler: "mix"
        max_lr: 1e-3
        min_lr: 5e-4
        final_lr: 1e-4
        save_every_epochs: 1

path:
    ckpt_path: "/cluster/work/fuge/AISCO/wp1_cfd_ai/drivaer_drag_results/ckpt/drag_model__RUN_ID_.pt"
    loss_path: "/cluster/work/fuge/AISCO/wp1_cfd_ai/drivaer_drag_results/loss/drag_loss__RUN_ID_.png"
    result_path: "/cluster/work/fuge/AISCO/wp1_cfd_ai/drivaer_drag_results/results/drag_result__RUN_ID_.png"
    database_path: "/cluster/work/fuge/AISCO/wp1_cfd_ai/drivaer_drag_results/database/drag_metrics.csv"
