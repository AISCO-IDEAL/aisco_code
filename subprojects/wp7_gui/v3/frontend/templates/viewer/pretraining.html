{% extends "base.html" %}
{% block hint %}Latest pretraining convergence GIFs.{% endblock %}

{% block content %}
<div style="display:grid; grid-template-rows:auto 1fr; gap:12px; height:100%; min-height:0;">

  <div class="dark-card toolbar">
    <button class="btn" id="btnRefresh">Refresh</button>
    <span style="color:var(--muted); font-size:0.82rem;" id="info">—</span>
  </div>

  <div id="grid" style="display:grid; grid-template-columns: repeat(2, 1fr); gap:14px; min-height:0; overflow:auto;">
    <div style="color:var(--theme-muted); font-style:italic; padding:30px; grid-column:1/-1; text-align:center;">Loading…</div>
  </div>

</div>

<script>
  const grid = document.getElementById("grid");
  const info = document.getElementById("info");

  async function load() {
    grid.innerHTML = '<div style="color:var(--theme-muted); font-style:italic; padding:30px; grid-column:1/-1; text-align:center;">Loading…</div>';
    try {
      const d = await (await fetch("/viewer/api/pretraining/gifs")).json();
      const gifs = d.gifs || [];
      info.textContent = `${gifs.length} GIF(s)`;
      if (!gifs.length) {
        grid.innerHTML = '<div style="color:var(--theme-muted); font-style:italic; padding:30px; grid-column:1/-1; text-align:center;">No pretraining GIFs found.</div>';
        return;
      }
      grid.innerHTML = "";
      gifs.forEach(g => {
        const card = document.createElement("div");
        card.className = "visual-card";
        card.innerHTML = `
        <div class="visual-title">${g.name || "(unnamed)"}</div>
        <div class="image-slot">
          <img src="${bust(g.url)}" alt="${g.name}" style="display:block;">
        </div>
        <div class="hint" style="font-size:0.76rem; word-break:break-all;">${g.rel_path || ""}</div>
      `;
        grid.appendChild(card);
      });
    } catch (err) {
      grid.innerHTML = `<div style="color:var(--accent); padding:14px; grid-column:1/-1;">Failed: ${err.message}</div>`;
    }
  }

  document.getElementById("btnRefresh").addEventListener("click", load);
  load();
</script>
{% endblock %}
