# ConcatWIRE v3 — V3 (log-spaced Gabor filterbank) + latent vector input + xyz skip connection
#
# Diversity / legacy model: a per-instance latent vector z is concatenated to the input
# coordinates, so the network learns a family of shapes. Optimisation searches over z
# rather than all weights — useful for comparing or interpolating aeroshell geometries.
#
# The xyz skip connection re-injects only the spatial coordinates (not z) at mid-depth.
# z is already present in the first layer input; the skip is purely for spatial re-anchoring,
# preventing positional information from being washed out by the shape code in deeper layers.
#
# This model does not have an optimise() method — it is driven by the diversity training loop.

coords: 3
z_dim: 2                    # dimension of the per-instance latent vector
hidden_features: 128
hidden_layers: 4
out_features: 1
skip_layer_idx: 2           # inject after the 3rd Gabor layer (0-indexed); valid range [0, hidden_layers-1]
first_omega_min: 0.5
first_omega_max: 10.0
first_scale_min: 5.0
first_scale_max: 20.0
hidden_omega_min: 0.5
hidden_omega_max: 10.0
hidden_scale_min: 5.0
hidden_scale_max: 20.0
train_omega: False
train_scale: False
dtype: "float32" # Insert here something that works with torch.{dtype}, e.g. "float32", "float64", "float16"
