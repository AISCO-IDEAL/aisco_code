<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Mesh Viewer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #fff;
      overflow: hidden;
      font-family: monospace;
    }

    canvas {
      display: block;
    }

    #filename {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 13px;
      pointer-events: none;
    }

    #drop-hint {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      padding: 24px 36px;
      border-radius: 8px;
      font-size: 16px;
      text-align: center;
      line-height: 1.8;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="filename">no model loaded</div>
  <div id="drop-hint">
    Drop a .glb file here<br>
    <span style="font-size:13px;opacity:0.7">or serve with <code>python -m http.server 8080</code><br>
      and open <code>?model=../path/to/file.glb</code></span>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'https://cdn.jsdelivr.net/npm/lil-gui@0.19/+esm';

    // --- Renderer ---
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    // --- Scene ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.001, 10000);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- Color config from vis_config.yaml (served as /config.json) ---
    // Maps GLB mesh name → { rgb: [r,g,b] in [0,1], alpha: float }
    // If /config.json is unavailable, all entries remain null → vertex colors used as-is.
    let MESH_COLORS = {
      sdf_mesh: { rgb: null, alpha: null },
      inner_assembly: { rgb: null, alpha: null },
      outer_bbox: { rgb: null, alpha: null },
    };
    // outer_lines_only settings — read from vis_config.yaml via /config.json.
    // When /config.json is unavailable (drag-and-drop without serve.py) these stay
    // null and the viewer falls back to the legacy solid+edges appearance.
    let OUTER_RENDER_STYLE = null;
    let OUTER_LINES_COLOR = null;
    let OUTER_LINES_WIDTH = null;
    try {
      const resp = await fetch('/config.json');
      if (resp.ok) {
        const cfg = await resp.json();
        if (cfg.sdf_color) MESH_COLORS.sdf_mesh.rgb = cfg.sdf_color;
        if (cfg.sdf_alpha != null) MESH_COLORS.sdf_mesh.alpha = cfg.sdf_alpha;
        if (cfg.inner_color) MESH_COLORS.inner_assembly.rgb = cfg.inner_color;
        if (cfg.outer_color) MESH_COLORS.outer_bbox.rgb = cfg.outer_color;
        if (cfg.outer_alpha != null) MESH_COLORS.outer_bbox.alpha = cfg.outer_alpha;
        if (typeof cfg.outer_render_style === 'string') OUTER_RENDER_STYLE = cfg.outer_render_style;
        if (Array.isArray(cfg.outer_lines_color) && cfg.outer_lines_color.length === 3) {
          OUTER_LINES_COLOR = cfg.outer_lines_color;
        }
        if (cfg.outer_lines_width != null) OUTER_LINES_WIDTH = Number(cfg.outer_lines_width);
      }
    } catch (_) { /* /config.json only available when served via serve.py */ }

    // --- GUI ---
    let gui = new GUI({ title: 'Mesh Components' });

    function buildGUI(root) {
      gui.destroy();
      gui = new GUI({ title: 'Mesh Components' });

      // Bounding box toggle
      const box3 = new THREE.Box3().setFromObject(root);
      const boxHelper = new THREE.Box3Helper(box3, 0x888888);
      scene.add(boxHelper);
      const globalState = { bounding_box: true };
      gui.add(globalState, 'bounding_box').name('Bounding Box').onChange(v => { boxHelper.visible = v; });
      gui.add({ reset_camera: () => fitCamera(root) }, 'reset_camera').name('Reset Camera');
      gui.add({ separator: '' }, 'separator').name('── Meshes ──').disable();

      root.traverse(obj => {
        if (!obj.isMesh) return;
        const label = obj.name || `mesh_${obj.id}`;
        const folder = gui.addFolder(label);
        // Initial opacity: from config if available, else from material
        const mat = Array.isArray(obj.material) ? obj.material[0] : obj.material;
        const initOpacity = mat ? mat.opacity : 1.0;
        const state = { visible: true, opacity: initOpacity };

        folder.add(state, 'visible').name('Visible').onChange(v => { obj.visible = v; });
        folder.add(state, 'opacity', 0, 1, 0.01).name('Opacity').onChange(v => {
          const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
          mats.forEach(m => { m.opacity = v; m.depthWrite = v >= 0.99; m.needsUpdate = true; });
        });
        folder.open();
      });
    }

    // --- Camera fitting ---
    function fitCamera(root) {
      const box = new THREE.Box3().setFromObject(root);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      controls.target.copy(center);
      // Geometry uses Z-up (Z = height, X = length, Y = width).
      // Set camera up to Z so X/Y appear as the horizontal ground plane.
      camera.up.set(0, 0, 1);
      // Position camera from +Y direction slightly elevated — gives a side view
      // where X is horizontal and Z is vertical.
      camera.position.copy(center).addScaledVector(new THREE.Vector3(0.4, 1, 0.4).normalize(), maxDim * 2.5);
      camera.near = maxDim * 0.001;
      camera.far = maxDim * 100;
      camera.updateProjectionMatrix();
      controls.update();
    }

    // --- GLB loading ---
    const loader = new GLTFLoader();
    let currentRoot = null;

    function loadGLB(url, displayName) {
      document.getElementById('drop-hint').style.display = 'none';
      document.getElementById('filename').textContent = `Loading: ${displayName}`;

      loader.load(url, gltf => {
        if (currentRoot) scene.remove(currentRoot);
        currentRoot = gltf.scene;
        scene.add(currentRoot);

        // Build a fresh MeshBasicMaterial per mesh so:
        //   • Opacity sliders are fully independent (no shared-material coupling).
        //   • Mesh is flat/unlit — no shading artefacts.
        //   • If vis_config.yaml defines a color for this mesh name, that color
        //     overrides the baked-in vertex colors from the GLB — meaning you can
        //     change colors at any time by editing vis_config.yaml and restarting
        //     serve.py, without needing to re-export the GLB files.
        currentRoot.traverse(obj => {
          if (!obj.isMesh) return;
          const cfgEntry = MESH_COLORS[obj.name];
          const overrideRgb = cfgEntry?.rgb ?? null;
          const overrideAlpha = cfgEntry?.alpha ?? null;
          const srcMat = Array.isArray(obj.material) ? obj.material[0] : obj.material;
          const isOuterLinesOnly = obj.name === 'outer_bbox' && OUTER_RENDER_STYLE === 'outer_lines_only';
          const linesColor = OUTER_LINES_COLOR ?? [0.137, 0.157, 0.243];
          const baseAlpha = isOuterLinesOnly
            ? 1.0
            : (overrideAlpha ?? (typeof srcMat?.opacity === 'number' ? srcMat.opacity : 1.0));
          const baseColor = isOuterLinesOnly
            ? new THREE.Color(...linesColor)
            : (overrideRgb ? new THREE.Color(...overrideRgb) : 0xffffff);
          const newMat = new THREE.MeshBasicMaterial({
            // Use solid override color when configured; otherwise keep baked vertex colors.
            vertexColors: !isOuterLinesOnly && overrideRgb === null,
            color: baseColor,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: baseAlpha,
            depthWrite: baseAlpha >= 0.99,
            wireframe: isOuterLinesOnly,
            wireframeLinewidth: OUTER_LINES_WIDTH,
          });
          obj.material = newMat;
        });

        fitCamera(currentRoot);
        buildGUI(currentRoot);
        document.getElementById('filename').textContent = displayName;
      }, undefined, err => {
        document.getElementById('filename').textContent = `Error: ${err.message}`;
        console.error(err);
      });
    }

    // Load from ?model= query param
    const modelUrl = new URLSearchParams(window.location.search).get('model');
    if (modelUrl) {
      loadGLB(modelUrl, modelUrl.split('/').pop());
    }

    // Drag-and-drop (works when file is dropped directly onto the page)
    document.addEventListener('dragover', e => e.preventDefault());
    document.addEventListener('drop', e => {
      e.preventDefault();
      const file = e.dataTransfer?.files[0];
      if (file?.name.endsWith('.glb')) loadGLB(URL.createObjectURL(file), file.name);
    });

    // --- Render loop ---
    (function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    })();
  </script>
</body>

</html>
