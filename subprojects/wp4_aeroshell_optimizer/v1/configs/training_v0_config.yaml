
training_params:
  learning_rate: 0.00005  # NOT USED by BasicMLP — basic_MLP_v1.py reads training_config.get("learning_rate") at top level, not from training_params; always falls back to 1e-3. Only used if sweep overrides it.
  num_epochs: 300 # USED — basic_MLP_v1.py: training_config["training_params"].get("num_epochs", 1000)
  mesh_save_interval: 100  # USED — basic_MLP_v1.py: training_config["training_params"].get("mesh_save_interval", 50)
