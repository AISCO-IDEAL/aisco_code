<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introduction</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: radial-gradient(circle at top left, #2b3554 0%, #1f2436 45%, #171c2e 100%);
            color: #f2f5f8;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .layout {
            width: 100%;
            height: 100%;
            display: grid;
            padding: 8px;
            grid-template-rows: auto 1fr;
            gap: 6px;
            justify-items: center;
            align-items: center;
        }

        .title {
            margin: 0;
            font-size: clamp(2.8rem, 10vw, 7.2rem);
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-align: center;
            line-height: 1;
            color: #ffffff;
            text-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        }

        .team-image {
                        width: min(98vw, 1800px);
                        height: min(84vh, 980px);
            object-fit: contain;
            object-position: center;
        }
    </style>
</head>

<body>
    <main class="layout">
        <h1 class="title">THE TEAM</h1>
        <img class="team-image" src="/image.png" alt="The Team">
    </main>
</body>

</html>
