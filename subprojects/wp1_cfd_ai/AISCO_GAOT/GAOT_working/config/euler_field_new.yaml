##########################################################################
#  GAOT — Euler dataset (NEW processing): scalar (force + cd) + pressure
#
#  58 samples, ~2.3K vertices each.
#  Small meshes — full_grid strategy (no subsampling needed at 2.3K verts).
#  Data: /cluster/work/fuge/AISCO/wp1_cfd_ai/processed_euler_new/
#  Files: run_1.pt .. run_58.pt (flat layout)
##########################################################################

setup:
    wandb_run_name: "euler_field_new__RUN_ID_"
    seed: 42
    device: "cuda:0"
    dtype: "torch.float32"
    trainer_name: "static3d"
    train: true
    test: true
    ckpt: false
    use_variance_test: false
    distributed: true

    wandb: true
    wandb_project: "WP1_drag"
    wandb_entity: aisco
    wandb_group: euler_field
    wandb_mode: online
    wandb_tags: ["field", "pressure", "euler", "multi_head", "gaot", "new_data"]
    wandb_watch_model: false

    test_during_training: false

model:
    name: "gaot_3d"
    use_conditional_norm: false
    args:
        latent_tokens: [32, 32, 16]
        field_output_size: 1
        magno:
            use_gno: true
            gno_coord_dim: 3
            neighbor_strategy: "bidirectional"
            projection_channels: 256
            in_gno_channel_mlp_hidden_layers: [64, 64, 64]
            out_gno_channel_mlp_hidden_layers: [64, 64]
            lifting_channels: 32
            gno_radius: 0.033
            gno_use_torch_cluster: true
            attention_type: "cosine"
            use_geoembed: [true, false]
            embedding_method: "statistical"
            encoder_feature_attr: ["pos", "c"]
            mlp_type: "linear"
            precompute_edges: false
            asynchronous_graph_building: false
            scales: [1.0]
            use_scale_weights: false
            k_neighbors: 1
        transformer:
            patch_size: 2
            hidden_size: 256
            use_attn_norm: true
            use_ffn_norm: true
            norm_eps: 1e-06
            num_layers: 10
            positional_embedding: "rope"
            use_long_range_skip: true
            attn_config:
                hidden_size: 256
                num_heads: 8
                num_kv_heads: 8
                use_conditional_norm: false
                cond_norm_hidden_size: 4
            ffn_config:
                hidden_size: 1024
                use_conditional_norm: false
                cond_norm_hidden_size: 4

dataset:
    name: "euler_pressure_field_new"
    metaname: "incompressible_fluids/euler_pressure"
    base_path: "/cluster/work/fuge/AISCO/wp1_cfd_ai/processed_euler_new"
    processed_folder: ""
    force_recompute_stats: true
    rand_dataset: true
    train_size: 70
    val_size: 15
    test_size: 15
    batch_size: 12
    num_workers: 4
    shuffle: true
    metric_suite: "general"
    update_pt_files_with_edges: false
    training_strategy: "full_grid"
    uncertainty_weighting: true
    field_loss_weight: 1.0
    use_rescale_new: true
    active_variables:

optimizer:
    name: "adamw"
    args:
        lr: 3e-4
        weight_decay: 1e-05
        epoch: 300
        loss_scale: 1.0
        eval_every_eps: 1
        scheduler: "mix"
        max_lr: 5e-4
        min_lr: 1e-4
        final_lr: 1e-5
        save_every_epochs: 10
        save_every_steps: 0
        early_save_metric: "val"

path:
    ckpt_path: "/cluster/work/fuge/AISCO/wp1_cfd_ai/drivaer_drag_results/ckpt/euler_field_new__RUN_ID_.pt"
    loss_path: "/cluster/work/fuge/AISCO/wp1_cfd_ai/drivaer_drag_results/loss/euler_field_new__RUN_ID_.png"
    result_path: "/cluster/work/fuge/AISCO/wp1_cfd_ai/drivaer_drag_results/results/euler_field_new__RUN_ID_.png"
    database_path: "/cluster/work/fuge/AISCO/wp1_cfd_ai/drivaer_drag_results/database/euler_field_new_metrics.csv"
