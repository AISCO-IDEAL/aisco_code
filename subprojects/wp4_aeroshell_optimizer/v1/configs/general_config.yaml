general_info:
  username: ${USER} # for windows users: %USERNAME%
  version: "v1"
  device: "cuda"
  pre: "a sphere as initial shape, datatype: SDF"
  post: "a PLY file representing the optimized aeroshell shape"
  config_debugging: "True" # adds print statements if config loading is succesfull
  run_locally: "True"
  verbose: "False"

model_def:
  model_name: "BasicMLP"
  model_file_path: "subprojects/wp4_aeroshell_optimizer/v1/src/models/basic_MLP_v1"
  local_model_file_path: "subprojects/wp4_aeroshell_optimizer/v1/src/models/basic_MLP_v1"


active_configs:
  losses: "losses_v0_config.yaml"
  pretraining: "pretraining_v0_config.yaml"
  training: "training_v0_config.yaml"
  model_params: "basic_MLP_v1.yaml"
  wandb: "wandb_v0_sweep.yaml"
  neural_renderer: "neural_renderer_v0.yaml"
  solar: "solar_configs/solar_loss_config.yaml"

wandb_general:
  use_wandb: True
  project_name: "50 meshes proper naming and storage" #modify
  entity_name: "aisco"
  track_run: 1
  use_renderer: True
  use_neural_renderer: True
  rendering_frequency: 1
  use_sweep: 0

storage_paths: # Note that paths have to start with "/cluster/...", if you use "cluster/..." you create stuff in AISCO_code
  pretrained_dir: "/cluster/work/fuge/AISCO/wp4_aeroshell_optimiser/pretrained_dataset"
  local_pretrained_dir: "./local_pretrained_dir" # only used for testing on local machine, not on cluster
  storage_dir: "/cluster/work/fuge/AISCO/wp4_aeroshell_optimiser/sweep_storage_for_cfd_ai"
  local_storage_dir: "./local_storage_dir" # only used for testing on local machine, not on cluster


