{% extends "base.html" %}
{% block hint %}Focused solar placement rendering from the current run.{% endblock %}

{% block content %}
<div class="section-grid" style="grid-template-rows: 1fr auto; height: 100%;">
  <div class="image-slot" id="solarSlot" style="height: 100%;">
    <span class="placeholder-text" id="statusText">Waiting for solar GIF…</span>
    <img id="solarImg" alt="solar loss rendering">
  </div>
  <div class="dark-card toolbar">
    <button class="btn" id="btnRestart" disabled>Restart GIF</button>
    <span style="color:var(--muted); font-size:0.82rem;" id="gifName"></span>
  </div>
</div>

<script>
const API = "/launcher/api";
let currentKey = null;

const img     = document.getElementById("solarImg");
const status  = document.getElementById("statusText");
const btnR    = document.getElementById("btnRestart");
const gifName = document.getElementById("gifName");

function bust(url) { return url + (url.includes("?") ? "&" : "?") + "t=" + Date.now(); }

async function refresh() {
  try {
    const data = await (await fetch(`${API}/run/artifacts?t=${Date.now()}`, { cache: "no-store" })).json();
    const list = data.solar_loss_gifs || [];
    if (!list.length) {
      img.style.display = "none"; status.textContent = "No solar GIF yet."; btnR.disabled = true; currentKey = null; return;
    }
    const entry = list.find(e => e.name === "rendering.gif") || list[0];
    const key = entry.rel_path || entry.name;
    if (key !== currentKey) { img.src = bust(entry.url); currentKey = key; }
    img.style.display = "block"; status.textContent = ""; gifName.textContent = entry.name; btnR.disabled = false;
  } catch { status.textContent = "Failed to load solar artifacts."; }
}

btnR.addEventListener("click", () => { if (currentKey) { const src = img.src.split("?")[0]; img.src = bust(src); } });
refresh();
setInterval(refresh, 4000);
</script>
{% endblock %}
