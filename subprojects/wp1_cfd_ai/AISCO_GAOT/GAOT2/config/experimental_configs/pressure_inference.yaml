# ============================================================================
# INFERENCE-ONLY CONFIG
# ============================================================================
# Purpose: Run the trained model on ALL 534 samples and save predictions.
#
# Usage:
#   python main.py -c config/pressure_inference.yaml
# ============================================================================

setup:
    wandb_run_name: "inference_all__RUN_ID_"
    seed: 42
    device: "cuda:0"
    dtype: "torch.float32"
    trainer_name: "static3d"
    train: false
    test: true
    ckpt: true
    use_variance_test: false
    distributed: false

    # --- wandb settings ---
    wandb: false
    wandb_project: "WP1_drag"
    wandb_entity: aisco
    wandb_watch_model: false

    test_during_training: false

model:
    name: "gaot_3d"
    use_conditional_norm: false
    args:
        latent_tokens: [32,32,16]
        magno:
            use_gno: true
            gno_coord_dim: 3
            neighbor_strategy: "bidirectional"
            projection_channels: 256
            in_gno_channel_mlp_hidden_layers: [64,64,64]
            out_gno_channel_mlp_hidden_layers: [64,64]
            lifting_channels: 32
            gno_radius: 0.033
            gno_use_torch_cluster: true
            attention_type: "cosine"
            use_geoembed: [true, false]
            embedding_method: "statistical"
            encoder_feature_attr: ["pos","c"]
            mlp_type: "linear"
            precompute_edges: false
            asynchronous_graph_building: true
        transformer:
            patch_size: 2
            hidden_size: 256
            use_attn_norm: true
            use_ffn_norm: true
            norm_eps: 1e-06
            num_layers: 10
            positional_embedding: "rope"
            use_long_range_skip: true
            attn_config:
                hidden_size: 256
                num_heads: 8
                num_kv_heads: 8
                use_conditional_norm: false
                cond_norm_hidden_size: 4
            ffn_config:
                hidden_size: 1024
                use_conditional_norm: false
                cond_norm_hidden_size: 4

dataset:
    name: "drivaernet_drag"
    metaname: "incompressible_fluids/drivaernet_pressure"
    base_path: "/cluster/work/fuge/AISCO/wp1_cfd_ai/processed_drivaer_drag_params"
    processed_folder: ""
    force_recompute_stats: false
    rand_dataset: false
    # All 484 samples go to test
    train_size: 0
    val_size: 0
    test_size: 484
    batch_size: 2
    num_workers: 4
    shuffle: false
    metric_suite: "general"
    update_pt_files_with_edges: false

optimizer:
    name: "adamw"
    args:
        lr: 1e-4
        weight_decay: 0.0
        epoch: 0
        loss_scale: 1.0
        eval_every_eps: 1
        scheduler: "cos"
        scheduler_T_max: 1
        scheduler_eta_min: 1e-5
        save_every_epochs: 0

path:
    ckpt_path: "/cluster/work/fuge/AISCO/wp1_cfd_ai/drivaer_drag_results/ckpt/overfit_model_58316449.pt"
    loss_path: "/cluster/work/fuge/AISCO/wp1_cfd_ai/drivaer_drag_results/loss/inference_all__RUN_ID_.png"
    result_path: "/cluster/work/fuge/AISCO/wp1_cfd_ai/drivaer_drag_results/results/inference_all__RUN_ID_.png"
    database_path: "/cluster/work/fuge/AISCO/wp1_cfd_ai/drivaer_drag_results/database/inference_all_metrics.csv"
