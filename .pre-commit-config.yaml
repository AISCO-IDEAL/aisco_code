# kdiehl
# .pre-commit-config.yaml
# Pre-Commit-Konfiguration für Python-Projekte mit Ruff und MyPy

exclude: ^subprojects_legacy/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=6000'] # blocks files > 500 kb
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-docstring-first

  # Ruff für Linting und Formatierung
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.6  # Aktuelle Version prüfen: https://github.com/astral-sh/ruff-pre-commit/releases
    hooks:
      - id: ruff
        args: [--fix]  # Automatische Korrekturen aktivieren

  # MyPy für Typenprüfung
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2  # Aktuelle Version prüfen: https://github.com/pre-commit/mirrors-mypy/releases # eschaerer: update acc. to pyproject.toml
    hooks:
      - id: mypy
        # Optional: MyPy-Konfiguration aus pyproject.toml nutzen
        args: [--config-file=pyproject.toml, --namespace-packages, --explicit-package-bases]
        additional_dependencies:
          - types-requests  # Falls du spezifische Typen brauchst
          - types-PyYAML # eschaerer
        pass_filenames: True # eschaerer: mypy soll nur geänderte Dateien prüfen, damit es schneller läuft
        entry: mypy .
