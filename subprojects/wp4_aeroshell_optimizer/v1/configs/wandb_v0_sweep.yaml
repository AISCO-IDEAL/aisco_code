# wandb_v0_config.yaml
command:
  - ${env}
  - python3
  - -m
  - wp4_aeroshell_optimizer.src.main
program: main.py
method: bayes  # or 'random', or 'grid' as needed
metric:
  goal: minimize
  name: total_loss
parameters:
  training_params.learning_rate:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.01
  lagrangian_params.rho_bb: # not yet implemented
    distribution: log_uniform_values
    min: 0.0001
    max: 1.0

  #training_params.optimizer:
  #  values: ["adam", "sgd"]
