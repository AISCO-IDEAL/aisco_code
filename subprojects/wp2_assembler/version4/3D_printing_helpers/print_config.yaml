# Default settings for export_printables.py.
# You can run the helper directly and it will read this file:
#   python subprojects/wp2_assembler/version4/3D_printing_helpers/export_printables.py

# Existing run/export folder to post-process. Leave blank to be prompted.
run_dir: "/cluster/work/fuge/AISCO/temp_/6166b4e953/p2clwhx6_66994778_dummy"

# Output folder. Leave blank to use <run_dir>/printables_3d.
out_dir: "/cluster/work/fuge/AISCO/temp_/6166b4e953/p2clwhx6_66994778_dummy/printables_3d"

# Folder containing exported wheel/seat assembly meshes. This is the source of truth;
# assembly_id is intentionally not used.
assembly_mesh_dir: "/cluster/work/fuge/AISCO/temp_/6166b4e953/p2clwhx6_66994778_dummy/mesh_assembly_v4"

# Which slot_XX_mesh file to use. Leave blank for the first available slot.
assembly_slot: ""

# Mesh epoch to export. Leave blank or use "latest" for the last available epoch.
epoch: "latest"

# Exact solar folder to use when it is separate from run_dir.
# Example: "/cluster/work/fuge/AISCO/temp_/6166b4e953/13_66919410_pious-pyramid/solar"
# Leave blank to search inside run_dir.
solar_dir: ""

# Which real solar output to include in the multicolor export.
# Common choices: binary_mask, selection, quality, penalty, shading, receiver_mask.
solar_source: "binary_mask"

# Fallback only: if run_dir is a leaf folder without solar outputs, also search its parent.
# Keep false unless you are sure the parent contains only the matching run.
search_parent_for_solar: false

# Radial clearance added to shell socket cutters, in original model millimeters before scaling.
shell_clearance_mm: 0.35

# Constant scale applied to every exported mesh/assembly.
# Default maps the 5800 mm WP2 car length to about 150 mm.
scale_factor: 0.02586206896551724

# Test mode only: keep original cut wheels and add full wheels for visual alignment checks.
# Keep false for final printable exports so only the new full wheels remain.
keep_original_wheels_for_test: false

# Ask in the terminal for missing values and let you adjust defaults.
prompt_for_missing: true

# Show settings before running and ask for confirmation.
confirm_before_export: true
