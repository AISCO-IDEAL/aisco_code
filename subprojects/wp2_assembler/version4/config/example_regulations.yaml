# Solar Car Competition Regulations

# No-Build Zones (NBZ)
no_build_zones:
  outer_prism:
    height: 1650  # mm
    length: 5800  # mm
    width: 2300   # mm

  wheel_based_rules:
    front_overhang: 0.6       # percentage, with 1 = 100%
    rear_overhang: 0.6        # percentage, with 1 = 100%
    approach_angle: 10        # in degrees
    departure_angle: 10       # in degrees

  vision_box:
    radius: 4000             # mm
    pos_height: 700          # mm from eye level
    neg_height: 400          # mm from eye level
    pos_angle: 100           # degrees from x-axis around z-axis in positive direction (right-hand rule)
    neg_angle: 100           # degrees from x-axis around z-axis in negative direction (right-hand rule)
    inner_radius: 1          # mm distance from centerline to start of vision box

tracker_box:
  dimension:
    length: 120              # mm
    width: 120               # mm
    height: 70               # mm
  cone:
    height: 3000              # mm
    apex_angle: 120           # degrees

seat:
  position:
    z: 100                 # mm from ground                  # ADD!!!!
  dimension:
    width: 450.0            # general width of the seat
    radius_top: 835.0       # radius used to build the backrest
    minus_angle: 27.0       # angle of the backrest backwards [°]
    plus_angle: 45.0        # angle of the backrest forwards [°]
    lr_l: 1000.0            # legroom length
    lr_h: 350.0             # legroom height
    width_hr: 280.0         # headroom width
    height_hr: 300.0        # headroom height

# Wheel and tire specs
wheel:
  min_wheel_count: 3
  tire_width: 96            # mm Silvretta tyre width
  tire_diameter: 557        # mm Silvretta tyre radius
  margin_axial: 0          # mm minimum clearance between tire and NBZ
  margin_radial: 0         # mm minimum clearance around tire will go outside outer NBZ
