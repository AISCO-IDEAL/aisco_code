#Here put the config for model pretraining
pretraining_shape: "sphere" # "sphere" or "cube"  #  pretraining_v1_1.py: config.get("pretraining_shape", "sphere")

pretraining:
  force_pretraining: False  # main_v1_1_one_model.py: pretraining_config.get("pretraining", {}).get("force_pretraining", False)
  pretraining_model_path: "/cluster/work/fuge/AISCO/wp4_aeroshell_optimiser/pretrained_dataset/bb489749d1/bb489749d1.pth"  # main_v1_1_one_model.py: pretraining_config.get("pretraining", {}).get("pretraining_model_path", "path/to/pretrained/model.pth")  # note: pretraining_v0_model.pth is the basic MLP sphere or ellipsoid
  local_pretraining_model_path: "./local_pretrained_model.pth" # only used for testing on local machine, not on cluster  # main_v1_1_one_model.py: pretraining_config.get("pretraining", {}).get("local_pretraining_model_path", "path/to/pretrained/model.pth") (when run_locally=True)

model: "WIRE" #Class name of model  # pretraining_v1_1.py: config["model"] (only in dynamic_model_loading, not used when model is passed in)
model_filename: "WIRE" #Name of file where model is defined  # pretraining_v1_1.py: config["model_filename"] (only in dynamic_model_loading, not used when model is passed in)

training_loop:
  epochs: 2000  # pretraining_v1_1.py: config["training_loop"]["epochs"]
  learning_rate: 0.0005  # pretraining_v1_1.py: config["training_loop"]["learning_rate"]
  random_batch_size: 2048  # pretraining_v1_1.py: config["training_loop"]["random_batch_size"]
  print_interval: 25  # pretraining_v1_1.py: config["training_loop"]["print_interval"]
