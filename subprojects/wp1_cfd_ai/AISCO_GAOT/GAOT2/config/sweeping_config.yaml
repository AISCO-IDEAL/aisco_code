program: subprojects/wp1_cfd_ai/AISCO_GAOT/GAOT2/main.py

# Base arguments for main.py
command:
  - ${env}
  - python
  - ${program}
  - -c
  - subprojects/wp1_cfd_ai/AISCO_GAOT/GAOT2/config/main_config.yaml

# Optimization setup
method: bayes  # or "random" if you prefer
metric:
  name: val_loss   # adapt to your logged metric name
  goal: minimize

# Global sweep info (matches your project)
project: WP1_drag
entity: aisco
name: "wp1_gaot_lr_sweep"

parameters:
  # ========== OPTIMIZER / LR-RELATED ONLY ==========
  optimizer.args.lr:
    distribution: log_uniform_values
    min: 1e-5
    max: 5e-4

  optimizer.args.weight_decay:
    distribution: log_uniform_values
    min: 1e-6
    max: 1e-3