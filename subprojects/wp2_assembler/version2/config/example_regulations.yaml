#exampledocument

# Solar Car Competition Regulations
# Last updated: 2025-11-03
# Competition: World Solar Challenge / American Solar Challenge

metadata:
  competition: "World Solar Challenge"
  year: 2025
  class: "Cruiser"
  version: "1.2.0"
  
# No-Build Zones (NBZ)
no_build_zones:
  outer_prism:
    height: 1650  # mm from ground
    length: 5800  # mm 
    width: 2300   # mm
  
  wheel_based_rules:
    front_overhang: 0.6       # percentage, with 1 = 100%
    rear_overhang: 0.6        # percentage, with 1 = 100%
    road_apex_incline : 15  # in degrees. 3.81 degrees = 1:15 incline
    approach_angle: 10        # in degrees
    departure_angle: 10       # in degrees
    speed_hump:
      height: 75              # mm
      inner_lenght: 100       # mm
      outer_lenght: 150       # mm


seat:
  position:
    min_distance_to_back_wheel: 400   # mm from backwheel to seating position
  dimension:
    width: 450.0            # general width of the seat
    radius_top: 835.0       # radius used to build the backrest
    minus_angle: 27.0       # angle of the backrest backwards [°]
    plus_angle: 45.0        # angle of the backrest forwards [°]
    lr_l: 1000.0            # legroom length
    lr_h: 350.0             # legroom height
    width_hr: 280.0         # headroom width
    height_hr: 300.0        # headroom height

  
# Wheel and tire specs
wheel:
  min_wheel_count: 3
  tire_width: 96            # mm Silvretta tyre width
  tire_diameter: 557        # mm Silvretta tyre radius
  margin_axial: 50          # mm minimum clearance between tire and NBZ
  margin_radial: 20         # mm minimum clearance around tire will go outside outer NBZ

  base:
    min_length: 2000        # mm
    min_width: 500          # mm
    max_front_margin: 600   # mm distance to front of outerNBZ to wheel base front edge - random value
    max_rear_margin: 600    # mm distance to rear of outerNBZ to wheel base rear edge - random value
  
  gamma_distribution:
    shape1: 2.0             # Makes it a hump-shaped, bell-like curve
    shape2: 2.0             # Makes it a hump-shaped, bell-like curve
    scale1: 4.0             # Makes the distribution wider in x-direction 
    scale2: 2.0             # Makes the distribution wider in y-direction - scale = 1 -> exponential decay
    cut_off_point: 20       # where to truncate/cut the distribution before shifting and scaling



# generated by Claude AI
examples:
  driver_compartment:
    min_headroom: 800        # mm above seating position
    min_leg_room: 600        # mm
    emergency_egress_time: 10  # seconds
  
  wheel_wells:
    clearance_around_wheel: 50  # mm
    allow_fenders: true
  
  ground_clearance:
    min_clearance: 100  # mm
    measurement_method: "laden"  # laden or unladen

  dimensions:
    max_length: 5000  # mm
    max_width: 2200   # mm
    max_height: 1600  # mm
    min_ground_clearance: 100  # mm
  wheelbase:
    min: 2000  # mm
    max: 3500  # mm 


