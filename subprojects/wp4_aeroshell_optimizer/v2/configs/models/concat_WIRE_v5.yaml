# ConcatWIRE v5 — V5 (decoupled Gabor + coarse-to-fine schedule + geometry-aware
# normalisation) + latent vector input + xyz skip connection.
#
# Diversity model: a per-instance latent vector z is concatenated to the input
# coordinates, so the network learns a family of shapes. Optimisation searches over z
# rather than all weights.
#
# Architectural details inherited from WIREV5:
#   1. GaborLayerV5: independent wave & decay projections, log-parameterised omega/scale.
#   2. Coarse-to-fine frequency tiling across hidden layers (set hidden_omega_max >>
#      hidden_omega_min to use it; equal values reproduce uniform behaviour).
#   3. Geometry-aware normalisation via bbox_center / bbox_half_extent (or auto via
#      use_assembly_normalisation).
#
# The xyz skip connection re-injects only the (normalised) spatial coordinates (not z)
# at mid-depth — z is baked in at the first layer; the skip is purely for spatial
# re-anchoring.
#
# This model does not have an optimise() method — it is driven by the diversity training loop.

coords: 3
z_dim: 2                    # dimension of the per-instance latent vector
hidden_features: 512
hidden_layers: 3
out_features: 1
skip_layer_idx: 2           # 0-indexed; valid range [0, hidden_layers-1]

# First layer: wide-band feature extractor over xyz + z.
first_omega_min: 1.625463831497798
first_omega_max: 8.666857169072504
first_scale_min: 5.37003644859779
first_scale_max: 26.58724002911597

# Hidden layers: log-uniform coarse-to-fine sub-bands per layer.
hidden_omega_min: 3.8292073656441374
hidden_omega_max: 10.646821504903292
hidden_scale_min: 1.1743072337647469
hidden_scale_max: 47.571974975931376

train_omega: False
train_scale: False
use_spectral_norm: True
use_smooth_output: True

# Geometry-aware normalisation (defaults reproduce /1000 used in V3/V4).
bbox_center: [0.0, 0.0, 0.0]
bbox_half_extent: 1000.0
# If true, overrides bbox_center / bbox_half_extent with values from the assembly outer bbox.
use_assembly_normalisation: True

dtype: "float32"
