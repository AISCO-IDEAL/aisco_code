general_info:
  config_debugging: "True"
  ALM: "True"  # Augmented Lagrangian Method 
  initial_lambda: 0.01  # initial value for lambda in ALM
  alpha: 0.99  # factor to increase mu in ALM if constraint not met
  gamma: 0.01  # parameter for ALM penalty update

losses: # [compute: bool, weight: float, path: str]
  aero:
    frontal_area_v0: [0, 0.0, "subprojects/wp4_aeroshell_optimizer/v1/src/losses/aerodynamic_loss/frontal_area_v0.py"]
    crude_estimator_v0: [0,0.0, "subprojects/wp4_aeroshell_optimizer/v1/src/losses/aerodynamic_loss/crude_estimator_v0.py"]
  
  bb:
    bb_v1: [1,100, "subprojects/wp4_aeroshell_optimizer/v1/src/losses/bb_loss/bb_v1.py"]
    bb_v2: [0, 1000, "subprojects/wp4_aeroshell_optimizer/v1/src/losses/bb_loss/bb_v2.py"]
  
  eikonal: 
    eikonal_v0: [1, 10, "subprojects/wp4_aeroshell_optimizer/v1/src/losses/eikonal_loss/eikonal_v0.py"]
  
  smoothness: 
    smoothness_v0: [1, 0.0, "subprojects/wp4_aeroshell_optimizer/v1/src/losses/smoothness_loss/smoothness_v0.py"]
    
  solar:
    solar_v0: [1, 1.0, "subprojects/wp4_aeroshell_optimizer/v1/src/losses/solar_loss/solar_v0.py"]
    brute_force_solar_loss: [0, 100, "subprojects/wp4_aeroshell_optimizer/v1/src/losses/solar_loss/brute_force_solar_loss.py"]
    solar_v0_brute_force: [0, 100, "subprojects/wp4_aeroshell_optimizer/v1/src/losses/solar_loss/solar_v0_brute_force.py"]
  
  total: 
    total_loss: [1, 1.0, "subprojects/wp4_aeroshell_optimizer/v1/src/losses/total_loss.py"]

get_points_params: # used in eikonal and smoothness loss
  num_points: 1000
  bbox_size: 10.0

solar_config: 

bb_config:
  pointgrid_params:
    dx: 150
    dy: 150
    dz: 150
    rand: 400
  
  assembly_version: 2
  assembly_id: 1 # 1 for the standard one