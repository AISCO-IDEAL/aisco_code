# ============================================================================
# Wandb Sweep Config — ALM (Augmented Lagrangian Method) Hyperparameters
# ============================================================================
# Parameter naming: <config_filename_without_yaml>.<nested.path.to.value>
# See wandb_sweep_v1_50_meshes.yaml for full documentation.
# ============================================================================

program: subprojects/wp4_aeroshell_optimizer/v1/src/main_files/main_v1_1_one_model.py
method: grid
metric:
  name: total_loss
  goal: minimize
parameters:
  losses_v0_config.losses.aero:
    values: [
      gaot_loss: [1, 1.0, "subprojects/wp4_aeroshell_optimizer/v1/src/losses/aerodynamic_loss/gaot_loss.py"]
    ]
  losses_v0_config.losses.bb:
    values: [
      bb_v4_4: [1, 10.0, "subprojects/wp4_aeroshell_optimizer/v1/src/losses/bb_loss/bb_v4_4.py"]
      ]
  losses_v0_config.losses.eikonal:
    values: [
     eikonal_v0: [1, 10.0, "subprojects/wp4_aeroshell_optimizer/v1/src/losses/eikonal_loss/eikonal_v0.py"]
    ]
  losses_v0_config.losses.smoothness:
    values: [ smoothness_v0: [1, 0.0, "subprojects/wp4_aeroshell_optimizer/v1/src/losses/smoothness_loss/smoothness_v0.py"] ]

  losses_v0_config.losses.solar:
    values: [
      solar_v3B: [1, 50.0, "subprojects/wp4_aeroshell_optimizer/v1/src/losses/solar_loss/solar_v3B.py"],
      solar_v4: [1, 50.0, "subprojects/wp4_aeroshell_optimizer/v1/src/losses/solar_loss/solar_v4.py"],
      solar_v5: [1, 50.0, "subprojects/wp4_aeroshell_optimizer/v1/src/losses/solar_loss/solar_v5.py"],
      solar_v6: [1, 50.0, "subprojects/wp4_aeroshell_optimizer/v1/src/losses/solar_loss/solar_v6.py"],
      solar_v7: [1, 50.0, "subprojects/wp4_aeroshell_optimizer/v1/src/losses/solar_loss/solar_v7.py"]
      ]
