# latent_rollout_config.yaml
# All settings for latent_rollout_gif.py
# CLI flags (--key value) override any value set here.
# Usage: python latent_rollout_gif.py --config latent_rollout_config.yaml

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
checkpoint: /cluster/work/fuge/AISCO/temp_/6166b4e953/39_26423_feasible-monkey/models/39_26423_feasible-monkey_epoch1400.pth
output_dir: /cluster/work/fuge/AISCO/wp9/ginn_gif
# out: null   # uncomment to override the auto-generated filename entirely

# ---------------------------------------------------------------------------
# Animation
# ---------------------------------------------------------------------------
n_frames: 480     # frames per full circle  (480 = one frame per 0.75°)
fps: 24           # GIF playback speed in frames-per-second
radius: null      # traversal radius; null = infer from checkpoint

# ---------------------------------------------------------------------------
# Mesh extraction
# ---------------------------------------------------------------------------
resolution: 40    # marching-cubes grid resolution per axis
bbox_padding: 100  # expand each prism face outward by this many mm (prevents boundary holes)
device: auto      # "auto" | "cuda" | "cpu"

# ---------------------------------------------------------------------------
# Render viewport
# ---------------------------------------------------------------------------
width: 960        # 3D render width in pixels
height: 600       # 3D render height in pixels
panel_width: 320  # latent-map side panel width in pixels

# ---------------------------------------------------------------------------
# Camera
# ---------------------------------------------------------------------------
azim: -60.0       # azimuth angle in degrees
elev: 25.0        # elevation angle in degrees

# ---------------------------------------------------------------------------
# Colors  (hex "#RRGGBB" or integer list [R, G, B])
# ---------------------------------------------------------------------------

# 3D render
mesh_color:   "#5DADE2"   # aeroshell surface color
mesh_alpha:   0.75        # aeroshell opacity 0.0–1.0 (0.75 = 75% opaque; use BLEND when < 1)
render_bg:    "#ffffff"   # 3D render background

# Inner assembly
show_assembly:   true        # render inner assembly inside the transparent aeroshell
assembly_color:  "#F39C12"  # inner assembly color (orange)

# Latent-space side panel
panel_bg:             "#23283E"   # panel background
panel_axis:           "#4B5573"   # axis lines
panel_circle:         "#6E7DA5"   # training manifold circle
panel_anchor:         "#DC5A5A"   # pretrained anchor dots
panel_anchor_label:   "#F0A0A0"   # anchor index labels
panel_progress:       "#50C8FF"   # traversed arc highlight
panel_cursor:         "#50C8FF"   # current position dot fill
panel_cursor_outline: "#FFFFFF"   # current position dot outline
panel_axis_label:     "#B4BEDC"   # z₀ / z₁ labels
panel_coord_text:     "#82C3FF"   # z = [...] coordinate readout
panel_frame_text:     "#8C91AA"   # "frame N / M" counter
panel_title:          "#C8CDE6"   # panel title text
