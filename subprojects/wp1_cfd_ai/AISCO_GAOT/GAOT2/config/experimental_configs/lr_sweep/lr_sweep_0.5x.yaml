##########################################################################
#  LR SWEEP — 1/2x baseline learning rate
#
#  Base config: newer_main_config.yaml (scalar_encoder disabled)
#  lr=3e-4  max_lr=5e-4  min_lr=1e-4  final_lr=1e-5
##########################################################################

setup:
    name: "lr_sweep_0.5x"
    id: "_RUN_ID_"
    seed: 42
    device: "cuda:0"
    dtype: "torch.float32"
    trainer_name: "static3d"
    train: true
    test: true
    ckpt: false
    use_variance_test: false
    distributed: false

    wandb: true
    wandb_run_name: "lr_sweep_0.5x__RUN_ID_"
    wandb_project: "WP1_drag"
    wandb_entity: aisco
    wandb_group: lr_sweep
    wandb_mode: online
    wandb_tags: ["lr_sweep", "euler", "cp_full", "lr_0.5x"]
    wandb_watch_model: false
    wandb_notes: "LR sweep: 1/2x baseline. lr=3e-4 max_lr=5e-4 min_lr=1e-4 final_lr=1e-5"

    test_during_training: false

model:
    name: "gaot_3d"
    use_conditional_norm: false
    args:
        input_size: 6
        output_size: 1
        latent_tokens: [32, 32, 16]
        field_output_size: 1
        norm_domain: [[-1, -1, -1], [1, 1, 1]]
        scalar_encoder:
            enabled: false
            features: ["scale_factors"]
            hidden_dim: 32
        magno:
            use_gno: true
            gno_coord_dim: 3
            neighbor_strategy: "bidirectional"
            projection_channels: 256
            in_gno_channel_mlp_hidden_layers: [64, 64, 64]
            out_gno_channel_mlp_hidden_layers: [64, 64]
            lifting_channels: 32
            gno_radius: 0.066
            gno_use_torch_cluster: true
            attention_type: "cosine"
            use_geoembed: [true, false]
            embedding_method: "statistical"
            encoder_feature_attr: ["pos", "c"]
            mlp_type: "linear"
            precompute_edges: false
            asynchronous_graph_building: false
            scales: [1.0]
            use_scale_weights: false
            k_neighbors: 1
            in_gno_transform_type: "linear"
            out_gno_transform_type: "linear"
            use_graph_cache: true
            gno_use_torch_scatter: true
            node_embedding: false
            use_attn: null
            pooling: "max"
            sampling_strategy: null
            max_neighbors: null
            sample_ratio: null
        transformer:
            patch_size: 2
            hidden_size: 256
            use_attn_norm: true
            use_ffn_norm: true
            norm_eps: 1e-06
            num_layers: 10
            positional_embedding: "rope"
            use_long_range_skip: true
            attn_config:
                hidden_size: 256
                num_heads: 8
                num_kv_heads: 8
                use_conditional_norm: false
                cond_norm_hidden_size: 4
                atten_dropout: 0.1
                positional_embedding: "rope"
            ffn_config:
                hidden_size: 1024
                use_conditional_norm: false
                cond_norm_hidden_size: 4
        decoder:
            hidden_features: 256
            num_shared_layers: 3
            output_heads:
                force: 1
                cd: 1

dataset:
    name: "euler_pressure_field_new"
    metaname: "incompressible_fluids/euler_pressure"
    base_path: "/cluster/work/fuge/AISCO/wp1_cfd_ai/processed_euler_cp_full"
    processed_folder: ""
    force_recompute_stats: true
    rand_dataset: true
    train_size: 110
    val_size: 23
    test_size: 20
    batch_size: 6
    num_workers: 4
    shuffle: true
    metric_suite: "general"
    update_pt_files_with_edges: false
    training_strategy: "full_grid"
    uncertainty_weighting: false
    field_loss_weight: 1.0
    use_rescale_new: true
    active_variables:
    order_file_name:
    active_heads: []
    drop_pressure: true
    subsample_nodes: 50000

optimizer:
    name: "adamw"
    args:
        lr: 3e-4
        weight_decay: 1e-05
        epoch: 300
        loss_scale: 1.0
        eval_every_eps: 1
        scheduler: "mix"
        max_lr: 5e-4
        min_lr: 1e-4
        final_lr: 1e-5
        save_every_epochs: 10
        save_every_steps: 0
        early_save_metric: "val"
        loss: "mse"

path:
    ckpt_path: "/cluster/work/fuge/AISCO/wp1_cfd_ai/results/lr_sweep_0.5x__RUN_ID_/model.pt"
    loss_path: "/cluster/work/fuge/AISCO/wp1_cfd_ai/results/lr_sweep_0.5x__RUN_ID_/loss.png"
    result_path: "/cluster/work/fuge/AISCO/wp1_cfd_ai/results/lr_sweep_0.5x__RUN_ID_/results.png"
    config_save_path: "/cluster/work/fuge/AISCO/wp1_cfd_ai/results/lr_sweep_0.5x__RUN_ID_/config.yaml"
    database_path: "/cluster/work/fuge/AISCO/wp1_cfd_ai/results/metrics.csv"
