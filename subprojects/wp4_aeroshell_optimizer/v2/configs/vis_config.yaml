    ui: "Questrial, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif"  # #FFFFFF
    mono: "'Courier New', monospace"  # #FFFFFF

  palette:
    background: "#23283E"            # #23283E
    background_soft: "#1D2233"       # #1D2233
    background_deep: "#151A28"       # #151A28
    panel: "#27314A"                 # #27314A
    panel_2: "#303D5D"               # #303D5D
    panel_top_start: "#35466D"       # #35466D
    panel_top_end: "#2B3754"         # #2B3754
    border: "#2D3A55"                # #2D3A55
    text: "#FFFFFF"                  # #FFFFFF
    muted: "#D2E0F2"                 # #D2E0F2
    title_1: "#FFFFFF"               # #FFFFFF
    title_2: "#FF504D"               # #FF504D
    surface_large: "#C33531"         # #C33531
    text_box: "#D2E0F2"              # #D2E0F2
    assembly: "#F39C12"              # #F39C12
    aeroshell: "#5DADE2"             # #5DADE2
    outer_bbox: "#23283E"            # #23283E
    white: "#FFFFFF"                 # #FFFFFF
    black: "#000000"                 # #000000

  status:
    success_text: "#2D5016"          # #2D5016
    success_bg: "#E8F5E9"            # #E8F5E9
    error_text: "#7A0E0E"            # #7A0E0E
    error_bg: "#FFEBEE"              # #FFEBEE
    warning_text: "#F8D9D9"          # #F8D9D9
    warning_bg: "rgba(200, 100, 0, 0.25)"  # #C86400
    ok_text: "#B8F0B8"               # #B8F0B8
    ok_bg: "rgba(0, 120, 0, 0.25)"   # #007800

  metrics:
    drag_border: "#5DADE2"           # aeroshell blue (aerodynamic)
    drag_text: "#FFFFFF"             # white text (legibility)
    solar_border: "#F39C12"          # assembly orange (solar/energy)
    solar_text: "#FFFFFF"            # white text (legibility)
    speed_border: "#FF504D"          # title_2 red (performance/speed)
    speed_text: "#FFFFFF"            # white text (legibility)
    unit_text: "#D2E0F2"             # muted light blue (secondary info)

  rgba_effects:
    shadow: "0 14px 30px rgba(0, 0, 0, 0.26)"  # #000000
    hover_glow: "0 0 10px 2px rgba(200, 33, 33, 0.4)"  # #C82121
    active_glow: "0 0 14px 2px rgba(200, 33, 33, 0.5)"  # #C82121
    panel_overlay: "rgba(255, 255, 255, 0.06)"  # #FFFFFF
    workspace_top: "rgba(0, 0, 0, 0.22)"  # #000000

  gradients:
    page_bg: "radial-gradient(circle at top left, #344267 0%, #1D2233 45%, #151A28 100%)"  # #344267
    top_bar: "linear-gradient(180deg, #35466D 0%, #2B3754 100%)"  # #35466D
    intro_card: "linear-gradient(135deg, #1A2744 0%, #0D1120 100%)"  # #1A2744
    arcade_bg: "radial-gradient(ellipse at 38% 28%, #27366B 0%, #18233D 45%, #0D1120 100%)"  # #27366B

  threejs:
    mesh_background: "#F1F7F3"       # #F1F7F3
    mesh_fallback: "#99A3A4"         # #99A3A4
    slider_accent: "#C33531"         # #C33531
    control_text: "#000000"          # #000000

  assembly_selection:
    border: "#374670"                # dark blue border
    panel: "#1D2233"                 # dark panel background
    text: "#FFFFFF"                  # white text
    muted: "#8FA3B1"                 # light muted text
    blue: "#2563EB"                  # blue accent
    green: "#22C55E"                 # bright green
    red: "#FF504D"                   # theme title-2 red
    canvas_bg: "#111827"             # dark canvas background
    canvas_grid: "rgba(255,255,255,0.10)"  # subtle white grid lines
    canvas_axis: "rgba(255,255,255,0.4)"   # fallback axis (unused when axis_x/y set)
    canvas_axis_x: "#C33531"         # X axis = corporate red
    canvas_axis_y: "#5DADE2"         # Y axis = aeroshell blue
    canvas_label: "#FFFFFF"          # white axis/part labels
    canvas_poly_stroke: "#FFFFFF"    # white wheelbase polygon
    canvas_poly_fill: "rgba(255,255,255,0.10)"  # white polygon fill
    canvas_wheel: "#FFFFFF"          # white wheels
    canvas_wheel_hover: "#FFFFFF"    # white wheel hover
    canvas_seat: "#FFFFFF"           # white seat
    canvas_seat_hover: "#FFFFFF"     # white seat hover
    canvas_seat_stroke: "#FFFFFF"    # white seat stroke

  colormaps:
    cfd_ai: "jet"                    # #FF504D
    sdf: "inferno"                   # #5DADE2

# --- GIF / PNG rendering ---
fps: 10
window_width: 1280 # pixels; only used for GIF & PNG rendering. Increase for higher-res images, but beware of OOM errors on HPC.
window_height: 720

camera_direction: "Y"        # which axis the camera looks along: X, Y, or Z
camera_distance_multiplier: 1.0  # smaller = more zoomed in
camera_elevation_angle: 0.0     # degrees above the horizontal plane

point_size: 3                    # pixels per rendered point
background_color: [0.1373, 0.1569, 0.2431, 1.0]  # RGBA for #23283E

# --- CentralVisManager extras (central_vis_manager_v2.py) ---
extras:
  alpha_enabled: false          # enable per-vertex RGBA (vs RGB-only) in PLY writes
  alpha_value: 1.0              # global alpha in [0, 1]; only used when alpha_enabled: true
  coordinate_system: false      # merge coordinate-frame axes into each PLY
  coordinate_system_scale: 0.1  # axis length as fraction of bounding-box diagonal

# --- Vis-resolution mesh extraction (make_vis_extractor) ---
vis_extraction:
  resolution: 64           # marching-cubes grid resolution for vis; 64 is fast, 128 is high quality
  bbox_scale_factor: 1.6   # vis bbox = outer-prism bounds scaled by this factor

# --- GIF auto-generation settings (central_vis_manager.finalize) ---
gif:
  enabled: true
  fps: 10
  max_frames: 200     # downsample sequence if it exceeds this; null = no limit
  pool_workers: 1     # subprocess count for GIF rendering; keep at 1 on HPC (EGL context conflicts)

# --- Per-visual-type settings ---
# Keys follow the visual_type string passed to CentralVisManager.save_ply().
# Hierarchy: aero/cp_field lives at visual_types.aero.cp_field in YAML.
# Fields per entry:
#   enabled:            bool — false → save_ply() is a silent no-op
#   colormap:           matplotlib colormap name, or null for uniform color
#   interval:           int — save every N epochs (enforced by caller, not manager)
#   alpha_enabled:      bool | null — per-type override; null = use global extras.alpha_enabled
#   coordinate_system:  bool | null — per-type override; null = use global extras.coordinate_system
#   vmin:               float | null — fixed lower colormap bound; null = auto-range per epoch
#   vmax:               float | null — fixed upper colormap bound; null = auto-range per epoch
#   solid_color_rgb:    [r,g,b] floats in [0,1] — fallback color when colormap/scalars are unavailable
visual_types:
  mesh_shape:
    enabled: false
    colormap: null          # uniform dark-blue — shape is the information
    interval: 1
    alpha_enabled: true
    coordinate_system: null
    vmin: null
    vmax: null
    solid_color_rgb: [0.7608, 0.2078, 0.1922]   # #C33531 corporate large-surface red

  aero:
    cp_field:
      enabled: true
      colormap: "jet"     # CFD AI colormap
      interval: 1
      alpha_enabled: null
      coordinate_system: null
      vmin: -2.0            # fixed range for cross-epoch comparability
      vmax: 1.0
      solid_color_rgb: [1.0, 0.3137, 0.3020]     # #FF504D highlight red

    gradient:
      enabled: true       # aalthaus: did this ever work?
      colormap: "RdBu_r"
      interval: 1
      alpha_enabled: null
      coordinate_system: null
      vmin: null
      vmax: null
      solid_color_rgb: [1.0, 0.3137, 0.3020]

    sdf_influence:
      enabled: false
      colormap: "inferno"  # SDF colormap
      interval: 1
      alpha_enabled: null
      coordinate_system: null
      vmin: null
      vmax: null

  solar:
    quality:
      enabled: true
      colormap: "Reds"   # [0,1] bounded selection weight (corporate red ramp)
      interval: 1
      alpha_enabled: null
      coordinate_system: null
      vmin: 0.0
      vmax: 1.0
      solid_color_rgb: [1.0, 0.3137, 0.3020]
    selection:
      enabled: true
      colormap: "RdBu_r"  # [0,1] bounded selection weight
      interval: 1
      alpha_enabled: null
      coordinate_system: null
      vmin: 0.0
      vmax: 1.0
      solid_color_rgb: [1.0, 0.3137, 0.3020]

    shading:
      enabled: true
      colormap: "Blues" # [0,1] bounded shading visibility (corporate light-blue family)
      interval: 1
      alpha_enabled: null
      coordinate_system: null
      vmin: 0.0
      vmax: 1.0
      solid_color_rgb: [0.8235, 0.8784, 0.9490]   # #D2E0F2 text-box blue

    penalty:
      enabled: true
      colormap: "Reds"     # per-face power lost to shading, lower-bounded at 0
      interval: 1
      alpha_enabled: null
      coordinate_system: null
      vmin: 0.0
      vmax: null            # auto upper bound per epoch
      solid_color_rgb: [0.7608, 0.2078, 0.1922]

    numerical_factor:
      enabled: true
      colormap: "Reds"   # [0,1] effective loss multiplier after λ/κ applied to visibility
      interval: 1
      alpha_enabled: null
      coordinate_system: null
      vmin: 0.0
      vmax: 1.0
      solid_color_rgb: [1.0, 0.3137, 0.3020]

    receiver_mask:
      enabled: true
      colormap: "RdYlGn"  # 0=back-facing (skipped), 1=sun-facing (raytraced)
      interval: 1
      alpha_enabled: null
      coordinate_system: null
      vmin: 0.0
      vmax: 1.0

    vision_cone_mask:
      enabled: false
      colormap: "RdYlGn"  # 0=selectable (green), 1=excluded by vision cone (red)
      interval: 1
      alpha_enabled: null
      coordinate_system: null
      vmin: 0.0
      vmax: 1.0

    binary_mask:
      enabled: true
      colormap: null
      binary_colors_rgb:
        - [0.365, 0.678, 0.886]   # 0 = not selected (light grey)
        - [0.137, 0.157, 0.247]   # 1 = solar cell placed (solar yellow)
      interval: 1
      alpha_enabled: null
      coordinate_system: null
      vmin: 0.0
      vmax: 1.0

  bb_constraint:
    enabled: true          # disabled by default — confirm with user before enabling
    colormap: "Reds"        # violation magnitude, lower-bounded at 0
    interval: 1
    alpha_enabled: null
    coordinate_system: null
    vmin: 0.0
    vmax: null
    solid_color_rgb: [0.7608, 0.2078, 0.1922]

  mesh_assembly_v4:
    enabled: true
    colormap: null          # colours specified per-component via method arguments
    interval: 1
    alpha_enabled: true
    coordinate_system: null
    vmin: null
    vmax: null
    solid_color_rgb: [0.7608, 0.2078, 0.1922]
    # Per-component colours (RGB in [0, 1]) and opacities (in [0, 1]):
    sdf_color: [0.365, 0.678, 0.886]          # aeroshell mesh (#5DADE2)
    sdf_alpha: 0.6                            # aeroshell opacity
    inner_color: [0.953, 0.612, 0.071]  # inner assembly (#F39C12)
    outer_color: [0.137, 0.157, 0.243]  # outer bbox (#23283E)
    outer_alpha: 0.2                    # outer bbox opacity (used by legacy solid mode)
    outer_render_style: "outer_lines_only"  # outer_lines_only|solid+edges
    outer_lines_color: [0.137, 0.157, 0.243] # dark corporate background tone for outlines
    outer_lines_width: 0.6              # target line width in viewer (browser-dependent)
    outer_lines_threshold: 45           # EdgesGeometry angle threshold (degrees): larger = fewer edges
    cone_render_style: "cone_lines_only"  # cone_lines_only|solid
    cone_lines_color: [0.5, 0.1, 0.5]  # purple wireframe for vision cone
    cone_lines_threshold: 15            # EdgesGeometry angle threshold for cone edges

  # Per-loss gradient visualisation (`vis_mesh_gradient`). Each call writes
  # ``mesh_gradients/<loss_key>/epoch_XXXXX.ply`` and finalize() generates the
  # corresponding GIF; the ancestor lookup means every loss_key inherits this
  # parent block unless an explicit override is added below it.
  # Colormap is diverging (RdYlGn: red = optimizer pushes inward, yellow =
  # neutral, green = optimizer pushes outward). vmin/vmax null -> symmetric
  # +/-max(|update.n|) per epoch.
  mesh_gradients:
    enabled: true
    colormap: "RdYlGn"
    interval: 1
    alpha_enabled: null
    coordinate_system: null
    vmin: null
    vmax: null
    solid_color_rgb: [1.0, 0.3137, 0.3020]

  latent:
    sampling:
      enabled: true
      colormap: null        # point-cloud snapshot — uniform colour per component
      interval: null        # interval NOT enforced by manager; caller controls cadence
      alpha_enabled: null
      coordinate_system: null
      vmin: null
      vmax: null
      solid_color_rgb: [1.0, 1.0, 1.0]        # #FFFFFF title/text white

# ===========================================================================
# Latent pretraining visualisation
# ===========================================================================
latent_pretraining:
  vis_cadence_pretraining: 100
  vis_show_domain_pts: true       # include eikonal domain points in latent sampling vis
  vis_show_target_pts: "pts"      # "pts" = surface samples, "mesh" = reconstructed mesh
  mesh_resolution: 128            # marching-cubes resolution for pretraining vis meshes
  make_gif: false                 # assemble per-epoch PLYs into a GIF at finalize()

  # Latent-space exploration survey (explore_latent_space.py modes 1–3).
  # Runs at finalize() if enabled: true. Gated to avoid overhead on short runs.
  latent_space_exploration:
    enabled: false                # true = run explore_latent_space at finalize()
    n_circle: 90                  # Mode 1: equally-spaced samples on the pretrained circle
    n_interp: 7                   # Mode 3: interpolation steps per adjacent pair
    resolution: 64                # marching cubes resolution
    radii: [0.0, 0.5, 1.0, 1.5, 2.0, 2.5, 3.0]  # Mode 2: radii to sweep

# --- Pretraining PLY / PNG export colours ---
mesh_colour_dark_blue: [0, 0, 139]
point_colour_green: [34, 139, 34]   # target / surface samples
point_colour_grey: [41, 41, 41]     # eikonal domain samples
point_colour_red: [220, 30, 30]     # model surface prediction

# --- Latent space exploration (explore_latent_space.py) ---
latent_space_exploration:
  n_circle: 90        # Mode 1: equally-spaced samples on the pretrained circle
  n_interp: 7         # Mode 3: interpolation steps per adjacent pair (controls PLY count)
  resolution: 64      # marching cubes grid resolution (lower = faster)
  radii: [0.0, 0.5, 1.0, 1.5, 2.0, 2.5, 3.0]  # Mode 2: radii to sweep per pretrained direction

# ===========================================================================
# Latent optimisation visualisation
# ===========================================================================
latent_optimisation:
  vis_cadence_optimisation: 100    # write vis snapshot every N optimisation epochs
  vis_strategy: static            # static/dynamic: vis at original pretrained Z circle or those that are actively being evaluated by losses

  vis_all_losses: true           # Compute cost = N_slots × N_active_losses renders per vis epoch.

  # Circle survey: sweep N angles on the pretrained z-circle and render a GIF.
  # Called once after pretraining (epoch 0) and then every `cadence` optimisation
  # epochs. Each call writes to circle_survey/epoch_XXXXX/ so finalize() generates
  # one GIF per survey snapshot.
  vis_latent_circle_survey:
    enabled: false
    cadence: 100                    # run survey every N optimisation epochs (0 = only after pretraining)
    n_circle_samples: 90          # number of evenly-spaced angles on the z-circle
    z_radius: 2.0                 # must match z_radius used in pretraining
    mesh_resolution: 64           # marching-cubes resolution for circle survey meshes
    bbox_scale_factor: 1.2        # vis bbox scale (relative to outer prism)
    layout_from_resample_mode: true  # true = derive layout from z_resample_mode (on_circle→strip, in_circle→pizza); false = use layout above
    layout: "pizza"               # "strip" = horizontal PNG strip; "grid" = 2D Cartesian grid PNG; "pizza" = concentric circles grid PNG
    save_plys: true               # for further investigation
    # pizza-mode only (ignored for strip/grid):
    pizza_r_min: 0.5              # innermost radius
    pizza_r_max: 2.0              # outermost radius
    pizza_r_steps: 4              # number of concentric circles
