loading:
  ply_path: "/cluster/work/fuge/AISCO/00_meshes_to_keep/original_silvretta_no_wheels_scaled_to_mm.ply"
  ply_scaling_factor: 1.0

solar_loss:
  class: "SolarSR"   # SolarV3 | SolarV3B2 | SolarV5 | SolarV6 | SolarV7 | SolarSR | SolarSRRT | SolarMR | SolarMRRT

sdf_model:
  grid_resolution: 128       # R — precomputes an R³ SDF grid once; higher = more accurate, more VRAM during precompute
  cache_dir: "sdf_cache"   # relative to testbench folder; set to null to disable disk caching

vis_manager:
  enabled: true
  run_dir: "/cluster/work/fuge/AISCO/wp3_solar_estimator/testbench_runs"
  run_id: "testbench"
  true_scale: false
