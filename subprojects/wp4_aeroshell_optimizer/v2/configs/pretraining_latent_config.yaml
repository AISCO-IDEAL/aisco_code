model_name: "ConcatWIREV5" # only used for standalone pretraining. If in main loop, the model_name from general_config.yaml is used.
z_placement: "circle"
z_radius: 2.0  # unit-circle radius for pretrained latent codes.
              # Spatial inputs are mm/1000 ≈ [-5, 5]; z_radius=2.0 gives latents a
              # comparable magnitude to the dominant spatial axis.
force_pretraining: force # iff false, a hashed pretraining will be used if applicable

# One entry per latent slot.  Slot 0 maps to z₀ = origin.
# shape_type: "sphere" | "cube" | "ply"
# All keys must be present (set unused keys to null).
#
# PLY-specific keys:
#   ply_scale: multiplies raw vertex coordinates → mm.
#     100.0   if PLY is stored in decimetres (AISCO pretraining convention)
#     1.0     if PLY is already in mm
#   surface_noise_sigma_factor: σ = factor × bbox_extent_mm.
#     0.005   ≈ DeepSDF tight band (σ ≈ 25mm at car scale)
#     0.05    wider band (σ ≈ 250mm at car scale, default)
