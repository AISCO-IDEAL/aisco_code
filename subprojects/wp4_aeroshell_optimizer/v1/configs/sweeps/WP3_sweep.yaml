# ============================================================================
# Wandb Sweep Config — Solar Loss Method Comparison (grid)
# ============================================================================
# Parameter naming: <config_filename_without_yaml>.<nested.path.to.value>
# See wandb_sweep_v1_50_meshes.yaml for full documentation.
# ============================================================================
program: subprojects/wp4_aeroshell_optimizer/v1/src/main_files/main_v1_1_one_model.py
method: grid
metric:
  goal: minimize
  name: total_loss
parameters:
  solar_loss_config.SolarLossConfigV3.method:
    values: ["diso_dmc", "diso_mc", "flexicubes", "mesh_sdf"]
  solar_loss_config.SolarLossConfigV3.resolution:
    values: [128, 250]
  solar_loss_config.SolarLossConfigV3.sigmoid_sharpness:
    values: [1.0, 10.0]
