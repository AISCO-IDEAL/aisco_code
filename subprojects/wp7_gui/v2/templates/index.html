<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WP7 Multi-Page GUI</title>
    <style>
        :root {
            --bg: #1d2233;
            --panel: #27314a;
            --panel-2: #303d5d;
            --accent: #c82121;
            --accent-2: #a91b1b;
            --text: #ecf2f6;
            --muted: #bac8d0;
            --shadow: 0 14px 30px rgba(0, 0, 0, 0.26);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text);
            background: radial-gradient(circle at top left, #344267 0%, #1d2233 45%, #151a28 100%);
            display: grid;
            place-items: center;
        }

        .shell {
            width: min(100vw, calc(100vh * (16 / 9)));
            height: min(100vh, calc(100vw * (9 / 16)));
            aspect-ratio: 16 / 9;
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 10px;
            padding: 10px;
        }

        .top-bar {
            background: linear-gradient(180deg, #35466d 0%, #2b3754 100%);
            border-radius: 14px;
            padding: 10px 14px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .top-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .top-brand img {
            height: 36px;
            width: auto;
            object-fit: contain;
            display: block;
        }

        .top-bar-label {
            margin: 0;
            font-size: 0.86rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #ffd2d2;
            font-weight: 700;
            white-space: nowrap;
        }

        .body-layout {
            min-height: 0;
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 10px;
        }

        .sidebar {
            background: linear-gradient(180deg, var(--panel-2) 0%, var(--panel) 100%);
            border-radius: 14px;
            padding: 14px;
            display: grid;
            grid-template-rows: auto 1fr auto;
            gap: 12px;
            box-shadow: var(--shadow);
        }

        .headline {
            margin: 0;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #f8d9d9;
            text-align: center;
        }

        .nav {
            display: grid;
            gap: 8px;
            align-content: start;
        }

        .nav-button {
            border: 1px solid transparent;
            border-radius: 10px;
            padding: 11px 12px;
            text-align: left;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text);
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 140ms ease, border-color 140ms ease, transform 120ms ease;
        }

        .nav-button:hover {
            transform: translateX(2px);
            background: rgba(255, 255, 255, 0.12);
        }

        .nav-button.active {
            background: var(--accent);
            border-color: #ffb0b0;
            color: #fff;
        }

        .footer {
            font-size: 0.8rem;
            color: var(--muted);
            text-align: center;
        }

        .workspace {
            min-width: 0;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: var(--shadow);
            display: grid;
            grid-template-rows: auto 1fr;
        }

        .workspace-top {
            background: rgba(0, 0, 0, 0.24);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        #pageTitle {
            margin: 0;
            font-size: 1rem;
            letter-spacing: 0.03em;
        }

        #pageHint {
            margin: 0;
            color: var(--muted);
            font-size: 0.88rem;
        }

        #pageFrame {
            width: 100%;
            height: 100%;
            border: none;
            background: #1e2437;
        }

        @media (max-width: 980px) {
            .body-layout {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
                gap: 8px;
            }

            .sidebar {
                grid-template-rows: auto auto;
            }

            .nav {
                grid-template-columns: repeat(3, minmax(120px, 1fr));
            }

            .nav-button {
                text-align: center;
            }

            .top-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .top-brand img {
                height: 30px;
            }
        }
    </style>
</head>

<body>
    <main class="shell">
        <header class="top-bar">
            <div class="top-brand" aria-label="Team logos">
                <img src="/ideal.png" alt="IDEAL logo">
                <img src="/logo.png" alt="AISCO logo">
                <img src="/aCe.png" alt="aCe logo">
            </div>
            <p class="top-bar-label">WP7 Unified Multi-Page GUI</p>
        </header>

        <div class="body-layout">
            <aside class="sidebar">
                <h1 class="headline">WP7 Navigation</h1>

                <nav class="nav" aria-label="GUI pages">
                    <button class="nav-button" data-page="optimization">Optimization Workspace</button>
                    <button class="nav-button" data-page="solar">Solar Viewer</button>
                    <button class="nav-button" data-page="logs">Run Logs</button>
                    <button class="nav-button" data-page="testing">🔧 CLI Testing</button>
                    <button class="nav-button" data-page="config_overrides">⚙ Config Overrides</button>
                </nav>

                <div class="footer">Single launch, multi-page GUI shell</div>
            </aside>

            <section class="workspace">
                <header class="workspace-top">
                    <h2 id="pageTitle">Optimization Workspace</h2>
                    <p id="pageHint">Live run controls, artifacts, and mesh playback.</p>
                </header>
                <iframe id="pageFrame" title="WP7 content area"></iframe>
            </section>
        </div>
    </main>

    <script>
        const PAGE_CONFIG = {
            optimization: {
                title: "Optimization Workspace",
                hint: "Live run controls, artifacts, and mesh playback.",
                src: "/ui/page/optimization"
            },
            solar: {
                title: "Solar Viewer",
                hint: "Focused solar placement rendering from latest artifacts.",
                src: "/ui/page/solar"
            },
            logs: {
                title: "Run Logs",
                hint: "Live textual logs and progress monitoring.",
                src: "/ui/page/logs"
            },
            testing: {
                title: "CLI Testing",
                hint: "Test CLI argument passthrough and GUI infrastructure.",
                src: "/ui/page/testing"
            },
            config_overrides: {
                title: "Config Overrides",
                hint: "Edit whitelisted config values, save to a session folder, then run.",
                src: "/ui/page/config_overrides"
            }
        };

        const buttons = Array.from(document.querySelectorAll(".nav-button"));
        const pageTitle = document.getElementById("pageTitle");
        const pageHint = document.getElementById("pageHint");
        const pageFrame = document.getElementById("pageFrame");

        function selectPage(pageKey) {
            const page = PAGE_CONFIG[pageKey];
            if (!page) {
                return;
            }

            buttons.forEach((button) => {
                button.classList.toggle("active", button.dataset.page === pageKey);
            });

            pageTitle.textContent = page.title;
            pageHint.textContent = page.hint;

            if (pageFrame.dataset.page !== pageKey) {
                pageFrame.src = page.src;
                pageFrame.dataset.page = pageKey;
            }

            if (window.location.hash !== `#${pageKey}`) {
                window.location.hash = pageKey;
            }
        }

        function resolveInitialPage() {
            const hashValue = window.location.hash.replace("#", "").trim();
            if (hashValue && Object.prototype.hasOwnProperty.call(PAGE_CONFIG, hashValue)) {
                return hashValue;
            }
            return "optimization";
        }

        buttons.forEach((button) => {
            button.addEventListener("click", () => selectPage(button.dataset.page));
        });

        window.addEventListener("hashchange", () => {
            const pageKey = resolveInitialPage();
            selectPage(pageKey);
        });

        selectPage(resolveInitialPage());
    </script>
</body>

</html>
