# WIRE V5: Multi-scale improvements over V4
#
# Three key changes:
#
# 1. Decoupled Gabor layer (GaborLayerV5):
#    - Independent wave and decay projections instead of a shared splitter.
#    - This lets the network separately learn which directions control frequency vs. envelope.
#    - Log-parameterised omega/scale: stored and optimised in log-space so they stay positive.
#
# 2. Coarse-to-fine frequency schedule:
#    - Hidden layers are tiled log-uniformly across [hidden_omega_min, hidden_omega_max].
#    - Layer j covers its own frequency band, starting coarse (layer 0) and ending fine (last layer).
#    - For this to be useful, set hidden_omega_max >> hidden_omega_min (e.g., 5→150).
#    - Scale is tiled the same direction: low omega gets wide Gaussians, high omega gets narrow.
#
# 3. Geometry-aware normalisation:
#    - Coordinates are shifted by bbox_center and divided by bbox_half_extent.
#    - Old behaviour (/1000) is preserved with defaults (center=[0,0,0], extent=1000).
#    - Use actual geometry bounds: bbox_center=centroid, bbox_half_extent=half of longest axis.

in_features: 3
hidden_features: 512
hidden_layers: 4
out_features: 1
skip_layer_idx: 1

# First layer: V4 range. Acts as a wide-band feature extractor.
first_omega_min: 1.0
first_omega_max: 20.0
first_scale_min: 1.25
first_scale_max: 50

# Hidden layers: V4-compatible range [1, 5] applied coarse-to-fine per layer.
# Layer j gets a log-uniform sub-band; earlier layers handle lower frequencies.
# omega/scale are trainable — with the log floor at 0, both stay ≥ 1 during
# optimisation so neither collapses (see GaborLayerV5.forward clamp).
hidden_omega_min: 1.0
hidden_omega_max: 8.0
hidden_scale_min: 1.0
hidden_scale_max: 35.0

train_omega: False
train_scale: False

# Geometry-aware normalisation (backward-compatible default = /1000 from V4)
# Default [center=[0,0,0], extent=1000] is equivalent to WIREV4's coords/1000.
# Override only if your geometry has different bounds. Example: 5m car centered at z=1000mm
# would use bbox_center=[0, 0, 1000], bbox_half_extent=2500.0
bbox_center: [0.0, 0.0, 0.0]
bbox_half_extent: 1000.0

dtype: "float32"
