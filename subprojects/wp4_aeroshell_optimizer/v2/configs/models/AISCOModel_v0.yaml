# =============================================================================
# AISCOModel v0 — single-shape SDF MLP (default constructor kwargs)
# =============================================================================
#
# Loaded by smart_model_init -> passed as **model_config to AISCOModel(...).
# Every key here maps directly to an AISCOModel.__init__ argument.
#
# -----------------------------------------------------------------------------
# Conceptual overview
# -----------------------------------------------------------------------------
# AISCOModel is a 10-Linear-layer MLP that maps a 3-D point (x,y,z in mm) to
# a single signed-distance scalar. The architecture is fully driven by the
# fields below; in plain English it works as follows:
#
#   1. Coordinate scaling
#        Inputs are divided by `input_scale` so the MLP operates on
#        ~unit-scale numbers regardless of the physical extent of the shape.
#        The output is multiplied back by `output_scale` so the network
#        speaks the same metric (mm) as the rest of the pipeline.
#
#   2. Sinusoidal positional encoding (NeRF-style, `fourier_levels = L`)
#        gamma(x) = [x, sin(2^k pi x), cos(2^k pi x)]_{k=0..L-1}
#        Effective input dim becomes 3 * (1 + 2L). This widens the frequency
#        basis the MLP can represent, which is the cheapest path to capturing
#        fine geometric detail (bunny ears, toes, creases). L=0 disables it
#        and reproduces the legacy un-encoded behaviour bit-exact.
#
#   3. Hidden trunk (`hidden_dims`)
#        A 9-deep stack of Linear layers (256 -> 256 -> 256 -> 512 -> 512 ->
#        512 -> 512 -> 384 -> 256) followed by a 256 -> 1 output Linear, for
#        10 Linear layers total. The 512-wide mid-stack supplies capacity for
#        non-linear regions; the 384/256 taper trades parameters for a
#        smoother last-layer manifold.
#
#   4. Input re-injection (`concat_input_at`)
#        At the listed 1-indexed layers, the encoded input is re-concatenated
#        onto the layer's input. This restores positional information that
#        would otherwise wash out in deeper layers (the standard DeepSDF /
#        SIREN trick). Re-injecting on every other layer (1,3,5,7,9) gave the
#        deepest trunk the strongest positional signal of all swept variants.
#
#   5. Residual additions (`residual_at`)
#        At the listed layers the layer's input is added to its post-
#        activation output. A learnable Linear projection is auto-built when
#        shapes differ. Residuals at (4,6,8) shore up gradient flow through
#        the 512-wide trunk and the 512 -> 384 -> 256 taper.
#
#   6. Activations (`activations`, length = 10)
#        One activation is applied AFTER each Linear. The winning profile
#        ("profile C") interleaves SiLU with LeakyReLU in the mid-stack:
#        SiLU gives smooth gradients (good Eikonal behaviour); LeakyReLU
#        adds piecewise-linear capacity, which is what carves crisp creases
#        like the bunny's ear ridges. Pure-smooth profiles produced
#        ellipsoids; pure piecewise-linear profiles produced cardboard SDFs.
#
# Recognised activations: silu, leakyrelu, linear. (Other families and
# sine/SIREN were tried and dropped — wobbly SDFs or training instabilities.)
#
# -----------------------------------------------------------------------------
# Tuning history
# -----------------------------------------------------------------------------
# These defaults are baked from the stage-2 refinement sweep winner
# (run hash `186b3aad3b`, project `aisco/AISCOModel_Pretraining_Single`) —
# qualitatively the cleanest bunny mesh: smooth body, captures most local
# detail, and starts to connect both ears to the head. The stage-1 winner
# ("fanciful-sweep #11", run `bw8cja3s`) only managed a coarse blob bunny.
# =============================================================================

# --- I/O ---
in_features: 3        # x, y, z
out_features: 1       # signed distance scalar

# --- Architecture (10 Linear layers total = len(hidden_dims) + 1) ---
#   layer 1:  enc -> 256       (concat input)
#   layer 2:  256 -> 256
#   layer 3:  256 -> 256       (concat input)
#   layer 4:  256 -> 512                          (residual)
#   layer 5:  512 -> 512       (concat input)
#   layer 6:  512 -> 512                          (residual)
#   layer 7:  512 -> 512       (concat input)
#   layer 8:  512 -> 384                          (residual)
#   layer 9:  384 -> 256       (concat input)
#   layer 10: 256 -> 1         (output)
hidden_dims: [256, 256, 256, 512, 512, 512, 512, 384, 256]

# Profile C (winning): SiLU baseline + LeakyReLU at 3, 5, 7. Linear output.
activations: [silu, silu, leakyrelu, silu, leakyrelu, silu, leakyrelu, silu, silu, linear]

# 1-indexed layer numbers where the (scaled, encoded) input features are
# re-concatenated onto the layer's input.
concat_input_at: [1, 3, 5, 7, 9]

# 1-indexed layer numbers where the layer's input (after any concat) is added
# back to its post-activation output. A learnable projection is auto-created
# when input/output dims differ (e.g. layer 4: 256 + enc_dim -> 512).
residual_at: [4, 6, 8]

# --- Coordinate scaling ---
# Lower input_scale -> larger numbers reach the MLP -> wider frequency
# budget. 400 mm was the sweet spot in stage-2 (200 over-sharpened at
# car-scale, 1000 produced ellipsoids).
input_scale: 400.0
output_scale: 1000.0   # multiplies output (back to mm)

# --- Misc ---
bias: true

# --- Memory control ---
# When the input batch dimension exceeds this value, forward() splits the
# input into chunks of this size and concatenates the outputs. This bounds
# peak activation memory for dense-grid evaluations (e.g. ConnectednessV1's
# voxel grid which previously triggered a 4 GiB CUDA OOM on layer 5/512).
# Set to 0 to disable chunking.
forward_chunk_size: 131072

# --- Sinusoidal positional encoding (NeRF-style) ---
# When > 0, the (scaled) input fed to the network is
#   gamma(x) = [x, sin(2^k pi x), cos(2^k pi x)]_{k=0..L-1}
# of effective dim 3*(1 + 2L), and the same encoding is re-injected at every
# `concat_input_at` layer. 0 disables it (legacy, backward-compatible with
# pre-Fourier checkpoints). 4 was the stage-2 winner; higher (>=8) produced
# noisy SDFs at this batch size.
fourier_levels: 4
