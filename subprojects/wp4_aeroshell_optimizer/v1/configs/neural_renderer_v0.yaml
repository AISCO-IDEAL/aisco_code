#This config includes everything regarding the visualiser and its wrapper you might need


neural_renderer:
  image_size: 1024
  background_color: [0.0,0.0,0.0]
  anti_aliasing: true
  camera_mode: "look_at"
  viewing_angle: 40


# Insert custom modes here, such as "clemens' solar mode"
rendering_modes:
#use alex_mode as an example
  alex_mode:
    #mandatory
    enabled: true
    class_path: "custom_modes.alex_mode:BasicAlexMode"
    # config that is passed as dictionary into your mode
    # Use for any settings that are relevant for you
    config:
      camera_position: [2000, 2000, 2000]
      look_at: [0, 0, 0]
      render_mode: "rgb"
      fps: 20

  assembly_mode:
    #mandatory
    enabled: false
    class_path: "custom_modes.assembly_mode:AssemblyMode"
    # config that is passed as dictionary into your mode
    # Use for any settings that are relevant for you
    config:
      camera_position: [3000, 3000, 3000]
      look_at: [0, 0, 0]
      render_mode: "rgb"
      color: [1.0 ,0.55 ,0.0]

  mesh_assembly_mode:
    #mandatory
    enabled: true
    class_path: "custom_modes.mesh_assembly_gif:MeshAssemblyGIF"
    # config that is passed as dictionary into your mode
    # Use for any settings that are relevant for you
    config:
      render_mode: "rgb"
      camera_position: [2500, 2500, 2500]
      look_at: [0, 0, 0]
      alpha: 0.5
      fps: 20
      assembly_color: [1.0, 0.55, 0.0]
      mesh_color: [0.2,1.0,1.0] #Bugged?

  solar_selection_mode:
    #Mandatory
    enabled: true
    class_path: "custom_modes.solar_selection:SolarSelectionMode"
    #config for solar selection
    config:
      camera_position: [-3000, 3000, 3000]
      look_at: [0, 0, 0]
      render_mode: "rgb"
      make_gif: true #if false saves seperate image every interval iterations
      render_interval: 1 #Rendering interval for gif/image. 1 means every iteration is rendered
      fps: 15
      solar_color: [0.2,0.2,0.8]
      rest_color: [1.0,0.5,0.0]

  solar_power_mode:
    #Mandatory
    enabled: true
    class_path: "custom_modes.solar_power:SolarPower"
    #config for solar selection
    config:
      camera_position: [-1000, 3000, 1000]
      look_at: [0, 0, 0]
      render_mode: "rgb"
      make_gif: true #if false saves seperate image every interval iterations
      render_interval: 1 #Rendering interval for gif/image. 1 means every iteration is rendered
      fps: 15

  example_advanced_mode:
    enabled: false
    class_path: "custom_modes.rendering_mode_example_advanced:ExampleAdvancedMode"
    config:
      camera_position: [-1000, 3000, 1000]
      look_at: [0, 0, 0]
      render_mode: "rgb"
      fps: 15
      render_interval: 10


# also not used?
storage_dir: "/cluster/home/aalthaus/AISCO_code/subprojects/wp4_aeroshell_optimizer/data/renderings"

