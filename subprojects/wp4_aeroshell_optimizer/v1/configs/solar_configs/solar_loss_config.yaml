# USED — solar_v6.py: cfg["SolarLossConfigV6"] -> entire dict passed to WP3's SolarLossEstimator (v6)
SolarLossConfigV6:
  australia_cfg: "solar_configs/australia.yaml"
  raytracing_version: "v2"
  route_version: "v2" # v1 or v2
  sun_vector_source: "fixed" # route | fixed
  fixed_sun_dir: [-1,0,1.5] # [x, y, z] when sun_vector_source=fixed
  method: "diso_mc" # diso_mc/diso_dmc/flexicubes or mesh_sdf
  bbox: [[-5000.0, 5000.0], [-5000.0, 5000.0], [-5000.0, 5000.0]]
  resolution: 100
  area_budget_mm2: 6000000
  device: "cuda"
  batch_size: 100
  eps: 1e-12
  sigmoid_sharpness: 8.0
  budget_penalty_weight: 0.1
  shading_penalty_weight: 1.0
  use_visibility_multiplier: True
  use_shading_penalty: True
  wandb_logging: True
  soft_mask_selection_threshold: 0.5
  soft_mask_full_selection_threshold: 0.95
  rendering: True
  selection_threshold_render: 0.03
  log_group_name: "solar_loss_metrics"
  shading:
    sun_batch_size: 1
    sun_subsample_fraction: 0.8 # 0..1 fraction of sun vectors to use
    sun_subsample_min: 1 # minimum sun vectors to keep
    sun_subsample_mode: "random" # random | first
    shading_render_interval: 1 # render every N epochs



# USED — solar_v7.py: cfg["SolarLossConfigV7"] -> entire dict passed to WP3's SolarLossEstimator (v7)
SolarLossConfigV7:
  australia_cfg: "solar_configs/australia.yaml"
  raytracing_version: "v2"
  route_version: "v2" # v1 or v2
  sun_vector_source: "fixed" # route | fixed
  fixed_sun_dir: [-1,0,1.5] # [x, y, z] when sun_vector_source=fixed
  method: "mesh_sdf" # diso_mc/diso_dmc/flexicubes or mesh_sdf
  bbox: [[-4000.0, 4000.0], [-4000.0, 4000.0], [-4000.0, 4000.0]]
  resolution: 50
  area_budget_mm2: 6000000
  device: "cuda"
  batch_size: 100
  sigmoid_sharpness: 8.0 # for soft budget selection
  budget_penalty_weight: 0.1
  # Loss formula parameters
  lambda: 1.0
  kappa: 1.0
  epsilon: 0.0005 # 0.0005 recommended value
  #####
  sun_batching:
    sun_batch_size: 4
    sun_subsample_fraction: 0.8 # 0..1 fraction of sun vectors to use
    sun_subsample_min: 1 # minimum sun vectors to keep
    sun_subsample_mode: "random" # random | first
    shading_render_interval: 1 # render every N epochs


  wandb_logging: True
  soft_mask_selection_threshold: 0.5
  soft_mask_full_selection_threshold: 0.95
  rendering: True
  selection_threshold_render: 0.03
  log_group_name: "solar_loss_metrics"
