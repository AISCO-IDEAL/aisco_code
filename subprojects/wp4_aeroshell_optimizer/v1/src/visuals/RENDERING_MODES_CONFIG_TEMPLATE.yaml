# Configuration template for neural_renderer with multiple rendering modes
#
# This config demonstrates how to:
# 1. Set up the shared Visualiser instance
# 2. Enable/disable rendering modes
# 3. Configure each mode with its own parameters
#
# IMPORTANT: Each team member should:
# 1. Create their own rendering_mode_<yourname>.py file
# 2. Add a new entry under rendering_modes below
# 3. Set enabled: true when ready to use
# 4. Provide mode-specific config parameters

neural_renderer:
  # ============ Shared Visualiser Settings ============
  # These settings apply to the single Visualiser instance
  # All rendering modes use these base settings

  image_size: 256                    # Resolution of rendered images
  background_color: [0.0, 0.0, 0.0] # RGB background
  anti_aliasing: true                # Enable anti-aliasing
  camera_mode: "look_at"             # Camera projection type
  viewing_angle: 30.0                # Field of view
  device: "cuda"                     # "cuda" or "cpu"

  # ============ Rendering Modes ============
  # Each mode gets its own configuration section
  # Modes run sequentially in update() and finalize()
  # Each mode manages its own frame storage

  rendering_modes:

    # ---- Example Mode (Template) ----
    # This is a reference implementation. Keep enabled: false
    example_mode:
      enabled: false
      class_path: "rendering_mode_example:ExampleRenderingMode"
      config:
        render_interval: 10                 # Render every N iterations
        camera_position: [4000, 0, 0]      # Camera position [x, y, z]
        look_at: [0, 0, 0]                 # Look-at point [x, y, z]
        fps: 15                            # GIF animation frame rate

    # ---- Person A's Mode ----
    # Team member should create rendering_mode_person_a.py
    # and configure below
    person_a_mode:
      enabled: false
      class_path: "rendering_mode_person_a:PersonAMode"
      config:
        # Add your mode-specific parameters here
        # Example:
        # render_interval: 5
        # custom_setting: "value"

    # ---- Person B's Mode ----
    # Team member should create rendering_mode_person_b.py
    # and configure below
    person_b_mode:
      enabled: false
      class_path: "rendering_mode_person_b:PersonBMode"
      config:
        # Add your mode-specific parameters here

    # ---- Person C's Mode ----
    # Team member should create rendering_mode_person_c.py
    # and configure below
    person_c_mode:
      enabled: false
      class_path: "rendering_mode_person_c:PersonCMode"
      config:
        # Add your mode-specific parameters here


