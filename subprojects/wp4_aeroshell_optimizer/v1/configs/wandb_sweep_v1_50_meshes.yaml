program: subprojects/wp4_aeroshell_optimizer/v1/src/main_files/main_v1_1_one_model.py
method: random
metric:
  goal: minimize
  name: total_loss
parameters:
  force_pretraining:
    value: True
  pretraining_shape:
    values: ["sphere", "cube"]
  model_params.hidden:
    values: [32, 64, 128]
  model_params.layers:
    values: [4, 6, 8]
  training_params.learning_rate:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.01
  training_params.optimizer:
    values: ["adam", "sgd"]
  training_params.num_epochs:
    values: [100, 200, 300]
