# Loaded by smart_model_init -> passed as **model_config to AISCOModel(...).
# Every key here maps directly to an AISCOModel.__init__ argument.

# --- I/O ---
in_features: 3        # x, y, z
out_features: 1       # signed distance scalar

# --- Architecture (10 Linear layers total = len(hidden_dims) + 1) ---
# Spec:
#   layer 1: 3   -> 256
#   layer 2: 256 -> 256
#   layer 3: 256 -> 256       (concat input)
#   layer 4: 256 -> 512
#   layer 5: 512 -> 512       (concat input + residual)
#   layer 6: 512 -> 512
#   layer 7: 512 -> 512
#   layer 8: 512 -> 256       (concat input + residual)
#   layer 9: 256 -> 128
#   layer 10: 128 -> 1        (output)
hidden_dims: [256, 256, 256, 512, 512, 512, 512, 256, 128]

# Activation applied AFTER each Linear (length = len(hidden_dims) + 1).
# Recognised: silu, gelu, relu, leakyrelu, elu, selu, mish, softplus, tanh,
#             snake, linear.
# (Sine/SIREN was removed: it proved unstable and produced wobbly SDFs.)
#
# Quick guide for SDFs (cars / boats):
#   silu, gelu, mish     -> smooth surfaces, good gradients (best general default)
#   elu, selu            -> smooth + non-zero mean; can sharpen mid-layer features
#   softplus             -> very smooth, excellent for Eikonal regularisation
#   leakyrelu, relu      -> piecewise-linear, edge-friendly but cardboard-like SDF
#   tanh                 -> bounded; useful at output for SDF clamping
#   snake                -> periodic capacity for creases. Sensitive: keep `snake_alpha_init`
#                          small (0.2-0.5) and place snake AWAY from layer 1 and AWAY
#                          from layers right after `concat_input_at` (your past
#                          NaNs came from snake at layer 1 + concat re-injection).
#
# === PRESETS — uncomment one to try, leave the rest commented ===============
# Each preset has 10 entries (9 hidden + 1 output). All are length-checked.

# --- Basic MLP ----------------------------------------------------------
activations: [tanh, relu, tanh, relu, tanh, relu, tanh, relu, tanh, linear]        # smooth, good general default
#
# --- Smooth baselines (controls) ----------------------------------------
# activations: [silu, silu, silu, silu, silu, silu, silu, silu, silu, linear]            # current baseline (too smooth)
# activations: [gelu, gelu, gelu, gelu, gelu, gelu, gelu, gelu, gelu, linear]            # heavier-tailed silu
# activations: [mish, mish, mish, mish, mish, mish, mish, mish, mish, linear]            # near-silu, slightly sharper
#
# --- Bounded output (clamps SDF magnitude before output_scale) ---------
# activations: [silu, silu, silu, silu, silu, silu, silu, silu, silu, tanh]              # SiLU body, tanh on last layer
# activations: [gelu, gelu, gelu, gelu, gelu, gelu, gelu, gelu, gelu, tanh]
#
# --- Mixed smooth: stronger curvature in the middle without breaking surface --
# activations: [silu, silu, gelu, gelu, gelu, gelu, gelu, silu, silu, linear]            # GELU mid-block
# activations: [silu, silu, mish, mish, mish, mish, mish, silu, silu, linear]
# activations: [silu, silu, elu, elu, silu, silu, silu, silu, silu, linear]              # ELU before residual
#
# --- Edge-aware (use sparingly: too much causes the cardboard look) ----
# activations: [silu, silu, silu, leakyrelu, silu, silu, silu, silu, silu, linear]       # ONE leakyrelu mid-stack
# activations: [silu, silu, leakyrelu, silu, silu, leakyrelu, silu, silu, silu, linear]  # two well-spaced
# activations: [silu, silu, silu, silu, leakyrelu, silu, silu, leakyrelu, silu, linear]  # late + middle
#
# --- Snake (periodic; needs small alpha_init, NOT at layer 1) ----------
# Set `snake_alpha_init: 0.3` below when using these.
# activations: [silu, silu, silu, snake, silu, silu, silu, silu, silu, linear]           # one snake at layer 4
# activations: [silu, silu, silu, silu, silu, snake, silu, silu, silu, linear]           # one snake at layer 6
# activations: [silu, silu, silu, snake, silu, silu, snake, silu, silu, linear]          # two well-separated snakes
#
# --- Hybrid (smooth surface, slight crease capacity at output edge) ----
# activations: [silu, silu, silu, silu, silu, silu, silu, silu, mish, tanh]              # mish penultimate + tanh output
#
# previous test results:
# activations: [silu, silu, silu, silu, silu, silu, silu, silu, silu, linear]: too smooth, misses fine details, wandb: https://wandb.ai/aisco/temp_/runs/oro8bbk8?nw=nwusereschaerer
# activations: [silu, gelu, leakyrelu, gelu, leakyrelu, silu, leakyrelu, silu, linear]: too much big rectangles and edges, no conversion, wandb: https://wandb.ai/aisco/temp_/runs/6lg7mxet?nw=nwusereschaerer
# activations: [snake, silu, silu, silu, silu, silu, silu, silu, silu, linear]: SDF missing for large parts, not even pretraining works, wandb: https://wandb.ai/aisco/temp_/runs/8i2fp7kn?nw=nwusereschaerer
# activations: [snake, snake, silu, snake, silu, silu, silu, silu, silu, linear]: very bad, lots of NaN losses, no geometry
# activations: [softplus, softplus, softplus, softplus, softplus, softplus, softplus, softplus, softplus, linear]  # no mesh, no geometry, bad, wandb: https://wandb.ai/aisco/temp_/runs/qgttbwqv?nw=nwusereschaerer
# activations: [gelu, silu, silu, gelu, silu, silu, gelu, silu, silu, linear] # only a few sharp pyramids, wandb: https://wandb.ai/aisco/temp_/runs/826mksb2?nw=nwusereschaerer



# 1-indexed layer numbers where the (scaled) input features are re-concatenated
# onto the layer's input.
concat_input_at: [3, 5, 8]

# 1-indexed layer numbers where the layer's input (after any concat) is added
# back to its post-activation output. A learnable projection is auto-created
# when input/output dims differ (e.g. layer 8: 515 -> 256).
residual_at: [5, 8]

# --- Coordinate scaling ---
input_scale: 1000.0   # divides input (mm -> ~unit-scale)
output_scale: 1000.0  # multiplies output (back to mm)

# --- Misc ---
bias: true

# Initial value for Snake's learnable per-channel alpha (only matters if any
# `snake` entry is in `activations`). Higher = higher-frequency capacity at
# init. For SDFs use 0.2-0.5; values >= 1.0 here have already produced NaNs
# in this codebase (see test results above).
snake_alpha_init: 0.3

# --- Memory control ---
# When the input batch dimension exceeds this value, forward() splits the
# input into chunks of this size and concatenates the outputs. This bounds
# peak activation memory for dense-grid evaluations (e.g. ConnectednessV1's
# voxel grid which previously triggered a 4 GiB CUDA OOM on layer 5/512).
# Set to 0 to disable chunking (matches old behaviour).
forward_chunk_size: 131072




