program: subprojects/wp3_solar_estimator/raytracing/easier_sweep.py
method: grid
entity: aisco
project: RTParam_Sweep
name: SDFRT - absorption,sigmoid x res 128,144,160,176,192
metric:
  goal: maximize
  name: solar_loss_metrics/visibility_histogram_std

parameters:
  # Keep the tested solar loss path fixed for this sweep
  solar_configs/solar_loss_config.SolarLossConfigV7.raytracing_version:
    value: "v2"

  solar_configs/raytracing_config.RaytracingConfigV2.sdf.method:
    values: ["absorption", "sigmoid"]

  solar_configs/solar_loss_config.SolarLossConfigV7.resolution:
    values: [128, 144, 160, 176, 192]
