# ============================================================================
# Sweep: ALM / CSE / scheduler-mode × model architecture
# Grid over all 16 combinations:
#   models     : ConcatWIREV3, WIREV5
#   ALM        : True, False
#   CSE        : True, False
#   scheduler  : skip, zero_weighted
#
# Parameter naming: <config_filename_without_yaml>.<nested.path.to.value>
# ============================================================================
program: subprojects/wp4_aeroshell_optimizer/v2/src/main_files/main_v2.py
entity: aisco
project: alm-cse-scheduler-model-sweep

method: grid
metric:
  goal: maximize
  name: raw_losses/total_loss

parameters:
  general_config.model_def.model_name:
    values: ["ConcatWIREV3", "WIREV5"]

  losses_v0_config.general_info.ALM:
    values: ["True", "False"]

  losses_v0_config.general_info.CSE:
    values: ["True", "False"]

  losses_v0_config.general_info.deactivate_scheduler_mode:
    values: ["skip", "zero_weighted"]
