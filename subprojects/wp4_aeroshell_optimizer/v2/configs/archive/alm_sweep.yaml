program: subprojects/wp4_aeroshell_optimizer/v2/src/main_files/main_v1.1_one_model.py
method: bayes
metric:
  name: total_loss
  goal: minimize
parameters:
  alm.lambda_init:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.1
  alm.alpha:
    distribution: categorical
    values: [0.9, 0.95, 0.98, 0.99]
  alm.gamma:
    distribution: log_uniform_values
    min: 0.001
    max: 1.0
