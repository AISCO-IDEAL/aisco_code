program: subprojects/wp1_cfd_ai/AISCO_GAOT/GAOT3/main.py

# Base arguments for main.py
command:
  - ${env}
  - python
  - ${program}
  - -c
  - subprojects/wp1_cfd_ai/AISCO_GAOT/GAOT3/config/main_config.yaml
  - ${args}

# Optimization setup
method: bayes  # or "random" if you prefer
metric:
  name: val/loss   # adapt to your logged metric name
  goal: minimize

# Global sweep info (matches your project)
project: WP1_drag
entity: aisco
name: "wp1_gaot_optimiser_sweep"

parameters:
  # ========== OPTIMIZER / LR-RELATED ONLY ==========
  model.args.magno.projection_channels:
    distribution: int_uniform
    min: 100
    max: 500

  model.args.magno.lifting_channels:
    distribution: int_uniform
    min: 10
    max: 50
