use_pretrained: True

general_info:
  Model: "SDFNetwork"
  Model_Expl: "an SDF Network with torch Neural Network"
  Pre: "a sphere as initial shape, datatype: SDF"
  Post: "a PLY file representing the optimized aeroshell shape"

hyperparams:
  learning_rate: 0.0001
  batch_size: 4096
  num_epochs: 75
  model_capacity: 256
  num_layers: 8
  skip_connections: [4]
  weight_decay: 0.0
  activation: "relu"
  optimizer: "adam"
  scheduler_step_size: 200
  scheduler_gamma: 0.5

model_dir: "AISCO-code/subprojects/wp4_aeroshell_optimizer/data/test_models"
mesh_dir: "AISCO-code/subprojects/wp4_aeroshell_optimizer/data/test_meshes"
