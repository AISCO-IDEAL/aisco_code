general_info:
  CSE: "True"  # Cruising Speed Estimation  # USED — total_loss.py: self._use_cse
  ALM: "True"  # Augmented Lagrangian Method  # USED — total_loss.py: self._use_alm
  ALM_aggressive: "False" # capu version of ALM
  ALM_aggressive_capu: 0.25 # has constraint decreased sufficiently threshold, only used when ALM_aggressive=True. # weights.py: self.use_alm_aggressive
  alm_thresholds: [0.1, 0.1, 0.1]  # thresholds for constraint losses [bb, eikonal, smoothness], ensures ever increasing weights. only used if ALM_aggressive=True
  initial_lambda: [0.01, 0.01, 0.01]  # per-constraint initial λ [bb, eikonal, smoothness] (scalar also accepted)
  initial_mu: [1.0, 1.0, 1.0]  # per-constraint initial μ [bb, eikonal, smoothness]
  initial_nu: [1.0, 1.0, 1.0]  # per-constraint initial ν [bb, eikonal, smoothness]
  alpha: 0.99  # EMA decay factor for ν update
  gamma: 0.01  # parameter for ALM penalty update
  gamma_aggressive: 1.1  # multiplicative increase factor for μ in aggressive CAPU mode
  cse_prefactors:  # prefactors applied to objectives before feeding into CSE
    drag: 1.0
    solar: 1.0
  cse_params:  # physical constants for CSE; also picks which category is drag/solar
    drag_category: "aero"
    solar_category: "solar"
    mass: 210
    c_losses: 20
    rolling_friction_coefficient: 0.006
    max_iter: 12
    tol: 1.0e-4

# Each category block gets a `_role` metadata field: "objective", "constraint", or "aux".
# `_sign: maximize` flips the sign of an objective in manual (non-CSE) mode. Keys starting
# with `_` are metadata and are NOT loaded as losses. Constraint ordering for ALM follows
# the category order in the YAML (aero < bb < eikonal < smoothness < solar here, with
# only constraint-role blocks entering the ALM vector).
losses: # [compute: bool, weight: float, path: str]  # TotalLossV2 dynamically loads all losses with compute=1
  # NOTE: that for each loss class, only one version should have compute=True
  aero:
    _role: objective
    _sign: minimize
    null_loss_aero_v1_: [0, 0.0, "subprojects/wp4_aeroshell_optimizer/v2/src/losses/aerodynamic_loss/null_loss_aero_v1.py"]
    gaot_loss: [1, 1.0, "subprojects/wp4_aeroshell_optimizer/v2/src/losses/aerodynamic_loss/gaot_loss.py"]

  bb:
    _role: constraint
    # bb_v1: [0,100, "subprojects/wp4_aeroshell_optimizer/v2/src/losses/bb_loss/bb_v1.py"]
    # bb_v2: [0, 1000, "subprojects/wp4_aeroshell_optimizer/v2/src/losses/bb_loss/bb_v2.py"] # not working as of 2025 12 15
    null_loss_bb_v1: [0, 0.0, "subprojects/wp4_aeroshell_optimizer/v2/src/losses/bb_loss/null_loss_bb_v1.py"]
    bb_v3: [0, 1, "subprojects/wp4_aeroshell_optimizer/v2/src/losses/bb_loss/bb_v3.py"] # new version with random assembly_id for more variety y
    bb_v4: [0, 10, "subprojects/wp4_aeroshell_optimizer/v2/src/losses/bb_loss/bb_v4.py"] # assembler version4 with ground clearance validation
    bb_v4_2: [0, 1, "subprojects/wp4_aeroshell_optimizer/v2/src/losses/bb_loss/bb_v4_2.py"] # v4.2 with fast mesh-backed SDF from CadQuery tessellation (tesselation = "Zerlegung")
    bb_v4_3: [0, 10, "subprojects/wp4_aeroshell_optimizer/v2/src/losses/bb_loss/bb_v4_3.py"] # v4.3 with improved ALM and CSE support
    bb_v4_4: [1, 10, "subprojects/wp4_aeroshell_optimizer/v2/src/losses/bb_loss/bb_v4_4.py"] # v4.4 surface-sampled BB constraints on WP2 inner/outer zero-level surfaces
    silvretta_bb_v0: [0, 1.0, "subprojects/wp4_aeroshell_optimizer/v2/src/losses/bb_loss/silvretta_bb_v0.py"] # version provided by Silvretta, not working well as of 2025 12 15

  eikonal:
    _role: constraint
    eikonal_v0: [1, 100.0, "subprojects/wp4_aeroshell_optimizer/v2/src/losses/eikonal_loss/eikonal_v0.py"]

  smoothness:
    _role: constraint
    smoothness_v0: [1, 0.0, "subprojects/wp4_aeroshell_optimizer/v2/src/losses/smoothness_loss/smoothness_v0.py"]

  # surface_area:
  #   _role: aux
  #   surface_loss_v0: [1, 1.0, "subprojects/wp4_aeroshell_optimizer/v2/src/losses/surface_area_loss/surface_loss_v0.py"]

  solar:
    _role: objective
    _sign: maximize
    solar_v3B_2: [1, 1.0, "subprojects/wp4_aeroshell_optimizer/v2/src/losses/solar_loss/solar_v3B_2.py"]
    solar_v4: [0, 50.0, "subprojects/wp4_aeroshell_optimizer/v2/src/losses/solar_loss/solar_v4.py"]
    solar_v5: [0, 50.0, "subprojects/wp4_aeroshell_optimizer/v2/src/losses/solar_loss/solar_v5.py"]
    solar_v6: [0, 1.0, "subprojects/wp4_aeroshell_optimizer/v2/src/losses/solar_loss/solar_v6.py"]
    solar_v7: [0, 1.0, "subprojects/wp4_aeroshell_optimizer/v2/src/losses/solar_loss/solar_v7.py"]
    null_loss_solar_v1: [0, 0.0, "subprojects/wp4_aeroshell_optimizer/v2/src/losses/solar_loss/null_loss_solar_v1.py"]

  diversity:
    _role: diversity
    field_diversity_v0: [1, 0.1, "subprojects/wp4_aeroshell_optimizer/v2/src/losses/diversity_loss/field_diversity_v0.py"]

  total:
    total_loss: [1, 1.0, "subprojects/wp4_aeroshell_optimizer/v2/src/losses/total_loss.py"]  # SKIPPED — total_loss.py skips category "total" explicitly
    artifact_every: 10  # save model+mesh checkpoint artifact to wandb every N epochs

get_points_params: # used in eikonal and smoothness loss  #  parent_loss.py: self.losses_config["get_points_params"]["num_points"] and ["bbox_size"]
  num_points: 1000  #  parent_loss.py
  bbox_size: 10.0  #  parent_loss.py


bb_config:  # bb_v3.py: self.losses_config["bb_config"]
  pointgrid_params:  #  bb_v3.py: self.__config["pointgrid_params"] -> passed to SDFfromCadQuery
    dx: 250  #
    dy: 250  #
    dz: 250  #
    rand: 400  #
  assembly_id: 2 # 1 for the standard one  # rendering modes only (assembly_mode.py, mesh_assembly_mode_v2.py), not bb_v3.py (which randomises 1-52)
  render_until_blue: "False"
  sdf_device: cuda  # mesh-backed BB SDF compute device
  # v4.2 specific:
  sdf_chunk_size: 4096  # query chunk size for mesh_sdf (higher can be faster but uses more memory)
  tessellation_tolerance: 2.0  # CadQuery tessellation quality for bb_v4_2 (higher is faster, lower detail)
  tessellation_angular_tolerance: 0.4  # CadQuery tessellation angular quality for bb_v4_2
  # v4.4 surface-sampling specific:
  surface_sampling:
    target_point_count: 20000  # total number of zero-level surface points sampled per setup
    inner_fraction: 0.5  # fraction of points allocated to inner surface(s); rest goes to outer
    min_points_per_inner_mesh: 256  # minimum points for each inner solid to avoid undersampling small parts
  # v4.3 analytic specific:
  analytic_options:
    penalty: "softplus"  # "relu" (default) or "softplus"
    softplus_beta: 10.0  # only used when penalty="softplus"
    inner_margin: 0.0  # tighten upper bound: sdf_model <= sdf_inner - inner_margin
    outer_margin: 0.0  # tighten lower bound: sdf_outer + outer_margin <= sdf_model
  # silvretta_v0 specific:
  inner_ply_location: "/cluster/work/fuge/AISCO/wp4_aeroshell_optimiser/bb_loss_ply_data/inner.ply"
  outer_ply_location: "/cluster/work/fuge/AISCO/wp4_aeroshell_optimiser/bb_loss_ply_data/outer.ply"

cfd:
  model_id: 63435761      # Options: Any Euler-run-id that trained a Gaot-Model in Version 2 or a key for Version 1
  version: 2              # Options: 1, 2         Recomendation: 2
  visualisations: false   # Options: true, false  Recomendation: false
  v_inf: 25.0             # Default: 25.0         Recomendation: Has to Match the Value used during respective GAOT-Training
  rho: 1.225              # Default: 1.1225       Recomendation: Has to Match the Value used during respective GAOT-Training
  mesh_resolution: 50000  # Default: 50000        Recomendation: Has to Match the Value used during respective GAOT-Training
  gradient_max: 0.1       # Options: any float    Recomendation: 0.1
