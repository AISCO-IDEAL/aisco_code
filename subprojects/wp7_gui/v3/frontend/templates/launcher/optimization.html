{% extends "base.html" %}
{% block hint %}Live run — launch and monitor the optimisation.{% endblock %}

{% block content %}
<div class="section-grid" style="grid-template-rows: auto 1fr; height: 100%;">

  <!-- Controls -->
  <div class="dark-card toolbar">
    <button class="btn" id="btnRun">Run with Overrides</button>
    <button class="btn secondary" id="btnStop" disabled>Stop</button>
    <div style="flex:1; min-width:120px;">
      <div class="progress-bar-wrap" id="progressWrap">
        <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
      </div>
      <div style="font-size:0.76rem; color:var(--theme-muted); font-weight:500; margin-top:3px;" id="progressLabel">Idle
      </div>
    </div>
    <a href="/launcher/output?pipeline={{ pipeline }}" class="btn">Output →</a>
  </div>

  <!-- Stats panel and log console -->
  <div style="display:grid; grid-template-columns: 280px 1fr; gap:12px; min-height:0;">

    <!-- Live Stats Panel -->
    <div class="dark-card" style="min-height:0; display:grid; grid-template-rows: auto 1fr; gap:10px; padding:12px;">
      <div style="font-size:0.82rem; color:var(--theme-warning-text); font-weight:600;">Live Metrics</div>
      <div style="display:flex; flex-direction:column; gap:12px; overflow-y:auto;">

        <!-- Drag -->
        <div style="border-left:2px solid var(--theme-metric-drag-border); padding-left:8px;">
          <div
            style="font-size:0.7rem; color:var(--theme-metric-drag-text); text-transform:uppercase; letter-spacing:0.5px;">
            Aerodynamic Drag
          </div>
          <div style="font-size:1.2rem; font-weight:600; color:var(--theme-white); margin-top:2px;" id="dragValue">—
          </div>
          <div style="font-size:0.68rem; color:var(--theme-metric-unit-text); margin-top:2px;">N (Newtons)</div>
        </div>

        <!-- Solar -->
        <div style="border-left:2px solid var(--theme-metric-solar-border); padding-left:8px;">
          <div
            style="font-size:0.7rem; color:var(--theme-metric-solar-text); text-transform:uppercase; letter-spacing:0.5px;">
            Solar Output
          </div>
          <div style="font-size:1.2rem; font-weight:600; color:var(--theme-white); margin-top:2px;" id="solarValue">—
          </div>
          <div style="font-size:0.68rem; color:var(--theme-metric-unit-text); margin-top:2px;">W (Watts)</div>
        </div>

        <!-- Cruising Speed -->
        <div style="border-left:2px solid var(--theme-metric-speed-border); padding-left:8px;">
          <div
            style="font-size:0.7rem; color:var(--theme-metric-speed-text); text-transform:uppercase; letter-spacing:0.5px;">
            Cruising Speed
          </div>
          <div style="font-size:1.2rem; font-weight:600; color:var(--theme-white); margin-top:2px;" id="speedValue">—
          </div>
          <div style="font-size:0.68rem; color:var(--theme-metric-unit-text); margin-top:2px;">m/s</div>
        </div>

      </div>
    </div>

    <!-- Log console -->
    <div class="dark-card" style="min-height:0; display:grid; grid-template-rows: auto 1fr; gap:6px;">
      <div
        style="display:flex; align-items:center; gap:10px; font-size:0.82rem; color:var(--theme-warning-text); font-weight:600;">
        <span>Run Log</span>
      </div>
      <div class="console" id="logConsole" style="min-height:0;"></div>
    </div>

  </div>
</div>

<script>
  const API = "/launcher/api";
  let logEventSource = null;
  let _runCompleted = false;   // true once "done" received — suppresses auto-reconnect
  let _reconnectTimer = null;

  const btnRun = document.getElementById("btnRun");
  const btnStop = document.getElementById("btnStop");
  const progressFill = document.getElementById("progressFill");
  const progressLabel = document.getElementById("progressLabel");
  const logConsole = document.getElementById("logConsole");

  // ---------- SSE log stream ----------
  function startSSELog() {
    if (logEventSource) { logEventSource.close(); logEventSource = null; }
    if (_reconnectTimer) { clearTimeout(_reconnectTimer); _reconnectTimer = null; }
    logConsole.textContent = "";
    _runCompleted = false;
    logEventSource = new EventSource(`${API}/run/stream/logs`);
    logEventSource.addEventListener("log", e => {
      const { line } = JSON.parse(e.data);
      logConsole.textContent += line + "\n";
      logConsole.scrollTop = logConsole.scrollHeight;
    });
    logEventSource.addEventListener("epoch", e => {
      const { epoch, total, drag_value, solar_power_w, cruising_speed_ms } = JSON.parse(e.data);
      const pct = total > 0 ? Math.min(100, ((epoch + 1) / total) * 100) : 0;
      progressFill.style.width = pct + "%";
      progressLabel.textContent = `Epoch ${epoch + 1} / ${total} (${pct.toFixed(1)}%)`;

      // Update live metrics
      const dragEl = document.getElementById("dragValue");
      const solarEl = document.getElementById("solarValue");
      const speedEl = document.getElementById("speedValue");

      if (drag_value !== null && drag_value !== undefined) {
        dragEl.textContent = typeof drag_value === 'number' ? drag_value.toFixed(3) : "—";
      }
      if (solar_power_w !== null && solar_power_w !== undefined) {
        solarEl.textContent = typeof solar_power_w === 'number' ? solar_power_w.toFixed(1) : "—";
      }
      if (cruising_speed_ms !== null && cruising_speed_ms !== undefined) {
        speedEl.textContent = typeof cruising_speed_ms === 'number' ? cruising_speed_ms.toFixed(2) : "—";
      }
    });
    logEventSource.addEventListener("done", e => {
      const { return_code } = JSON.parse(e.data);
      progressLabel.textContent = return_code === 0 ? "Completed." : `Finished (code ${return_code})`;
      progressFill.style.width = "100%";
      logEventSource.close(); logEventSource = null;
      btnRun.disabled = false; btnStop.disabled = true;
      _runCompleted = true;
    });
    // On error: don't close — the browser will auto-reconnect (SSE spec).
    // After a grace period, verify the run is still live; if it finished
    // while we were disconnected, update the UI accordingly.
    logEventSource.onerror = () => {
      if (_reconnectTimer) clearTimeout(_reconnectTimer);
      _reconnectTimer = setTimeout(() => {
        _reconnectTimer = null;
        if (_runCompleted) return;
        fetch(`${API}/run/state`).then(r => r.json()).then(state => {
          if (!state.running && state.return_code !== null) {
            // Run ended while we were away — close cleanly
            if (logEventSource) { logEventSource.close(); logEventSource = null; }
            progressLabel.textContent = state.return_code === 0 ? "Completed." : `Finished (code ${state.return_code})`;
            progressFill.style.width = "100%";
            btnRun.disabled = false; btnStop.disabled = true;
            _runCompleted = true;
          }
        }).catch(() => {});
      }, 5000);
    };
  }

  // ---------- Instant progress restore from log ----------
  async function _restoreProgressBar() {
    try {
      const prog = await fetch(`${API}/run/progress`).then(r => r.json());
      if (prog.completed) {
        progressFill.style.width = "100%";
        progressLabel.textContent = "Completed.";
      } else if (prog.current_epoch >= 0) {
        progressFill.style.width = prog.progress_percent + "%";
        progressLabel.textContent = `Epoch ${prog.current_epoch + 1} / ${prog.num_epochs} (${prog.progress_percent.toFixed(1)}%) — reconnecting…`;
      }
    } catch (_) {}
  }

  // ---------- Auto-reconnect when tab/window regains focus ----------
  function _reconnectIfNeeded() {
    if (_runCompleted) return;
    // Already connected and healthy
    if (logEventSource && logEventSource.readyState !== EventSource.CLOSED) return;
    fetch(`${API}/run/state`).then(r => r.json()).then(async state => {
      if (state.running) {
        btnRun.disabled = true; btnStop.disabled = false;
        await _restoreProgressBar();
        startSSELog();
      } else if (state.log_path && !_runCompleted) {
        // Run finished while we were away — replay log once to show final state
        await _restoreProgressBar();
        startSSELog();
      }
    }).catch(() => {});
  }

  document.addEventListener("visibilitychange", () => { if (!document.hidden) _reconnectIfNeeded(); });
  window.addEventListener("focus", _reconnectIfNeeded);

  btnRun.addEventListener("click", async () => {
    const cfgFolder = localStorage.getItem("aiscoOverrideFolderV3") || "";
    if (!cfgFolder) {
      progressLabel.textContent = "No config override session — go to Config Overrides first.";
      return;
    }
    btnRun.disabled = true; btnStop.disabled = false;
    progressFill.style.width = "0%"; progressLabel.textContent = "Starting…";
    try {
      const r = await fetch(`${API}/run/start`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ cfg_folder: cfgFolder }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.detail?.message || r.status);
      startSSELog();
    } catch (err) {
      progressLabel.textContent = "Error: " + err.message;
      btnRun.disabled = false; btnStop.disabled = true;
    }
  });

  btnStop.addEventListener("click", async () => {
    btnStop.disabled = true;
    await fetch(`${API}/run/stop`, { method: "POST" });
    if (logEventSource) { logEventSource.close(); logEventSource = null; }
    progressLabel.textContent = "Stopped.";
    btnRun.disabled = false;
  });

  // On page load: reconnect SSE for an active run, or replay log for a recently completed one
  (async () => {
    const state = await (await fetch(`${API}/run/state`)).json();
    const hasLog = !!state.log_path;
    if (state.running || hasLog) {
      if (state.running) { btnRun.disabled = true; btnStop.disabled = false; }
      // Restore last-known metrics from CSV before first SSE epoch fires
      try {
        const [m, prog] = await Promise.all([
          fetch(`${API}/run/metrics/latest`).then(r => r.json()),
          fetch(`${API}/run/progress`).then(r => r.json()),
        ]);
        if (m.found) {
          const dragEl = document.getElementById("dragValue");
          const solarEl = document.getElementById("solarValue");
          const speedEl = document.getElementById("speedValue");
          if (m.drag_value !== null && m.drag_value !== undefined) dragEl.textContent = m.drag_value.toFixed(3);
          if (m.solar_power_w !== null && m.solar_power_w !== undefined) solarEl.textContent = m.solar_power_w.toFixed(1);
          if (m.cruising_speed_ms !== null && m.cruising_speed_ms !== undefined) speedEl.textContent = m.cruising_speed_ms.toFixed(2);
        }
        // Progress bar from log-based endpoint — no CSV dependency, always current
        if (prog.completed) {
          progressFill.style.width = "100%";
          progressLabel.textContent = "Completed.";
        } else if (prog.current_epoch >= 0) {
          progressFill.style.width = prog.progress_percent + "%";
          progressLabel.textContent = `Epoch ${prog.current_epoch + 1} / ${prog.num_epochs} (${prog.progress_percent.toFixed(1)}%) — reconnecting…`;
        }
      } catch (_) { /* non-fatal: SSE will fill values on next epoch */ }
      startSSELog();
    }
  })();

  // Show session info in toolbar
  (function updateSessionBadge() {
    const cfgFolder = localStorage.getItem("aiscoOverrideFolderV3") || "";
    const toolbar = document.querySelector(".toolbar");
    const badge = document.createElement("div");
    badge.style.cssText = "font-size:0.82rem;padding:4px 10px;border-radius:4px;white-space:nowrap;";
    if (cfgFolder) {
      badge.style.color = "var(--theme-ok-text)";
      badge.style.background = "var(--theme-ok-bg)";
      badge.textContent = "Session: " + cfgFolder.split("/").pop();
    } else {
      badge.style.color = "var(--theme-warning-text)";
      badge.style.background = "var(--theme-warning-bg)";
      badge.textContent = "No config override session \u2014 go to Config Overrides to set one.";
      btnRun.disabled = true;
    }
    toolbar.insertBefore(badge, toolbar.querySelector("a"));
  })();
</script>
{% endblock %}
