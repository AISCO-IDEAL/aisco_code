# vis_config.yaml
# Previous name: viz_config.yaml (was in v2/src/sampling_visualization/)
# Moved to v2/configs/ as part of Plan 041 — Milestone 2.
# Shared by ply_to_gif.py, points_SDFmesh_to_ply.py, central_vis_manager_v2.py,
# explore_latent_space.py, and central_vis_manager.py (archived).

# --- Corporate identity ---
# not used in code, serves as reference (corporate identity of aCe)
corporate_identity:
  font_family: "Questrial"
  colors:
    background: "#23283E"
    title_primary: "#FFFFFF"
    text_standard: "#FFFFFF"
    title_secondary: "#FF504D"
    text_highlight: "#FF504D"
    graphic_lines_thin: "#FF504D"
    graphic_surface_large: "#C33531"
    text_box: "#D2E0F2"

# --- WP7 GUI theme (global, editable) ---
gui_theme:
