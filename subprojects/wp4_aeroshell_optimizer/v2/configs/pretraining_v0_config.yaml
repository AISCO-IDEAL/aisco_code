#Here put the config for model pretraining
pretraining_shape: "sphere" # "sphere" or "cube"  #  pretraining_v1_1.py: config.get("pretraining_shape", "sphere")

pretraining:
  use_pretrained: True # True or False possible  # NOT USED — never read by any code (main checks fetch_pretrained_model result instead)
  force_pretraining: False  # USED — main_v1_1_one_model.py: pretraining_config.get("pretraining", {}).get("force_pretraining", False)
  pretraining_model_path: ""  # USED — main_v1_1_one_model.py: pretraining_config.get("pretraining", {}).get("pretraining_model_path", "path/to/pretrained/model.pth")  # note: pretraining_v0_model.pth is the basic MLP sphere or ellipsoid
  local_pretraining_model_path: ""
  username: ${USER} # for windows users: %USERNAME%  # NOT USED — never read by any code in the optimisation loop

model: "WIREV2" #Class name of model  # pretraining_v1_1.py: config["model"] (only in dynamic_model_loading, not used when model is passed in)
model_filename: "WIRE_v2" #Name of file where model is defined  # pretraining_v1_1.py: config["model_filename"] (only in dynamic_model_loading, not used when model is passed in)

training_loop:
  epochs: 2000  # pretraining_v1_1.py: config["training_loop"]["epochs"]
  learning_rate: 0.0005  # pretraining_v1_1.py: config["training_loop"]["learning_rate"]
  random_batch_size: 2048  # pretraining_v1_1.py: config["training_loop"]["random_batch_size"]
  print_interval: 25  # pretraining_v1_1.py: config["training_loop"]["print_interval"]
