training_loop:
  epochs: 500
  learning_rate: 0.0005
  batch_size_per_shape: 8192 #8192
  logging_interval: 25 # wandb stats logging intervall (displayed in terminal as well)
  surface_resample_cadence: 0   # 0 = static (DeepSDF-style, default)
                                # N = refresh near-surface cache every N epochs

  # --- M2: Dual-band near-surface sampling ---
  # near_surface_fraction + domain_fraction must sum to ≤ 1.0.
  # Remainder (1 - near_surface_fraction - domain_fraction) goes to exact surface pts.
  # If near_surface_wide_sigma is absent (null), single-band mode is used (backward-compat).
  near_surface_fraction: 0.30     # fraction of batch for near-surface pts (split between bands)
  domain_fraction: 0.50           # fraction of batch for outer_prism uniform pts (eikonal)
  near_surface_tight_sigma: 0.005 # tight band σ = factor × bbox_extent_mm  (≈25mm at car scale)
  near_surface_wide_sigma: null   # wide band σ = factor × bbox_extent_mm   (≈250mm at car scale)
  interior_boost_fraction: 0.20   # fraction of pts that must be inside of the target shape

  bbox_scale_factor: 1.0  # Multiply outer_prism bounds by this for domain sampling (scales training distribution).

output:
  # Canonical base directory for all latent pretraining checkpoints.
  # Plan 031 / M3: checkpoint path is now fully computed as:
  #   <base_dir>/<epochs:06d>_<ModelClass>_<config_hash>/pretrained_latent_<config_hash>.pth
  base_dir: "/cluster/work/fuge/AISCO/pretraining/latent_pretraining"


  # Cache key includes ply_path stem, ply_scale, sigma params, n_surf → hash-tagged .pt files.
  # Useful for static cache (surface_resample_cadence: 0): GT SDF is computed once and reused.
  # Set to an absolute path to enable; null = disabled (always build fresh, never write).
  sdf_cache_dir: "/cluster/work/fuge/AISCO/pretraining/latent_pretraining/01_sdf_cache"  # precomputed SDFs from target PLY shapes


  sampling_vis: true # used in main loop, use flags in standalone pretraining
  make_gif: true     # used in main loop, use flags in standalone pretraining
  visualisation_directory: "sampling_vis" # directory name withhin directory of the current hash # only used by standalone pretraining

  vis_cadence: 10 # at what interval to visualize the sampling
  vis_show_domain_pts: true   # show domain pts (grey) used for L1-all loss (default: true)
  vis_show_target_pts: "pts"  # "pts" = surface cache pts in green | "mesh" = target triangle mesh in green
  # model points are always displayed as red points

  mesh_resolution: 128  # grid resolution for final per-slot mesh extraction after training
