population_size: 6

# Diversity loss sampling config
# Points are used for cheap WIRE-only forward passes (no CFD/raytracing).
# With 20 GB VRAM this can be set high; 2048 is a conservative default.
diversity_num_points: 4096
diversity_bbox_size: 10.0        # [meters^3]: matches get_points_params.bbox_size in losses_v0_config.yaml
diversity_norm_order: 2          # p for L^p field distance
diversity_neighbor_agg_fn: "min" # 'min' = maximize nearest-neighbour distance (GINN paper Eq. 26)

# Latent population behaviour
force_z0_to_origin: true         # true keeps first latent vector fixed at origin

# Latent resampling behaviour
z_resample_cadence: 1            # 0 disables resampling, N>0 resamples every N epochs
