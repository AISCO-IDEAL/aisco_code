program: subprojects/wp4_aeroshell_optimizer/v2/src/main_files/pretraining_v4.py
entity: aisco
project: WIRE-Fitting

method: grid
metric:
  goal: minimize
  name: pretraining/total_loss

parameters:
  pretraining_v4_config.model_name:
    value: "WIREV2"

  # WIRE v2 — uniform Gabor params (all neurons share the same omega / scale)
  models/WIRE_v2.hidden_features:
    values: [64, 128, 256]
  models/WIRE_v2.hidden_layers:
    values: [3, 4, 6]
  models/WIRE_v2.first_omega_0:
    values: [0.5, 0.8, 1.5]
  models/WIRE_v2.hidden_omega_0:
    values: [0.5, 0.8, 1.5]

  # Training
  pretraining_v4_config.training_loop.learning_rate:
    values: [0.0001, 0.0005, 0.001]
  pretraining_v4_config.training_loop.eikonal_weight:
    values: [0.05, 0.1, 0.2]
