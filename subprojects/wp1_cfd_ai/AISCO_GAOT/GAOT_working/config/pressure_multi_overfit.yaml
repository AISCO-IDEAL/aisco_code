# ============================================================================
# OVERFIT SANITY CHECK CONFIG
# ============================================================================
# Purpose: Train on 10 samples and try to perfectly memorise them.
#
# Expected behaviour:
#   - Training loss should drop to near-zero (< 0.01) within 100-200 epochs.
#   - If it does NOT, the architecture / gradient flow is fundamentally broken.
#
# Usage:
#   python main.py -c config/pressure_multi_overfit.yaml
# ============================================================================

setup:
    wandb_run_name: "overfit_sanity__RUN_ID_"
    seed: 42
    device: "cuda:0"
    dtype: "torch.float32"
    trainer_name: "static3d_multi"
    train: true
    test: true
    ckpt: false
    use_variance_test: false
    distributed: true

    # --- wandb settings ---
    wandb: true
    wandb_project: "WP1_drag"
    wandb_entity: aisco
    wandb_group: overfit_sanity
    wandb_mode: online
    wandb_tags: ["overfit", "sanity_check", "multi_head"]
    wandb_watch_model: false

    test_during_training: false

model:
    name: "gaot_3d_attention"
    use_conditional_norm: false
    args:
        latent_tokens: [32,32,16]
        magno:
            use_gno: true
            gno_coord_dim: 3
            neighbor_strategy: "bidirectional"
            projection_channels: 256
            in_gno_channel_mlp_hidden_layers: [64,64,64]
            out_gno_channel_mlp_hidden_layers: [64,64]
            lifting_channels: 32
            gno_radius: 0.033
            gno_use_torch_cluster: true
            attention_type: "cosine"
            use_geoembed: [true, false]
            embedding_method: "statistical"
            encoder_feature_attr: ["pos","c"]
            mlp_type: "linear"
            precompute_edges: false
            asynchronous_graph_building: true
        transformer:
            patch_size: 2
            hidden_size: 256
            use_attn_norm: true
            use_ffn_norm: true
            norm_eps: 1e-06
            num_layers: 10
            positional_embedding: "rope"
            use_long_range_skip: true
            attn_config:
                hidden_size: 256
                num_heads: 8
                num_kv_heads: 8
                use_conditional_norm: false
                cond_norm_hidden_size: 4
            ffn_config:
                hidden_size: 1024
                use_conditional_norm: false
                cond_norm_hidden_size: 4

dataset:
    name: "drivaernet_drag"
    metaname: "incompressible_fluids/drivaernet_pressure"
    base_path: "/cluster/work/fuge/AISCO/wp1_cfd_ai/processed_combined_multi"
    processed_folder: "overfit20"
    force_recompute_stats: true
    rand_dataset: false
    # 15 train (8 DrivAer/cd + 7 Euler/force) + 5 val (mixed) = 20 total
    # order_overfit20.txt: interleaved run_1, euler_run_1, run_2, ... 
    train_size: 15
    val_size: 5
    test_size: 20
    batch_size: 2
    num_workers: 2
    shuffle: false
    metric_suite: "general"
    update_pt_files_with_edges: false

optimizer:
    name: "adamw"
    args:
        lr: 1e-3
        weight_decay: 0.0
        epoch: 150
        loss_scale: 1.0
        eval_every_eps: 1
        scheduler: "cos"
        scheduler_T_max: 500
        scheduler_eta_min: 1e-5
        save_every_epochs: 0

path:
    ckpt_path: "/cluster/work/fuge/AISCO/wp1_cfd_ai/drivaer_drag_results/ckpt/overfit_model__RUN_ID_.pt"
    loss_path: "/cluster/work/fuge/AISCO/wp1_cfd_ai/drivaer_drag_results/loss/overfit_loss__RUN_ID_.png"
    result_path: "/cluster/work/fuge/AISCO/wp1_cfd_ai/drivaer_drag_results/results/overfit_result__RUN_ID_.png"
    database_path: "/cluster/work/fuge/AISCO/wp1_cfd_ai/drivaer_drag_results/database/overfit_metrics.csv"
