{% extends "base.html" %}
{% block hint %}Live run — launch and monitor the optimisation.{% endblock %}

{% block content %}
<div class="section-grid" style="grid-template-rows: auto 1fr; height: 100%;">

  <!-- Controls -->
  <div class="dark-card toolbar">
    <button class="btn" id="btnRun">Launch Run</button>
    <button class="btn secondary" id="btnStop" disabled>Stop</button>
    <div style="flex:1; min-width:120px;">
      <div class="progress-bar-wrap" id="progressWrap">
        <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
      </div>
      <div style="font-size:0.78rem; color:var(--muted); margin-top:3px;" id="progressLabel">Idle</div>
    </div>
    <div class="console" style="width:220px; max-height:48px; font-size:0.75rem; padding:4px 8px; overflow:hidden;"
      id="miniLog">—</div>
    <a href="/launcher/output?pipeline={{ pipeline }}" class="btn">Output →</a>
  </div>

  <!-- Log console -->
  <div class="dark-card" style="min-height:0; display:grid; grid-template-rows: auto 1fr; gap:6px;">
    <div style="font-size:0.82rem; color:#f8d9d9; font-weight:600;">Run Log</div>
    <div class="console" id="logConsole" style="min-height:0;"></div>
  </div>
</div>

<script>
  const API = "/launcher/api";
  let logEventSource = null;

  const btnRun = document.getElementById("btnRun");
  const btnStop = document.getElementById("btnStop");
  const progressFill = document.getElementById("progressFill");
  const progressLabel = document.getElementById("progressLabel");
  const miniLog = document.getElementById("miniLog");
  const logConsole = document.getElementById("logConsole");

  // ---------- SSE log stream ----------
  function startSSELog() {
    if (logEventSource) { logEventSource.close(); }
    logConsole.textContent = "";
    logEventSource = new EventSource(`${API}/run/stream/logs`);
    logEventSource.addEventListener("log", e => {
      const { line } = JSON.parse(e.data);
      logConsole.textContent += line + "\n";
      logConsole.scrollTop = logConsole.scrollHeight;
      miniLog.textContent = line.slice(-60);
    });
    logEventSource.addEventListener("epoch", e => {
      const { epoch, total } = JSON.parse(e.data);
      const pct = total > 0 ? Math.min(100, ((epoch + 1) / total) * 100) : 0;
      progressFill.style.width = pct + "%";
      progressLabel.textContent = `Epoch ${epoch + 1} / ${total} (${pct.toFixed(1)}%)`;
    });
    logEventSource.addEventListener("done", e => {
      const { return_code } = JSON.parse(e.data);
      progressLabel.textContent = return_code === 0 ? "Completed." : `Finished (code ${return_code})`;
      progressFill.style.width = "100%";
      logEventSource.close(); logEventSource = null;
      btnRun.disabled = false; btnStop.disabled = true;
    });
    logEventSource.onerror = () => { logEventSource.close(); logEventSource = null; btnRun.disabled = false; btnStop.disabled = true; };
  }

  btnRun.addEventListener("click", async () => {
    btnRun.disabled = true; btnStop.disabled = false;
    progressFill.style.width = "0%"; progressLabel.textContent = "Starting…";
    try {
      const r = await fetch(`${API}/run/start`, { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
      const d = await r.json();
      if (!r.ok) throw new Error(d.detail?.message || r.status);
      miniLog.textContent = `PID ${d.pid}`;
      startSSELog();
    } catch (err) {
      progressLabel.textContent = "Error: " + err.message;
      btnRun.disabled = false; btnStop.disabled = true;
    }
  });

  btnStop.addEventListener("click", async () => {
    btnStop.disabled = true;
    await fetch(`${API}/run/stop`, { method: "POST" });
    if (logEventSource) { logEventSource.close(); logEventSource = null; }
    progressLabel.textContent = "Stopped.";
    btnRun.disabled = false;
  });

  // Reconnect SSE if a run is already live when the page opens
  (async () => {
    const state = await (await fetch(`${API}/run/state`)).json();
    if (state.running) { btnRun.disabled = true; btnStop.disabled = false; startSSELog(); }
  })();
</script>
{% endblock %}
