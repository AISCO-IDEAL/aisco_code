[build-system]

requires = ["setuptools>=74.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "AISCO_code"
version = "0.1.0"
description = "Monorepo for all AISCO code"
authors = [
    {name = "Kolja Diehl", email = "kdiehl@ethz.ch"}
]
readme = "README.md"
requires-python = "==3.11.6"

dependencies = [
  "gymnasium >= 1.0.0",
  "pandas >= 2.2.3",
  "matplotlib >= 3.9.3",
  "numpy>=2.0.0",
  "ruff>=0.1.0",
  "pre-commit>=3.0.0",
  "mypy>=1.19.1",
  "torch==2.4.0",
  "wandb[media] >= 0.23.1",
  "types-paramiko",
  "types-pytz",
  "types-requests",
  "types-PyYAML"
]

[project.optional-dependencies]
wp1_cfd_ai = [

]

wp2_assembler =[
  "cadquery >= 2.6.0",
  "ocp_vscode >= 2.9.0",
  "scipy >= 1.16.0",
  "types-PyYAML >= 6.0.12",  # Type stubs for PyYAML [vdiekmann]
  "pybullet" # For speed hump simulations [fsanche]
]

wp3_solar_estimator = [
  "PyMCubes == 0.1.6",
  "astral >= 3.2",
  "pytz",
]

wp4_aeroshell_optimizer = [
  "plotly==5.22.0",
  "scikit-image>=0.0.0",
  "torch_geometric==2.7.0",
  # "torchvision", # changed by eschaerer from torchvision==0.19.1, because it requires torch==2.4.1 ## also
  "trimesh==4.8.3",
  "mesh2sdf", #From https://github.com/wang-ps/mesh2sdf?tab=readme-ov-file
  "pyrender>=0.1.45",
  "PyOpenGL>=3.1.0",
  "pyvista>=0.40.0",
  "imageio>=2.37.2",
  "Pillow",
  "types-Pillow",
]

wp7_gui = [
  "PyQt6 == 6.10.0",
  "pyvista == 0.46.4",
  "pyvistaqt == 0.11.3",
]

testing = [
  "pytest >= 9.0.1",
  "pytest-mock"
  ]

all = [
  "AISCO_code[wp1_cfd_ai,wp2_assembler,wp3_solar_estimator,wp4_aeroshell_optimizer,wp7_gui,testing]"
]

#make a all command
[tool.setuptools.packages.find]
where = ["."]
include = ["subprojects*"]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "**/archive/**",
    "**/subprojects/fixed_renderer/**",
    "**/visuals/testing.py",
    "**/blendednet/**",      # eschaerer: Tim's sinusoidal activation function model (just inspiration, not actually used in our code)
]


# Same as Black.
line-length = 130

# Assume Python 3.11
target-version = "py311"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = [
    "E4",   # pycodestyle errors
    "E7",   # pycodestyle errors
    "E9",   # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    # "T20",  # flake8-print - disabled for example scripts
    "SIM",  # flake8-simplify
    "ARG",  # flake8-unused-arguments
    #"PTH",  # flake8-use-pathlib Enforces Path over os usage for e.g. filesaving, shouldn't matter too much for us
    "ERA",  # eradicate
    "PD",   # pandas-vet
    "PGH",  # pygrep-hooks
    "PL",   # pylint
    "TRY",  # tryceratops
    "FLY",  # flynt
    "NPY",  # numpy
    "AIR",  # airflow
    "PERF", # perflint
    "FURB", # refurb
    "LOG",  # flake8-logging
    "RUF",  # Ruff-specific rules

]

ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "W191",  # indentation contains tabs
    "D100",  # Missing docstring in public module
    "D101",  # Missing docstring in public class
    "D102",  # Missing docstring in public method
    "D103",  # Missing docstring in public function
    "D104",  # Missing docstring in public package
    "D105",  # Missing docstring in magic method
    "D107",  # Missing docstring in __init__
    "N999",  # ignoring PEP8 convention to enable us to call our project AISCO_code instead of aisco_code
    "PLR0913", # too many arguments is bs convention for us
    "TRY003", # would block long messages in e.g. ValueError("messageXYZ") debugging warnings
    "PLR2004", # triggers on if version == 2
    "N806", # in ML uppercase variables are common
    "N803", # invalid argument name
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
# Add "F401" (unused import) to the list of rules Ruff should NOT fix automatically.
unfixable = ["F401", "PLR0911", "PLR0913", "N806"]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 8
max-statements = 53

[tool.ruff.lint.per-file-ignores]
# Tests can use magic values, assertions, and relative imports
"tests/**/*" = ["PLR2004", "S101", "TID252"]
# Allow print statements in scripts
"scripts/**/*" = ["T20"]
# Allow unused imports in init files
"**/__init__.py" = ["F401"]

[tool.mypy]

python_version = "3.11"
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
files = ["subprojects/"]

exclude = [
  "^build/",
  "^docs/",
  ".*fixed_renderer/.*", # <-- eschaerer: Fixed regex to catch it inside subprojects
  ".*/archive/.*",       # <-- eschaerer: Fixed regex typo
  ".*/blendednet/.*",     # <-- eschaerer: Tim's sinusoidal activation function model (just inspiration)
  'tests/',
]

[[tool.mypy.overrides]]
# Use a single string with commas for multiple modules
module = [
  "kaolin.*",
  "cadquery.*",
  "wandb.*",
  "pyvista.*",
  "*.blendednet.*",  # eschaerer
  "blendednet.*"     # eschaerer
]


]
ignore_missing_imports = true
ignore_errors = true
follow_imports = "skip"
