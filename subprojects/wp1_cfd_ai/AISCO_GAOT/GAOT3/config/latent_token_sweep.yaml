      - [64,64,16]
      - [64,64,32]
      #- [64,64,64]

      # 64, 32, ???
      #- [64,32,8]
      #- [64,32,16]
      #- [64,32,32]

      # 64, 16, ???
      #- [64,16,8]
      #- [64,16,16]

      # 128, 128, ???
      #- [128,128,8]
      #- [128,128,16]
      #- [128,128,32]
      #- [128,128,64]
      #- [128,128,128]

      # 128, 64, ???
      #- [128,64,8]
      #- [128,64,16]
      #- [128,64,32]
      #- [128,64,64]

      # 128, 32, ???
